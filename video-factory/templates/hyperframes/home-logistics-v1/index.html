<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=900, height=1600" />
  <title>Hermes Home Logistics Golden Scene</title>
  <script src="./vendor/gsap.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#203140}
    body{font-family:Arial,sans-serif}
    [data-composition-id="home-logistics-v1"]{
      position:relative;width:900px;height:1600px;overflow:hidden;background:#314451;isolation:isolate
    }
    .world{position:absolute;inset:0;overflow:hidden;background:#6e866f}
    .terrain{position:absolute;inset:-180px -80px;background:
      radial-gradient(circle at 9% 8%,#31583b 0 32px,transparent 34px),
      radial-gradient(circle at 18% 22%,#3e6848 0 42px,transparent 44px),
      radial-gradient(circle at 8% 46%,#294f35 0 36px,transparent 38px),
      radial-gradient(circle at 17% 68%,#436d4b 0 46px,transparent 48px),
      radial-gradient(circle at 10% 88%,#31583b 0 34px,transparent 36px),
      radial-gradient(circle at 91% 12%,#31583b 0 34px,transparent 36px),
      radial-gradient(circle at 83% 31%,#446f4d 0 44px,transparent 46px),
      radial-gradient(circle at 92% 54%,#294f35 0 37px,transparent 39px),
      radial-gradient(circle at 82% 76%,#3c6546 0 48px,transparent 50px),
      radial-gradient(circle at 92% 92%,#31583b 0 36px,transparent 38px),
      linear-gradient(90deg,#71866c 0 19%,#576e58 19% 22%,transparent 22% 78%,#576e58 78% 81%,#71866c 81% 100%);
      filter:saturate(.88) contrast(.98)
    }
    .road-shadow{position:absolute;left:185px;top:-30px;width:530px;height:1660px;background:#1c252b;filter:blur(22px);opacity:.32}
    .road{position:absolute;left:205px;top:-80px;width:490px;height:1760px;background:
      linear-gradient(90deg,#262e33 0 3%,#3a4247 3% 48%,#323a3f 48% 52%,#3a4247 52% 97%,#262e33 97% 100%);
      box-shadow:inset 18px 0 22px rgba(255,255,255,.03),inset -18px 0 22px rgba(0,0,0,.12)
    }
    .road::before,.road::after{content:"";position:absolute;top:-300px;bottom:-300px;width:8px;background:repeating-linear-gradient(to bottom,rgba(245,241,214,.92) 0 58px,transparent 58px 112px);opacity:.92}
    .road::before{left:150px}.road::after{right:150px}
    .road-edge{position:absolute;top:-100px;width:10px;height:1800px;background:repeating-linear-gradient(to bottom,#e7e2c8 0 88px,#f7f4e5 88px 176px);opacity:.7}
    .road-edge.left{left:210px}.road-edge.right{right:210px}
    .road-speckle{position:absolute;left:205px;top:-120px;width:490px;height:1900px;opacity:.2;background:
      radial-gradient(circle,#0f1518 0 1.4px,transparent 1.7px) 0 0/31px 37px,
      radial-gradient(circle,#d9dee0 0 1px,transparent 1.4px) 17px 11px/47px 53px
    }
    .shadow-sweep{position:absolute;left:120px;top:-420px;width:660px;height:520px;background:linear-gradient(165deg,transparent 5%,rgba(9,18,23,.34) 45%,rgba(9,18,23,.08) 70%,transparent 76%);filter:blur(18px);transform:rotate(-4deg)}
    .truck-wrap{position:absolute;left:50%;top:53%;width:250px;height:590px;transform:translate(-50%,-50%);filter:drop-shadow(0 24px 20px rgba(0,0,0,.34))}
    .truck-wrap svg{width:100%;height:100%;display:block;overflow:visible}
    .wind-streak{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.26),transparent);opacity:.0;filter:blur(.5px)}
    .wind-streak.a{top:17%}.wind-streak.b{top:62%}.wind-streak.c{top:84%}
    .vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(8,18,26,.28),inset 0 -190px 140px rgba(8,18,26,.18);pointer-events:none}
    .light{position:absolute;inset:0;background:radial-gradient(circle at 18% 8%,rgba(255,232,177,.34),transparent 32%);mix-blend-mode:screen;opacity:.55}
  </style>
</head>
<body>
  <div id="root" data-composition-id="home-logistics-v1" data-start="0" data-duration="6" data-width="900" data-height="1600" data-fps="30">
    <div class="world">
      <div class="terrain" id="terrain"></div>
      <div class="road-shadow"></div>
      <div class="road" id="road"></div>
      <div class="road-edge left" id="edge-left"></div>
      <div class="road-edge right" id="edge-right"></div>
      <div class="road-speckle" id="speckle"></div>
      <div class="shadow-sweep" id="shadow-sweep"></div>

      <div class="truck-wrap" id="truck">
        <svg viewBox="0 0 250 590" aria-hidden="true">
          <defs>
            <linearGradient id="cab" x1="0" x2="1"><stop stop-color="#f6f7f7"/><stop offset=".55" stop-color="#dfe4e6"/><stop offset="1" stop-color="#b9c1c6"/></linearGradient>
            <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#c2cbd0"/><stop offset=".5" stop-color="#eef2f4"/><stop offset="1" stop-color="#88959d"/></linearGradient>
            <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#1a3446"/><stop offset="1" stop-color="#34586b"/></linearGradient>
            <linearGradient id="carRed" x1="0" x2="1"><stop stop-color="#8d1818"/><stop offset=".5" stop-color="#cc2f2f"/><stop offset="1" stop-color="#651010"/></linearGradient>
            <linearGradient id="carBlue" x1="0" x2="1"><stop stop-color="#163b60"/><stop offset=".5" stop-color="#2d6f9f"/><stop offset="1" stop-color="#0f2e4f"/></linearGradient>
            <linearGradient id="carPearl" x1="0" x2="1"><stop stop-color="#f0eee7"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#c8c8c1"/></linearGradient>
          </defs>
          <g id="tractor">
            <rect x="70" y="14" width="110" height="112" rx="28" fill="url(#cab)" stroke="#aeb7bd" stroke-width="3"/>
            <path d="M82 48 Q125 21 168 48 L160 78 H90Z" fill="url(#glass)" opacity=".95"/>
            <rect x="94" y="86" width="62" height="26" rx="8" fill="#c8d0d4"/>
            <rect x="59" y="40" width="15" height="48" rx="7" fill="#232a2f"/><rect x="176" y="40" width="15" height="48" rx="7" fill="#232a2f"/>
            <circle cx="66" cy="109" r="12" fill="#171b1f"/><circle cx="184" cy="109" r="12" fill="#171b1f"/>
            <rect x="102" y="119" width="46" height="24" rx="8" fill="#7f8a90"/>
          </g>
          <g id="trailer">
            <rect x="34" y="132" width="182" height="430" rx="16" fill="url(#steel)" stroke="#7f8a92" stroke-width="3"/>
            <rect x="48" y="146" width="154" height="404" rx="10" fill="#4d585f"/>
            <path d="M55 160H195M55 230H195M55 300H195M55 370H195M55 440H195M55 510H195" stroke="#9ca8ae" stroke-width="6" opacity=".65"/>
            <g opacity=".98">
              <g transform="translate(58 166)"><rect width="62" height="88" rx="18" fill="url(#carRed)"/><rect x="12" y="12" width="38" height="26" rx="9" fill="#5e1e1e"/><circle cx="8" cy="22" r="7" fill="#12171a"/><circle cx="54" cy="22" r="7" fill="#12171a"/><circle cx="8" cy="68" r="7" fill="#12171a"/><circle cx="54" cy="68" r="7" fill="#12171a"/></g>
              <g transform="translate(130 184)"><rect width="62" height="88" rx="18" fill="url(#carBlue)"/><rect x="12" y="12" width="38" height="26" rx="9" fill="#14304a"/><circle cx="8" cy="22" r="7" fill="#12171a"/><circle cx="54" cy="22" r="7" fill="#12171a"/><circle cx="8" cy="68" r="7" fill="#12171a"/><circle cx="54" cy="68" r="7" fill="#12171a"/></g>
              <g transform="translate(58 292)"><rect width="62" height="88" rx="18" fill="url(#carPearl)"/><rect x="12" y="12" width="38" height="26" rx="9" fill="#9aa3a8"/><circle cx="8" cy="22" r="7" fill="#12171a"/><circle cx="54" cy="22" r="7" fill="#12171a"/><circle cx="8" cy="68" r="7" fill="#12171a"/><circle cx="54" cy="68" r="7" fill="#12171a"/></g>
              <g transform="translate(130 310)"><rect width="62" height="88" rx="18" fill="url(#carRed)"/><rect x="12" y="12" width="38" height="26" rx="9" fill="#5e1e1e"/><circle cx="8" cy="22" r="7" fill="#12171a"/><circle cx="54" cy="22" r="7" fill="#12171a"/><circle cx="8" cy="68" r="7" fill="#12171a"/><circle cx="54" cy="68" r="7" fill="#12171a"/></g>
              <g transform="translate(58 418)"><rect width="62" height="88" rx="18" fill="url(#carBlue)"/><rect x="12" y="12" width="38" height="26" rx="9" fill="#14304a"/><circle cx="8" cy="22" r="7" fill="#12171a"/><circle cx="54" cy="22" r="7" fill="#12171a"/><circle cx="8" cy="68" r="7" fill="#12171a"/><circle cx="54" cy="68" r="7" fill="#12171a"/></g>
              <g transform="translate(130 436)"><rect width="62" height="88" rx="18" fill="url(#carPearl)"/><rect x="12" y="12" width="38" height="26" rx="9" fill="#9aa3a8"/><circle cx="8" cy="22" r="7" fill="#12171a"/><circle cx="54" cy="22" r="7" fill="#12171a"/><circle cx="8" cy="68" r="7" fill="#12171a"/><circle cx="54" cy="68" r="7" fill="#12171a"/></g>
            </g>
            <circle cx="49" cy="540" r="14" fill="#171b1f"/><circle cx="201" cy="540" r="14" fill="#171b1f"/>
          </g>
        </svg>
      </div>

      <div class="wind-streak a" id="wind-a"></div>
      <div class="wind-streak b" id="wind-b"></div>
      <div class="wind-streak c" id="wind-c"></div>
      <div class="light" id="light"></div>
      <div class="vignette"></div>
    </div>
    <script>
      (() => {
        "use strict";
        const root = document.getElementById("root");
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#terrain", { y: -80 }, { y: 160, duration: 6, ease: "none" }, 0)
          .fromTo("#road", { backgroundPositionY: "0px" }, { backgroundPositionY: "336px", duration: 6, ease: "none" }, 0)
          .fromTo("#edge-left", { backgroundPositionY: "0px" }, { backgroundPositionY: "352px", duration: 6, ease: "none" }, 0)
          .fromTo("#edge-right", { backgroundPositionY: "0px" }, { backgroundPositionY: "352px", duration: 6, ease: "none" }, 0)
          .fromTo("#speckle", { y: -70 }, { y: 150, duration: 6, ease: "none" }, 0)
          .fromTo("#truck", { y: 18, rotate: -0.22 }, { y: -10, rotate: 0.18, duration: 3, ease: "sine.inOut" }, 0)
          .to("#truck", { y: 18, rotate: -0.22, duration: 3, ease: "sine.inOut" }, 3)
          .fromTo("#shadow-sweep", { y: -300, opacity: .2 }, { y: 1840, opacity: .48, duration: 5.2, ease: "none" }, .35)
          .fromTo("#light", { opacity: .62 }, { opacity: .36, duration: 3, ease: "sine.inOut" }, 0)
          .to("#light", { opacity: .62, duration: 3, ease: "sine.inOut" }, 3)
          .fromTo("#wind-a", { y: -200, opacity: 0 }, { y: 1200, opacity: .23, duration: 1.6, ease: "none" }, .8)
          .fromTo("#wind-b", { y: -250, opacity: 0 }, { y: 1100, opacity: .18, duration: 1.9, ease: "none" }, 2.3)
          .fromTo("#wind-c", { y: -300, opacity: 0 }, { y: 900, opacity: .16, duration: 1.7, ease: "none" }, 4.1);

        window.__timelines[root.dataset.compositionId] = tl;
      })();
    </script>
  </div>
</body>
</html>
