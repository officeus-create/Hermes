<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hermes Connect Icon">
  <defs>
    <linearGradient id="hermesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="hermesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="50%" stop-color="#9E86FF"/>
      <stop offset="100%" stop-color="#5AC8FA"/>
    </linearGradient>
    <radialGradient id="hermesGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C5CFF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#hermesBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#hermesGlow)"/>

  <!-- Intelligent Knot Brand Mark -->
  <g transform="translate(104, 104) scale(6.9)" filter="url(#shadow)">
    <path d="M8 12c0-3 2.4-5.4 5.4-5.4h7.2c2.6 0 4.7 2.1 4.7 4.7v3.4c0 2.6-2.1 4.7-4.7 4.7h-7.2A5.4 5.4 0 0 0 8 24.8V28" 
          fill="none" stroke="url(#hermesGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 32c0 3-2.4 5.4-5.4 5.4h-7.2a4.7 4.7 0 0 1-4.7-4.7v-3.4c0-2.6 2.1-4.7 4.7-4.7h7.2a5.4 5.4 0 0 0 5.4-5.4V16" 
          fill="none" stroke="url(#hermesGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="12" r="2.5" fill="#7FD1B6"/>
  </g>
</svg>
