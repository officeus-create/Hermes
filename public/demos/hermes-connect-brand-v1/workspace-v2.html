<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0B0D12">
  <meta name="description" content="Hermes Connect animated workspace visual review V2.">
  <title>Hermes Connect · Animated Workspace V2</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B0D12}
    #workspace-frame{display:block;width:100%;height:100%;border:0;background:#F7F6F3}
    .loading{position:fixed;inset:0;display:grid;place-items:center;background:#0B0D12;color:#F7F6F3;font:600 14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.02em;z-index:3;transition:opacity .35s ease}
    .loading span{display:flex;align-items:center;gap:12px}.loading i{width:10px;height:10px;border-radius:50%;background:#7C5CFF;box-shadow:20px 0 #5AC8FA,40px 0 #7FD1B6;animation:pulse 1.25s ease-in-out infinite alternate}
    @keyframes pulse{to{transform:translateX(40px);box-shadow:-20px 0 #5AC8FA,-40px 0 #7FD1B6}}
    .ready .loading{opacity:0;pointer-events:none}
    @media (prefers-reduced-motion:reduce){.loading i{animation:none}}
  </style>
</head>
<body>
  <div class="loading"><span><i></i>Loading Hermes Connect V2</span></div>
  <iframe id="workspace-frame" title="Hermes Connect animated workspace" src="./workspace.html"></iframe>
  <script src="./workspace-v2.js"></script>
</body>
</html>
