# Reviewed, digest-pinned, non-production local-only pilot. NEVER publish 3001.
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi${FREELLMAPI_IMAGE_DIGEST:?Set reviewed sha256 digest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Generate persistent 64-char hex key}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3001/api/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  freellmapi-data:
