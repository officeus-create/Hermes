name: Validate and open Insights content PR

on:
  push:
    branches:
      - 'automation/insights-*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: insights-content-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-open:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main

      - name: Enforce generated-content-only scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          if [ -z "$changed" ]; then
            echo "No unpublished Insights delta; PR already merged or no content generated."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Blocked automation change outside generated Insights scope fails closed.
          # Execute the standalone validator from trusted main, not content HEAD.
          git show origin/main:scripts/insights-content-scope.mjs > "$RUNNER_TEMP/insights-content-scope.mjs"
          node "$RUNNER_TEMP/insights-content-scope.mjs" origin/main HEAD
          echo "$changed"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.scope.outputs.has_changes == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.has_changes == 'true'
        run: npm ci

      - name: Build and run project gates
        if: steps.scope.outputs.has_changes == 'true'
        run: npm run build

      - name: Validate Insights release gates
        if: steps.scope.outputs.has_changes == 'true'
        run: |
          node scripts/insights-pipeline.test.mjs
          node scripts/insights-human-approval-contract.test.mjs
          node scripts/release-manifest.test.mjs
          node scripts/production-seo-hygiene-contract.test.mjs
          node scripts/internal-link-audit.test.mjs

      - name: Create or find draft PR
        if: steps.scope.outputs.has_changes == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --base main --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --draft --base main --head "$GITHUB_REF_NAME" \
              --title "content(insights): publish reviewed Telegram news" \
              --body "Generated Hermes Insights update. Scope is restricted to the Insights registry, sitemap, and release delta. This branch passed the full build and Insights release gates before PR creation. Publication remains blocked: an authorized human must review the exact PR head, mark the draft ready, and merge it through GitHub so the human action is retained as the approval receipt."
            pr="$(gh pr list --base main --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')"
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "Draft PR #$pr remains blocked until an authorized human reviews the exact head and explicitly releases it."

      - name: Reset publication approval for exact head
        if: steps.scope.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          state_file="$RUNNER_TEMP/insights-pr-state.json"
          gh pr view "$PR_NUMBER" --json number,headRefOid,isDraft,autoMergeRequest > "$state_file"
          plan="$(node scripts/insights-pr-approval-gate.mjs --mode plan --state-file "$state_file" --expected-head "$expected_head")"
          disable_auto_merge="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.disableAutoMerge))' "$plan")"
          convert_to_draft="$(node -e 'const p=JSON.parse(process.argv[1]); process.stdout.write(String(p.convertToDraft))' "$plan")"
          if [ "$disable_auto_merge" = "true" ]; then
            gh pr merge "$PR_NUMBER" --disable-auto
          fi
          if [ "$convert_to_draft" = "true" ]; then
            gh pr ready "$PR_NUMBER" --undo
          fi
          gh pr view "$PR_NUMBER" --json number,headRefOid,isDraft,autoMergeRequest > "$state_file"
          node scripts/insights-pr-approval-gate.mjs --mode verify --state-file "$state_file" --expected-head "$expected_head"
