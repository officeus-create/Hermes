name: Measure production Lighthouse on command

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-lighthouse-manual
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      TARGET_URL: https://hermeslogisticsus.com/

    steps:
      - name: Check out approved main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Prepare output directory
        run: mkdir -p artifacts/lighthouse-production

      - name: Run three comparable first-visit mobile lab passes
        shell: bash
        run: |
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 "$TARGET_URL" \
              --output=json \
              --output-path="artifacts/lighthouse-production/mobile-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done

      - name: Run three comparable desktop lab passes
        shell: bash
        run: |
          for run in 1 2 3; do
            npx --yes lighthouse@13.4.1 "$TARGET_URL" \
              --preset=desktop \
              --output=json \
              --output-path="artifacts/lighthouse-production/desktop-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done

      - name: Run deterministic Agentic Browsing readiness pass
        shell: bash
        run: |
          npx --yes lighthouse@13.4.1 "$TARGET_URL" \
            --output=json \
            --output-path="artifacts/lighthouse-production/agentic.json" \
            --only-categories=agentic-browsing \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet

      - name: Summarize medians and baseline comparison
        run: node scripts/summarize-production-lighthouse.mjs

      - name: Publish sanitized performance evidence
        shell: bash
        run: |
          {
            echo "## Production Lighthouse measurement"
            echo
            cat artifacts/lighthouse-production/summary.md
            echo
            echo "> Session-state causality is not measured with URL fragments. The prior hash-based regular-home lane was invalidated by same-URL paired evidence in #459."
            echo
            echo "Measured approved \`main\` commit: \`${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lab reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-lighthouse-measurement
          path: artifacts/lighthouse-production/
          if-no-files-found: error
          retention-days: 30
