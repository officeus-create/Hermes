name: Load Board canonical fragment migration

on:
  push:
    branches:
      - seo/load-board-canonical-fragment-state-20260909
    paths:
      - .github/workflows/load-board-fragment-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/load-board-canonical-fragment-state-20260909
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded migration
        run: python scripts/migrate-load-board-fragment-state.py
      - name: Verify install and build
        run: |
          npm ci --ignore-scripts
          npm run build
          npx playwright test tests/load-board-carrier-operating-path.spec.ts --list
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/load-board-fragment-migration.yml scripts/migrate-load-board-fragment-state.py
          git add src tests scripts
          git diff --cached --check
          git commit -m "fix(seo): move Load Board role state behind fragments"
          git push origin HEAD:seo/load-board-canonical-fragment-state-20260909
