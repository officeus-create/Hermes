name: Hermes Connect visual evidence

on:
  pull_request:
    paths:
      - 'public/demos/hermes-connect/**'
      - 'public/design-owner-polish.css'
      - 'public/design-owner-polish.js'
      - 'src/components/HermesConnectLauncher.astro'
      - 'src/components/AcademyScreenFlow.astro'
      - 'src/components/DepartmentMenuEnhancer.astro'
      - 'src/components/DepartmentMenuLocalization.astro'
      - 'src/components/LocalizedOverviewPage.astro'
      - 'src/components/MotionLayer.astro'
      - 'src/components/RussianLocaleIntegrity.astro'
      - 'src/components/SiteFooter.astro'
      - 'src/components/SiteHeader.astro'
      - 'src/data/academy-public.ts'
      - 'src/data/public-paths.ts'
      - 'src/layouts/BaseLayout.astro'
      - 'src/styles/hermes-connect-**'
      - 'src/styles/hermes-logistics-commercial-polish.css'
      - 'src/styles/hermes-marketing-socials-polish.css'
      - 'src/styles/hermes-repair-private-mobile.css'
      - 'src/styles/hermes-brand-system.css'
      - 'src/pages/services/hermes-connect/**'
      - 'src/pages/paths/**'
      - 'scripts/capture-route-screenshots.mjs'
      - 'scripts/route-screenshot-contract.mjs'
      - 'scripts/route-screenshot-contract.test.mjs'
      - 'scripts/validate-route-screenshot-layout.mjs'
      - 'scripts/hermes-connect-mark-contract.test.mjs'
      - 'scripts/hermes-approved-color-application.test.mjs'
      - 'scripts/academy-russian-private-contract.test.mjs'
      - 'scripts/repair-russian-private-contract.test.mjs'
      - '.github/workflows/hermes-connect-visual-evidence.yml'

permissions:
  contents: read

jobs:
  capture-visual-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Option 02 mark geometry
        run: node scripts/hermes-connect-mark-contract.test.mjs

      - name: Verify approved Hermes color application
        run: node scripts/hermes-approved-color-application.test.mjs

      - name: Verify Academy Russian private runtime
        run: node --test scripts/academy-russian-private-contract.test.mjs

      - name: Verify Repair Russian private runtime
        run: node --test scripts/repair-russian-private-contract.test.mjs

      - name: Build website
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture 1440/1024/768/430/390 route evidence
        shell: bash
        run: |
          python3 -m http.server 4321 --directory dist > /tmp/hermes-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4321/ > /dev/null
          GITHUB_SHA="${{ github.event.pull_request.head.sha }}" node scripts/capture-route-screenshots.mjs
          node scripts/validate-route-screenshot-layout.mjs

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: hermes-connect-visual-evidence-${{ github.event.pull_request.head.sha }}
          path: artifacts/route-screenshots
          if-no-files-found: error
          retention-days: 14
