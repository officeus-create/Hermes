name: One-time Hermes Connect release retirement reconciliation

on:
  push:
    branches: [cleanup/connect-canonical-consolidation]
    paths:
      - .github/workflows/one-time-connect-release-retirement.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/connect-canonical-consolidation
      - name: Reconcile retired routes and canonical replacement routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          test_path = Path('scripts/release-manifest.test.mjs')
          text = test_path.read_text()

          old_decl = 'const deltaRows = [];\nfor (const { filename, data } of deltas) {'
          new_decl = 'const deltaRows = [];\nconst deltaRemovals = [];\nfor (const { filename, data } of deltas) {'
          if old_decl not in text:
              raise SystemExit('release manifest delta declaration anchor not found')
          text = text.replace(old_decl, new_decl, 1)

          old_acceptance = '''  assert(data.acceptance?.route_count_added === data.additions.length, `${filename}: route-count acceptance is incorrect.`);\n  const indexableAdditions = data.additions.filter((row) => row.indexability === "indexable").length;'''
          new_acceptance = '''  assert(data.acceptance?.route_count_added === data.additions.length, `${filename}: route-count acceptance is incorrect.`);\n  const removals = Array.isArray(data.removals) ? data.removals : [];\n  if (removals.length > 0) {\n    assert(data.acceptance?.route_count_removed === removals.length, `${filename}: removed-route acceptance is incorrect.`);\n    for (const removal of removals) {\n      assert(typeof removal?.route === "string" && removal.route.length > 0, `${filename}: removal route is missing.`);\n      assert(typeof removal?.reason === "string" && removal.reason.length > 0, `${filename}: removal reason is missing for ${removal.route}.`);\n      deltaRemovals.push({ ...removal, release_delta: data.release_delta });\n    }\n  }\n  const indexableAdditions = data.additions.filter((row) => row.indexability === "indexable").length;'''
          if old_acceptance not in text:
              raise SystemExit('release manifest acceptance anchor not found')
          text = text.replace(old_acceptance, new_acceptance, 1)

          old_map = '''const baselineRows = manifest.routes.filter((row) => row.source_state === "current_main");\nconst currentRows = [...baselineRows, ...deltaRows];\nconst manifestByRoute = new Map();\nfor (const row of currentRows) {\n  assert(!manifestByRoute.has(row.route), `Release manifest route is declared more than once: ${row.route}`);\n  manifestByRoute.set(row.route, row);\n}\nassert(currentRows.length === htmlFiles.length, `Manifest plus deltas has ${currentRows.length} current-main routes; build has ${htmlFiles.length}.`);'''
          new_map = '''const baselineRows = manifest.routes.filter((row) => row.source_state === "current_main");\nconst manifestByRoute = new Map();\nfor (const row of [...baselineRows, ...deltaRows]) {\n  assert(!manifestByRoute.has(row.route), `Release manifest route is declared more than once: ${row.route}`);\n  manifestByRoute.set(row.route, row);\n}\nconst removedRows = [];\nfor (const removal of deltaRemovals) {\n  const existing = manifestByRoute.get(removal.route);\n  assert(existing, `Release manifest removal targets an unknown route: ${removal.route}`);\n  removedRows.push(existing);\n  manifestByRoute.delete(removal.route);\n}\nconst currentRows = [...manifestByRoute.values()];\nassert(currentRows.length === htmlFiles.length, `Manifest plus deltas after removals has ${currentRows.length} current-main routes; build has ${htmlFiles.length}.`);'''
          if old_map not in text:
              raise SystemExit('release manifest route-map anchor not found')
          text = text.replace(old_map, new_map, 1)

          old_indexable = '''const deltaIndexableCount = deltaRows.filter((row) => row.indexability === "indexable").length;\nconst currentSource = manifest.sources.find((source) => source.id === "current_main");\nconst expectedIndexableCount = currentSource.indexable_route_count + deltaIndexableCount;'''
          new_indexable = '''const deltaIndexableCount = deltaRows.filter((row) => row.indexability === "indexable").length;\nconst removedIndexableCount = removedRows.filter((row) => row.indexability === "indexable").length;\nconst currentSource = manifest.sources.find((source) => source.id === "current_main");\nconst expectedIndexableCount = currentSource.indexable_route_count + deltaIndexableCount - removedIndexableCount;'''
          if old_indexable not in text:
              raise SystemExit('release manifest indexable-count anchor not found')
          text = text.replace(old_indexable, new_indexable, 1)

          old_final = 'assert(baselineRows.length + deltaRows.length === htmlFiles.length, "Baseline and release-delta route counts do not reconcile.");'
          new_final = 'assert(currentRows.length === htmlFiles.length, "Baseline, release deltas, and retired-route removals do not reconcile.");'
          if old_final not in text:
              raise SystemExit('release manifest final reconciliation anchor not found')
          text = text.replace(old_final, new_final, 1)
          test_path.write_text(text)

          delta = {
            'schema_version': 1,
            'base_manifest': 'docs/release-manifest-2026-08-01.json',
            'release_delta': '2026-08-15-hermes-connect-canonical-consolidation',
            'generated_at': '2026-08-15T09:48:00Z',
            'status': 'PENDING_PRODUCTION_DEPLOYMENT',
            'additions': [
              {
                'route': '/demos/hermes-connect/workspace.html',
                'source_state': 'current_main', 'indexability': 'noindex', 'robots': 'noindex,nofollow',
                'canonical': 'https://hermeslogisticsus.com/demos/hermes-connect/workspace.html', 'sitemap_owner': None,
                'source_file': 'public/demos/hermes-connect/workspace.html', 'status': 'COMPLETE',
                'blocker': 'Canonical responsive generic Connect preview workspace for desktop and mobile browsers.',
                'response_status': 200, 'comparison': {'production': 'pending_deployment', 'immutable_release': 'missing'}
              },
              {
                'route': '/demos/hermes-connect/review.html',
                'source_state': 'current_main', 'indexability': 'noindex', 'robots': 'noindex,nofollow',
                'canonical': 'https://hermeslogisticsus.com/demos/hermes-connect/review.html', 'sitemap_owner': None,
                'source_file': 'public/demos/hermes-connect/review.html', 'status': 'COMPLETE',
                'blocker': 'Private canonical review hub; retired V1/V2 alternatives are no longer separate product choices.',
                'response_status': 200, 'comparison': {'production': 'pending_deployment', 'immutable_release': 'missing'}
              },
              {
                'route': '/demos/hermes-connect/sales-roleplay.html',
                'source_state': 'current_main', 'indexability': 'noindex', 'robots': 'noindex,nofollow',
                'canonical': 'https://hermeslogisticsus.com/demos/hermes-connect/sales-roleplay.html', 'sitemap_owner': None,
                'source_file': 'public/demos/hermes-connect/sales-roleplay.html', 'status': 'COMPLETE',
                'blocker': 'Controlled Hermes Sales Coach visual prototype retained in the canonical Connect tree.',
                'response_status': 200, 'comparison': {'production': 'pending_deployment', 'immutable_release': 'missing'}
              }
            ],
            'removals': [
              {'route': '/demos/hermes-connect-brand-v1/', 'replacement': 'https://connect.hermeslogisticsus.com/', 'reason': 'Duplicate Brand V1 landing shell retired during canonical consolidation.'},
              {'route': '/demos/hermes-connect-brand-v1/sales-roleplay.html', 'replacement': 'https://connect.hermeslogisticsus.com/sales-roleplay.html', 'reason': 'Moved into the canonical Connect asset tree.'},
              {'route': '/demos/hermes-connect-brand-v1/mobile.html', 'replacement': 'https://connect.hermeslogisticsus.com/', 'reason': 'Separate mobile implementation retired in favor of one responsive workspace.'},
              {'route': '/demos/hermes-connect-brand-v1/workspace.html', 'replacement': 'https://connect.hermeslogisticsus.com/', 'reason': 'Brand V1 workspace path retired after moving the best workspace into the canonical tree.'},
              {'route': '/demos/hermes-connect-brand-v1/workspace-v2.html', 'replacement': 'https://connect.hermeslogisticsus.com/', 'reason': 'Visual-review V2 duplicate retired.'},
              {'route': '/demos/hermes-connect-brand-v1/review.html', 'replacement': 'https://connect.hermeslogisticsus.com/review.html', 'reason': 'Review hub moved into the canonical Connect asset tree.'}
            ],
            'acceptance': {
              'route_count_added': 3,
              'route_count_removed': 6,
              'indexable_route_count_added': 0,
              'requires_green_current_head_ci': True,
              'requires_production_snapshot_reconciliation_after_deploy': True
            }
          }
          Path('docs/release-manifest-deltas/2026-08-15-hermes-connect-canonical-consolidation.json').write_text(json.dumps(delta, indent=2) + '\n')

          repair = Path('src/pages/services/hermes-connect/repair-shops.astro')
          repair_text = repair.read_text()
          old_icon = '/demos/hermes-connect-brand-v1/apple-touch-icon.png'
          new_icon = '/demos/hermes-connect/apple-touch-icon.png'
          if old_icon not in repair_text:
              raise SystemExit('expected retired Repair Shop icon path not found')
          repair.write_text(repair_text.replace(old_icon, new_icon))
          PY

          git diff --check
          node --check scripts/release-manifest.test.mjs
      - name: Commit retirement reconciliation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Hermes Release Bot"
          git config user.email "officeus@hermeslogisticsus.com"
          git rm .github/workflows/one-time-connect-release-retirement.yml
          git add scripts/release-manifest.test.mjs docs/release-manifest-deltas/2026-08-15-hermes-connect-canonical-consolidation.json src/pages/services/hermes-connect/repair-shops.astro
          git commit -m "refactor(connect): retire duplicate routes in release manifest"
          git push origin HEAD:cleanup/connect-canonical-consolidation
