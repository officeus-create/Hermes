name: Apply P4 public account affordance

on:
  push:
    branches:
      - design/p4-public-account-affordance-2026-09-03
    paths:
      - .github/workflows/apply-p4-public-account-affordance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/p4-public-account-affordance-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bounded patch
        run: node scripts/apply-p4-public-account-affordance.mjs
      - name: Run account switcher contract
        run: node --test scripts/hermes-connect-account-switcher-contract.test.mjs
      - name: Validate bounded diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed='^(src/components/HermesConnectAccountSwitcher\.astro|src/components/SiteHeader\.astro|scripts/hermes-connect-account-switcher-contract\.test\.mjs|tests/hermes-connect-account-portfolio\.spec\.ts)$'
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            printf '%s\n' "$path" | grep -Eq "$allowed" || { echo "Unexpected product diff: $path"; exit 1; }
          done <<< "$changed"
          grep -q 'publicSafe' src/components/HermesConnectAccountSwitcher.astro
          grep -q 'current="neutral" mode="menu" publicSafe' src/components/SiteHeader.astro
      - name: Commit product patch and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/apply-p4-public-account-affordance.mjs
          rm .github/workflows/apply-p4-public-account-affordance.yml
          git add src/components/HermesConnectAccountSwitcher.astro src/components/SiteHeader.astro scripts/hermes-connect-account-switcher-contract.test.mjs tests/hermes-connect-account-portfolio.spec.ts scripts/apply-p4-public-account-affordance.mjs .github/workflows/apply-p4-public-account-affordance.yml
          git config user.name 'officeus-create'
          git config user.email 'officeus@hermeslogisticsus.com'
          git commit -m 'feat(design): add public authenticated Hermes account affordance'
          git push origin HEAD:design/p4-public-account-affordance-2026-09-03
