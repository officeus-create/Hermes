name: Carrier Contract Production Smoke

on:
  push:
    branches: [carrier-contract-production-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for production deployment and sign synthetic internal packet
        env:
          SIGNATURE_JPEG_B64: 
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const base = 'https://hermeslogisticsus.com';
          const expectedSha = 'ac35ae765617010dd7551b4a22537b32715923c49601d9aac1f21bbb5e0904a8';
          const noCache = () => `?smoke=${Date.now()}`;

          async function ready() {
            try {
              const [sign, onboarding, pdf] = await Promise.all([
                fetch(base + '/sign/' + noCache(), {headers:{'Cache-Control':'no-cache'}}),
                fetch(base + '/logistics/carrier-onboarding/' + noCache(), {headers:{'Cache-Control':'no-cache'}}),
                fetch(base + '/contracts/Hermes_Carrier_Agreement_EXECUTION_v2026-08-06.pdf' + noCache(), {headers:{'Cache-Control':'no-cache'}}),
              ]);
              if (!sign.ok || !onboarding.ok || !pdf.ok) return false;
              const signText = await sign.text();
              const onboardingText = await onboarding.text();
              const pdfBytes = Buffer.from(await pdf.arrayBuffer());
              const sha = crypto.createHash('sha256').update(pdfBytes).digest('hex');
              return signText.includes('approved execution master') &&
                onboardingText.includes('Execution agreement') &&
                sha === expectedSha;
            } catch (error) {
              console.log('not ready:', error.message);
              return false;
            }
          }

          let deployed = false;
          for (let i = 1; i <= 36; i++) {
            if (await ready()) { deployed = true; console.log(`production deployment ready on attempt ${i}`); break; }
            console.log(`waiting for production deployment: ${i}/36`);
            await sleep(10000);
          }
          if (!deployed) throw new Error('Production did not expose the activated carrier contract within 6 minutes.');

          const requestId = `contract_prod_smoke_${Date.now()}`;
          const payload = {
            request_id: requestId,
            selected_plan: 'pro',
            service_percentage: '8',
            custom_scope: '',
            legal_company_name: 'TEST — HERMES CONTRACT VERIFICATION — NOT A REAL CARRIER',
            dba_name: 'TEST ONLY',
            mc_number: '0000000',
            usdot_number: '',
            company_website: 'https://hermeslogisticsus.com',
            signer_name: 'Hermes Internal Verification',
            signer_title: 'Internal Synthetic Test',
            signer_email: 'officeus@hermeslogisticsus.com',
            signer_phone: '+1 262 302 3626',
            sales_contact: 'INTERNAL-SMOKE',
            offer_code: 'TEST-ONLY',
            typed_signature: 'Hermes Internal Verification',
            signature_jpeg: `data:image/jpeg;base64,${process.env.SIGNATURE_JPEG_B64}`,
            signature_width: 600,
            signature_height: 180,
            consent_electronic_records: true,
            consent_authority: true,
            consent_document_review: true,
            consent_selected_scope: true,
            submitted_at: new Date().toISOString(),
          };
          const response = await fetch(base + '/api/carrier-contract', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Origin': base,
              'Idempotency-Key': requestId,
              'User-Agent': 'Hermes production contract smoke test',
            },
            body: JSON.stringify(payload),
          });
          const mode = response.headers.get('x-hermes-document-mode');
          const delivery = response.headers.get('x-hermes-delivery');
          console.log('POST status:', response.status, 'mode:', mode, 'delivery:', delivery, 'type:', response.headers.get('content-type'));
          if (response.status !== 200 || mode !== 'live' || delivery !== 'delivered') {
            const text = await response.text();
            throw new Error(`Production signing failed: ${response.status} mode=${mode} delivery=${delivery} body=${text.slice(0,500)}`);
          }
          const signedPdf = Buffer.from(await response.arrayBuffer());
          if (!signedPdf.subarray(0,8).toString().startsWith('%PDF-1.4')) throw new Error('Signed response is not a PDF.');
          console.log('PRODUCTION_CARRIER_CONTRACT_SMOKE=PASS');
          console.log('Synthetic company:', payload.legal_company_name);
          console.log('Expected mailbox:', payload.signer_email);
          NODE
