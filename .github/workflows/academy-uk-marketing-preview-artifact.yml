name: Academy Ukrainian Marketing preview artifact

on:
  push:
    branches:
      - seo/academy-uk-marketing-owner-2026-08-19

permissions:
  contents: read

jobs:
  capture-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture Academy Marketing previews
        run: npx playwright test tests/academy-ukrainian-marketing.spec.ts
      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: academy-ukrainian-marketing-preview
          path: artifacts/academy-ukrainian-marketing/*.png
          if-no-files-found: error
          retention-days: 3

# Temporary visual-QA workflow. Remove before production merge.
