name: Carrier Market Economics Bounded Integration

on:
  push:
    branches:
      - seo/equipment-market-economics-20260909

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo/equipment-market-economics-20260909
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Apply bounded integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          economics = Path('src/components/CarrierMarketEconomics.astro')
          text = economics.read_text()
          old = 'const loadBoardHref = `/load-board/#role=carrier&equipment=${encodeURIComponent(config.loadBoardEquipment)}&target=available-loads`;'
          new = 'const loadBoardHref = "/load-board/#available-loads";'
          if old not in text:
              raise SystemExit('CarrierMarketEconomics load-board state marker not found')
          economics.write_text(text.replace(old, new, 1))

          data = Path('src/data/carrier-market-economics.ts')
          text = data.read_text()
          old = '''export function marketPageHref(equipment: CarrierEquipmentSlug, marketSlug: string) {
            if (equipment === "car-hauling") return `/logistics/car-hauler-loads/${marketSlug}/`;
            return `/logistics/equipment-market/${equipment}/${marketSlug}/`;
          }'''
          new = '''export function marketPageHref(equipment: CarrierEquipmentSlug, marketSlug: string) {
            if (equipment === "car-hauling") return `/logistics/car-hauler-loads/${marketSlug}/`;
            return `/paths/logistics/carriers/${equipment}/#market-${marketSlug}`;
          }'''
          if old not in text:
              raise SystemExit('marketPageHref marker not found')
          data.write_text(text.replace(old, new, 1))

          geo = Path('src/components/CarHaulerGeoPage.astro')
          text = geo.read_text()
          import_marker = 'import SiteFooter from "./SiteFooter.astro";\n'
          import_new = import_marker + 'import CarrierMarketEconomics from "./CarrierMarketEconomics.astro";\n'
          if import_marker not in text:
              raise SystemExit('CarHaulerGeoPage import marker not found')
          text = text.replace(import_marker, import_new, 1)

          old_load = 'const loadBoardPath = "/load-board/?role=carrier&equipment=car_hauler#available-loads";'
          new_load = 'const loadBoardPath = "/load-board/#available-loads";'
          if old_load not in text:
              raise SystemExit('CarHaulerGeoPage legacy load-board marker not found')
          text = text.replace(old_load, new_load, 1)

          vehicle_marker = '    <section class="section" data-carrier-geo-section="vehicle_fit">'
          economics_block = '''    <CarrierMarketEconomics
              equipment="car-hauling"
              market={{ city: market.city, state: market.state, region: market.region }}
            />

          ''' + vehicle_marker
          if vehicle_marker not in text:
              raise SystemExit('CarHaulerGeoPage vehicle-fit marker not found')
          text = text.replace(vehicle_marker, economics_block, 1)
          geo.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run focused carrier economics browser regression
        run: npx playwright test tests/carrier-market-economics.spec.ts --project=chromium

      - name: Commit verified integration and self-remove workflow
        run: |
          rm .github/workflows/carrier-market-economics-bounded.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CarrierMarketEconomics.astro src/data/carrier-market-economics.ts src/components/CarHaulerGeoPage.astro tests/carrier-market-economics.spec.ts .github/workflows/carrier-market-economics-bounded.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No verified integration changes to commit"
            exit 0
          fi
          git commit -m "feat(cro): integrate carrier economics across equipment markets"
          git push origin HEAD:seo/equipment-market-economics-20260909
