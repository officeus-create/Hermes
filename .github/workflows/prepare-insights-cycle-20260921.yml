name: Prepare governed Insights cycle 2026-09-21

on:
  push:
    branches:
      - staging/insights-cycle-20260921

permissions:
  contents: write

concurrency:
  group: prepare-insights-cycle-20260921
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Normalize Marketing evidence and score
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'tmp/insights-cycle/meta-one-business-tools-september-2026.json';
          const post = JSON.parse(fs.readFileSync(file, 'utf8'));
          post.evidence.push({
            sourceId: 'PUBLIC-WEB-CURRENT',
            kind: 'first_party_current',
            label: 'Hermes current Marketing conversion architecture',
            use: 'context_only',
            url: 'https://hermeslogisticsus.com/paths/marketing/',
            observedAt: '2026-09-21',
            notes: 'Current public Hermes Marketing owner page supplies first-party context and the owned conversion path; it is not evidence for Meta product claims.'
          });
          post.publicationScore = {
            score: 80,
            recommendation: 'standalone',
            reasons: [
              '+20 freshness',
              '+20 source authority',
              '+15 first-party evidence',
              '+15 search value',
              '+10 internal-link fit'
            ]
          };
          fs.writeFileSync(file, JSON.stringify(post, null, 2) + '\n');
          NODE

      - name: Verify deterministic publication routing
        shell: bash
        run: |
          node scripts/score-insight-candidate.mjs --input tmp/insights-cycle/ucr-2027.score.json > /tmp/ucr-score.json
          node scripts/score-insight-candidate.mjs --input tmp/insights-cycle/meta-one.score.json > /tmp/meta-score.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ucr = JSON.parse(fs.readFileSync('/tmp/ucr-score.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('/tmp/meta-score.json', 'utf8'));
          if (ucr.score !== 94 || ucr.recommendation !== 'standalone_historical') throw new Error(`Unexpected UCR score: ${JSON.stringify(ucr)}`);
          if (meta.score !== 80 || meta.recommendation !== 'standalone') throw new Error(`Unexpected Meta score: ${JSON.stringify(meta)}`);
          console.log('UCR routing:', ucr);
          console.log('Meta routing:', meta);
          NODE

      - name: Publish candidates into canonical registry
        run: |
          node scripts/publish-insight.mjs --input tmp/insights-cycle/ucr-2027-fees-carrier-registration.json
          node scripts/publish-insight.mjs --input tmp/insights-cycle/meta-one-business-tools-september-2026.json
          node scripts/sync-insights-sitemap.mjs
          node scripts/sync-insights-release-delta.mjs
          node scripts/insights-pipeline.test.mjs

      - name: Commit generated-only state and remove staging inputs
        shell: bash
        run: |
          rm -rf tmp/insights-cycle
          rm -f .github/workflows/prepare-insights-cycle-20260921.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'content(insights): prepare 2026-09-21 governed intelligence cycle'
          git push origin HEAD:staging/insights-cycle-20260921
