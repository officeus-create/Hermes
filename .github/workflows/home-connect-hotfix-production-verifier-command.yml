name: Verify homepage and Connect hotfix on command

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-connect-hotfix-production-command
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out approved main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install verifier dependencies
        run: npm ci

      - name: Install Chromium for public browser verification
        run: npx playwright install --with-deps chromium

      - name: Run exact public hotfix verifier
        id: verify
        shell: bash
        run: |
          set +e
          node scripts/check-home-connect-hotfix-production.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized result to issue
        shell: bash
        run: |
          {
            if [ -f artifacts/home-connect-hotfix-production.md ]; then
              cat artifacts/home-connect-hotfix-production.md
            else
              echo "# Homepage + Hermes Connect hotfix production verification"
              echo
              echo "The verifier did not produce its sanitized report."
            fi
            echo
            echo "Verifier exit code: \`${{ steps.verify.outputs.status }}\`."
            echo "Checked approved \`main\` commit: \`${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-connect-hotfix-production-verification
          path: |
            artifacts/home-connect-hotfix-production.json
            artifacts/home-connect-hotfix-production.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce live hotfix result
        shell: bash
        run: test "${{ steps.verify.outputs.status }}" = "0"
