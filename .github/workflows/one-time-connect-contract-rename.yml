name: One-time Hermes Connect contract rename

on:
  push:
    branches: [cleanup/connect-canonical-consolidation]
    paths:
      - .github/workflows/one-time-connect-contract-rename.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/connect-canonical-consolidation
      - name: Update package scripts to canonical contract name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('package.json')
          text = path.read_text()
          old_call = 'node scripts/hermes-connect-web-product-v1.test.mjs'
          new_call = 'node scripts/hermes-connect-workspace-contract.test.mjs'
          old_key = '"test:hermes-connect-web-product-v1"'
          new_key = '"test:hermes-connect-workspace-contract"'
          if old_call not in text or old_key not in text:
              raise SystemExit('expected versioned package contract references not found')
          text = text.replace(old_call, new_call)
          text = text.replace(old_key, new_key)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit package rename and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Hermes Release Bot"
          git config user.email "officeus@hermeslogisticsus.com"
          git rm .github/workflows/one-time-connect-contract-rename.yml
          git add package.json
          git commit -m "test(connect): retire versioned workspace contract name"
          git push origin HEAD:cleanup/connect-canonical-consolidation
