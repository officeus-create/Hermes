name: HAE Runtime Evidence Acceptance Contract

on:
  pull_request:
    paths:
      - "scripts/hae-runtime-evidence-check.mjs"
      - "scripts/hae-runtime-evidence-check.test.mjs"
      - "docs/HAE_RUNTIME_EVIDENCE_ACCEPTANCE.md"
      - ".github/workflows/hae-runtime-evidence-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HAE runtime evidence acceptance contract
        run: node scripts/hae-runtime-evidence-check.test.mjs
