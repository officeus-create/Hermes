name: Hermes OpenClaw read-only HAE contract
on:
  pull_request:
    paths:
      - "scripts/hermes-hae-public-capabilities*"
      - "docs/HERMES_OPENCLAW_AUXILIARY_READONLY.md"
      - ".github/workflows/hermes-openclaw-readonly.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/hermes-hae-public-capabilities.test.mjs
