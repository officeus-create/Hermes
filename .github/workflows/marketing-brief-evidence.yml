name: Marketing Brief evidence

on:
  pull_request:
    paths:
      - "tests/marketing-brief-evidence.spec.ts"
      - ".github/workflows/marketing-brief-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture desktop and mobile evidence
        run: npx playwright test tests/marketing-brief-evidence.spec.ts

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: marketing-brief-evidence
          path: docs/screenshots/intake02-marketing-*.png
          if-no-files-found: error
