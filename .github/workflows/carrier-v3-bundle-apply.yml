name: Apply carrier signing funnel v3 bundle

on:
  push:
    branches:
      - revenue/carrier-signing-funnel-v3
    paths:
      - ".github/workflows/carrier-v3-bundle-apply.yml"
      - "docs/.carrier-v3-chunk-*"

permissions:
  contents: write

jobs:
  apply-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Decode, verify, and apply reviewed carrier v3 bundle
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          chunks=(docs/.carrier-v3-chunk-*)
          if [ "${#chunks[@]}" -eq 0 ]; then
            echo "No carrier v3 chunks remain; nothing to apply."
            exit 0
          fi
          if [ "${#chunks[@]}" -ne 11 ]; then
            echo "Expected 11 carrier v3 chunks, found ${#chunks[@]}."
            exit 1
          fi

          mkdir -p /tmp/carrier-v3
          cat "${chunks[@]}" | tr -d '\n' | base64 --decode > /tmp/carrier-v3-bundle.tgz
          echo "a1ecad77398f60852ee0455b5451b041fc1a029e953285d6d885c54ac5c73e7a  /tmp/carrier-v3-bundle.tgz" | sha256sum --check --strict
          tar -xzf /tmp/carrier-v3-bundle.tgz -C /tmp/carrier-v3

          install -m 0644 /tmp/carrier-v3/carrier-index.astro src/pages/carrier/index.astro
          install -m 0644 /tmp/carrier-v3/carrier-offer.astro src/pages/logistics/carrier-offer/index.astro
          install -m 0644 /tmp/carrier-v3/carrier-onboarding.astro src/pages/logistics/carrier-onboarding/index.astro
          install -m 0644 /tmp/carrier-v3/carrier-agreement.astro src/pages/logistics/carrier-agreement/index.astro
          install -m 0644 /tmp/carrier-v3/CarrierContractJourney.astro src/components/CarrierContractJourney.astro
          install -m 0644 /tmp/carrier-v3/carrier-contract.ts functions/api/carrier-contract.ts
          install -m 0644 /tmp/carrier-v3/carrier-contract-engine.spec.ts tests/carrier-contract-engine.spec.ts
          install -m 0644 /tmp/carrier-v3/carrier-contract-engine.test.mjs scripts/carrier-contract-engine.test.mjs
          install -m 0644 /tmp/carrier-v3/carrier-contract-journey.test.mjs scripts/carrier-contract-journey.test.mjs
          install -m 0644 /tmp/carrier-v3/carrier-agreement-readiness.test.mjs scripts/carrier-agreement-readiness.test.mjs
          install -m 0644 /tmp/carrier-v3/CARRIER_SALES_HANDOFF_PLAYBOOK.md docs/CARRIER_SALES_HANDOFF_PLAYBOOK.md
          install -m 0644 /tmp/carrier-v3/CARRIER_CONTRACT_ENGINE_ACTIVATION.md docs/CARRIER_CONTRACT_ENGINE_ACTIVATION.md
          install -m 0644 /tmp/carrier-v3/CARRIER_AGREEMENT_EXECUTION_READINESS.md docs/CARRIER_AGREEMENT_EXECUTION_READINESS.md
          install -m 0644 /tmp/carrier-v3/Hermes_Carrier_Administrative_and_Dispatch_Support_Agreement_v3_ATTORNEY_REVIEW.html public/contracts/Hermes_Carrier_Administrative_and_Dispatch_Support_Agreement_v3_ATTORNEY_REVIEW.html
          install -m 0644 /tmp/carrier-v3/Hermes_Carrier_Administrative_and_Dispatch_Support_Agreement_v3_ATTORNEY_REVIEW_compact.pdf public/contracts/Hermes_Carrier_Administrative_and_Dispatch_Support_Agreement_v3_ATTORNEY_REVIEW.pdf

          echo "9d26436b95b63610179f3af9ac4cddf5df59a1610e402bad2162ef394951d5cb  public/contracts/Hermes_Carrier_Administrative_and_Dispatch_Support_Agreement_v3_ATTORNEY_REVIEW.pdf" | sha256sum --check --strict

          rm -f docs/.carrier-v3-chunk-*
          rm -f docs/.carrier-v3-tree-probe docs/.carrier-v3-tree-probe-2 docs/.carrier-v3-tree-probe-3
          rm -f .github/workflows/carrier-v3-bundle-apply.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Carrier signing funnel v3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
