name: Activate Kittle's Garage First-5 workspace

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: kittles-first5-activation
  cancel-in-progress: false

jobs:
  activate:
    if: >-
      github.event.issue.number == 510 &&
      (github.event.comment.body == '/activate-kittles-first5' ||
       github.event.comment.body == '/provision-kittles-trial' ||
       github.event.comment.body == '/recover-kittles-provision') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_URL: https://hermeslogisticsus.com
      OIDC_AUDIENCE: hermes-connect-first5-activation

    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/oidc-response.json"
          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" \
            -o "${response_file}"
          token="$(jq -r '.value // empty' "${response_file}")"
          if [ -z "${token}" ]; then
            echo "GitHub OIDC token request failed."
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Activate exact production Repair Shop through bounded internal API
        id: activation
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          TMP="${RUNNER_TEMP}/kittles-first5"
          RESULT="${TMP}/result.md"
          mkdir -p "${TMP}"
          chmod 700 "${TMP}"

          fail() {
            local class="$1"
            local message="$2"
            echo "classification=${class}" >> "${GITHUB_OUTPUT}"
            cat > "${RESULT}" <<EOF
          ## Kittle's Garage activation — STOPPED SAFELY

          - Classification: \`${class}\`
          - ${message}
          - No new login identity was invented.
          - No duplicate Repair Shop row was created.
          - No unrelated production customer/shop data was changed.
          EOF
            exit 1
          }

          if [ "${COMMAND}" = "/recover-kittles-provision" ]; then
            RECOVERY_HTTP="$(curl -sS --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 30 \
              -o "${TMP}/recovery.json" -w '%{http_code}' \
              -X POST "${BASE_URL}/api/internal/repair-shop-first5-recovery" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary '{"operation":"recover_kittles_garage_trial_provisioning_2026_09_24"}' || printf 000)"

            if [ "${RECOVERY_HTTP}" = 401 ] || [ "${RECOVERY_HTTP}" = 403 ]; then
              fail "operator_not_authorized" "Workflow-bound short-lived OIDC identity was rejected by the bounded recovery endpoint."
            fi
            if [ "${RECOVERY_HTTP}" != 200 ] || [ "$(jq -r '.success // false' "${TMP}/recovery.json" 2>/dev/null)" != true ]; then
              RECOVERY_ERROR="$(jq -r '.error // "provisioning_recovery_failed"' "${TMP}/recovery.json" 2>/dev/null || printf provisioning_recovery_failed)"
              case "${RECOVERY_ERROR}" in
                database_not_configured|operator_not_authorized|invalid_json|unsupported_operation|production_shop_not_found|production_shop_ambiguous|owner_role_mismatch|synthetic_registration_rejected|production_identity_incomplete|provisioning_lock_owner_mismatch|provisioning_receipt_state_invalid|provisioning_receipt_timestamp_invalid|provisioning_lock_active|provisioning_recovery_conflict|provisioning_recovery_readback_failed) ;;
                *) RECOVERY_ERROR="provisioning_recovery_failed" ;;
              esac
              fail "${RECOVERY_ERROR}" "Bounded stale-receipt recovery returned HTTP ${RECOVERY_HTTP}."
            fi
            COMMAND="/provision-kittles-trial"
          fi

          MODE="activate"
          API_PATH="/api/internal/repair-shop-first5-activation"
          PAYLOAD='{"operation":"activate_kittles_garage_2026_09_23"}'
          if [ "${COMMAND}" = "/provision-kittles-trial" ]; then
            MODE="provision"
            API_PATH="/api/internal/repair-shop-first5-provision"
            PAYLOAD='{"operation":"provision_kittles_garage_trial_2026_09_23"}'
          fi

          ACTIVATE_HTTP="$(curl -sS --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 30 \
            -o "${TMP}/activation.json" -w '%{http_code}' \
            -X POST "${BASE_URL}${API_PATH}" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "${PAYLOAD}" || printf 000)"

          if [ "${ACTIVATE_HTTP}" = 401 ] || [ "${ACTIVATE_HTTP}" = 403 ]; then
            fail "operator_not_authorized" "Workflow-bound short-lived OIDC identity was rejected by production."
          fi

          if [ "${ACTIVATE_HTTP}" != 200 ] || [ "$(jq -r '.success // false' "${TMP}/activation.json" 2>/dev/null)" != true ]; then
            ERROR_CODE="$(jq -r '.error // "activation_api_failed"' "${TMP}/activation.json" 2>/dev/null || printf activation_api_failed)"
            case "${ERROR_CODE}" in
              database_not_configured|operator_not_authorized|invalid_json|unsupported_operation|production_shop_not_found|production_shop_ambiguous|owner_role_mismatch|synthetic_registration_rejected|production_identity_incomplete|profile_update_conflict|activation_readback_mismatch|provisioning_incomplete_manual_review|provisioning_lock_conflict|workspace_seed_failed|owner_password_state_incomplete|credential_update_conflict|credential_delivery_failed_password_restored|credential_provision_failed) ;;
              *) ERROR_CODE="activation_api_failed" ;;
            esac
            fail "${ERROR_CODE}" "Bounded production activation API returned HTTP ${ACTIVATE_HTTP}."
          fi

          PROFILE_PATH="$(jq -r '.public_profile_path // empty' "${TMP}/activation.json")"
          ACCESS_STATE="$(jq -r '.access_state // empty' "${TMP}/activation.json")"
          PLAN_ID="$(jq -r '.plan_id // empty' "${TMP}/activation.json")"

          [[ "${PROFILE_PATH}" =~ ^/businesses/connect/repair-shop/[a-z0-9-]+/$ ]] \
            || fail "public_profile_path_invalid" "Production operator succeeded but returned an invalid public profile path."
          if [ "${MODE}" = "activate" ]; then
            case "${ACCESS_STATE}" in
              trialing|founding|active|comped) ;;
              *) fail "access_state_unexpected" "Production activation succeeded but dashboard access state is not usable." ;;
            esac
            [ "${PLAN_ID}" = "repair_shop_founding" ] \
              || fail "plan_readback_mismatch" "Production activation succeeded but plan readback does not match the Repair Shop setup contract."
          fi

          PROFILE_HTTP="$(curl -sS --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -o "${TMP}/profile.html" -w '%{http_code}' "${BASE_URL}${PROFILE_PATH}?verify=$(date +%s)")"
          [ "${PROFILE_HTTP}" = 200 ] \
            && grep -Fq "Kittle" "${TMP}/profile.html" \
            && grep -Fq "Hermes Catalog" "${TMP}/profile.html" \
            || fail "public_catalog_readback_failed" "Production D1 activation succeeded, but the public Hermes Catalog profile did not read back correctly."

          SITEMAP_HTTP="$(curl -sS --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -o "${TMP}/sitemap.xml" -w '%{http_code}' "${BASE_URL}/sitemap-connect-catalog.xml?verify=$(date +%s)")"
          [ "${SITEMAP_HTTP}" = 200 ] && grep -Fq "${PROFILE_PATH}" "${TMP}/sitemap.xml" \
            || fail "catalog_sitemap_readback_failed" "Public profile is live, but the dynamic Hermes Connect Catalog sitemap did not include it."

          echo "classification=pass" >> "${GITHUB_OUTPUT}"
          if [ "${MODE}" = "provision" ]; then
            SERVICES_TOTAL="$(jq -r '.services_total // 0' "${TMP}/activation.json")"
            SERVICES_CREATED="$(jq -r '.services_created // 0' "${TMP}/activation.json")"
            AVAILABILITY_SEEDED="$(jq -r '.availability_seeded // false' "${TMP}/activation.json")"
            CAPABILITIES_SEEDED="$(jq -r '.capabilities_seeded // false' "${TMP}/activation.json")"
            CREDENTIAL_DELIVERY="$(jq -r '.credential_delivery // empty' "${TMP}/activation.json")"
            [ "${CREDENTIAL_DELIVERY}" = "internal_admin_mailbox" ] || [ "${CREDENTIAL_DELIVERY}" = "previously_delivered" ] \
              || fail "credential_delivery_unverified" "Workspace provisioning completed without a verified private credential handoff."
            cat > "${RESULT}" <<EOF
          ## Kittle's Garage First-5 trial provisioning — PASS

          - ✅ Existing real Shop Owner identity preserved; no duplicate login or Repair Shop row created.
          - ✅ Verified public business hours were seeded only when the shop had no existing schedule.
          - ✅ Passenger/light-vehicle capability was seeded only when capabilities were empty.
          - ✅ Official Kittle's repair services are present in the canonical Hermes Connect service context.
          - ✅ Services created this run: ${SERVICES_CREATED}; total visible services: ${SERVICES_TOTAL}.
          - ✅ Availability seeded: ${AVAILABILITY_SEEDED}; capabilities seeded: ${CAPABILITIES_SEEDED}.
          - ✅ Temporary credentials were delivered only through the private internal-admin channel; they are not present in GitHub/API output.
          - ✅ Catalog profile and dynamic sitemap read back from production.
          - Public profile: ${BASE_URL}${PROFILE_PATH}

          No password, owner email, account ID, shop ID, D1 ID, token, session, customer data, or private CRM record is published here.
          EOF
          else
            cat > "${RESULT}" <<EOF
          ## Kittle's Garage First-5 activation — PASS

          - ✅ Existing real Hermes Connect Shop Owner identity was preserved; no duplicate login or Repair Shop row was created.
          - ✅ Repair Shop CRM owner workspace is active under the current free-during-setup policy.
          - ✅ Canonical business facts were updated: Kittle's Garage · North Little Rock, Arkansas · public website linked.
          - ✅ Hermes Catalog publication is enabled and the public profile read back from production.
          - ✅ Dynamic Hermes Connect Catalog sitemap contains the public profile.
          - ✅ Access state is usable: \`${ACCESS_STATE}\` on plan \`${PLAN_ID}\`.
          - Public profile: ${BASE_URL}${PROFILE_PATH}

          No password, owner email, account ID, shop ID, D1 ID, token, session, customer data, or private CRM record is published here.
          EOF
          fi

      - name: Publish sanitized activation result
        if: always()
        shell: bash
        run: |
          RESULT="${RUNNER_TEMP}/kittles-first5/result.md"
          if [ -f "${RESULT}" ]; then
            gh issue comment 510 --repo "${GITHUB_REPOSITORY}" --body-file "${RESULT}"
          else
            gh issue comment 510 --repo "${GITHUB_REPOSITORY}" --body $'## Kittle\x27s Garage activation — FAILED\n\nThe bounded operator stopped before it could produce a verified sanitized receipt. No completion claim is made.'
          fi

      - name: Enforce verified completion
        if: always()
        shell: bash
        env:
          CLASSIFICATION: ${{ steps.activation.outputs.classification }}
        run: |
          [ "${CLASSIFICATION:-}" = pass ]
