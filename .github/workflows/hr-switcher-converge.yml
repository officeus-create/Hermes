name: HR Switcher Convergence

on: [push]

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Apply and validate bounded HR convergence
        run: |
          python scripts/hr-switcher-converge-v2.py
          node scripts/hermes-connect-hr-design4-replay.test.mjs
          git diff --check

      - name: Commit validated convergence
        run: |
          rm .github/workflows/hr-switcher-converge.yml scripts/hr-switcher-converge.py scripts/hr-switcher-converge-v2.py
          git add -A
          git diff --cached --check
          git config user.name "Hermes Design Bot"
          git config user.email "officeus@hermeslogisticsus.com"
          git commit -m "fix(hr): expose reviewer workspace only from authorized account portfolio"
          git push origin HEAD:${GITHUB_REF_NAME}
