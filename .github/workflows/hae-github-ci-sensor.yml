name: HAE GitHub CI Sensor

# GitHub Actions is a source of events, never the HAE control plane.
# Active only for failed/timed-out trusted workflows; producer fail-closes until deployed HAE Worker settings match exact checked-out main SHA, dry_run and publication disabled.
on:
  workflow_run:
    workflows:
      - Website checks
      - Hermes Automation Engine Contract
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: hae-ci-event-sensor-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.run_attempt == 1 &&
      github.event.workflow_run.repository.full_name == 'officeus-create/Hermes' &&
      github.event.workflow_run.head_repository.full_name == 'officeus-create/Hermes' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout trusted current main only
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Capture exact trusted main SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "HAE_CI_EXPECTED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate CI sensor contracts
        run: |
          set -euo pipefail
          node scripts/hae-github-ci-event-sensor.test.mjs
          node scripts/hae-github-ci-runtime-intake.test.mjs
          node scripts/hae-github-ci-source.test.mjs
          node scripts/hae-github-ci-integration-sqlite.test.mjs

      - name: Enqueue one verified minimized CI run in existing HAE Queue
        env:
          GH_TOKEN: ${{ github.token }}
          # Existing production HAE release credential is reused only in this trusted-main
          # source job. Read-only exact-SHA deployed Worker settings and canonical D1 checks happen before the only Queue POST.
          # A dedicated queue-only token remains P1 hardening, not an activation blocker.
          CLOUDFLARE_HAE_RELEASE_TOKEN: ${{ secrets.CLOUDFLARE_HAE_RELEASE_TOKEN }}
          HAE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          HAE_CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/hae-github-ci-source.mjs

      - name: Retain sanitized autonomous self-work receipt
        uses: actions/upload-artifact@v4
        with:
          name: hae-ci-self-work-receipt
          path: ${{ runner.temp }}/hae-ci-self-work-receipt.json
          if-no-files-found: error
          retention-days: 90
