name: Repair package lock

on:
  push:
    branches:
      - seo/web-audit-trust-guard

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: seo/web-audit-trust-guard
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm audit --audit-level=moderate
      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Security: refresh vulnerable transitive dependency"
          git push origin HEAD:seo/web-audit-trust-guard
