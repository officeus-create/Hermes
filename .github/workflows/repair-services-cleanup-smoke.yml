name: One-time Repair Shop services smoke cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-services-cleanup-smoke.yml

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove production Repair Shop services smoke account
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call exact-target cleanup endpoint and verify idempotency
        shell: bash
        run: |
          set -euo pipefail
          CODE="000"
          for attempt in $(seq 1 30); do
            CODE="$(curl -sS -o "${RUNNER_TEMP}/cleanup.body" -w '%{http_code}' -X POST https://hermeslogisticsus.com/api/auth/cleanup-services-test || true)"
            echo "CLEANUP_ATTEMPT_${attempt}_HTTP=$CODE"
            if [ "$CODE" = "200" ]; then break; fi
            if [ "$CODE" = "409" ]; then cat "${RUNNER_TEMP}/cleanup.body"; exit 1; fi
            sleep 10
          done
          cat "${RUNNER_TEMP}/cleanup.body"; echo
          test "$CODE" = "200"
          test "$(jq -r '.success // false' "${RUNNER_TEMP}/cleanup.body")" = "true"

          VERIFY_CODE="$(curl -sS -o "${RUNNER_TEMP}/verify.body" -w '%{http_code}' -X POST https://hermeslogisticsus.com/api/auth/cleanup-services-test || true)"
          echo "VERIFY_CLEANUP_HTTP=$VERIFY_CODE"
          cat "${RUNNER_TEMP}/verify.body"; echo
          test "$VERIFY_CODE" = "200"
          test "$(jq -r '.success // false' "${RUNNER_TEMP}/verify.body")" = "true"
          test "$(jq -r '.already_absent // false' "${RUNNER_TEMP}/verify.body")" = "true"
          echo "SERVICES_SMOKE_ACCOUNT_REMOVED=YES"
