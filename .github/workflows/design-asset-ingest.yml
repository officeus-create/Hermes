name: Design asset ingest
on:
  push:
    branches:
      - design/logistics-living-weather-equipment-replay-20261003
    paths:
      - .github/workflows/design-asset-ingest.yml
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/logistics-living-weather-equipment-replay-20261003
      - name: Download temporary Runway references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/622fa700-23cb-4537-96b2-d51838685e59/2fc20c8c-dd73-4ebf-bbd1-0aafbcae2dfb/Single_photorealistic_vertical_aerial_drone_scene_for_a_prem.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzNmNDk1MDY0ZmIwODk1OSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTEzODA1NH0.up08P3NcZsL1-yMJ9Vgx1FRveIR9aJMzkmNb2ZYBYcM' -o assets/car-hauler.png
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/f55afd9c-4981-42ec-baea-c15b4299dadb/73f16cf7-e8ca-48e5-b317-e3de7a668e8a/Photorealistic_vertical_aerial_drone_scene_for_a_premium_U_S.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWU1ZDZjYWRmMWI0ODMwZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE4NTQ1M30.oFrEOWdih5Hpp4QfOICHGZCy0OpNSoDp9koFq0SfEII' -o assets/dry-van.png
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/8534a541-f6d2-4832-898c-1c506eedeebf/aeb2bb2d-390c-42ae-bec0-2c21627230fd/Photorealistic_vertical_aerial_drone_scene_for_a_premium_U_S.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2QyNzlmOGNhNmY1MDRjOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTEyNzk0OH0.IARfZlc0rPiNIB5mNZO5_DOeFyW0U6hy27VUBDsQj4A' -o assets/reefer.png
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/f1e090bc-6d04-42c7-8c41-118b751b592c/d2982f56-cf01-452f-a94f-69565f0a21b9/Photorealistic_vertical_aerial_drone_scene_for_a_premium_U_S.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWFhOTM0OGM5ZjQyYzE0ZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTEyNzE4MH0.5YDmrHWJaSbQJWFhGK_Pd-gcn0Y2zZ95W3SQXqc9Suc' -o assets/flatbed.png
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/a2cf96f9-8ab3-4f3b-a6f0-34451b4e5e6c/3b8de589-7943-4652-9541-6dacb0337eec/Photorealistic_vertical_aerial_drone_scene_for_a_premium_U_S.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGEzNDMzOWNkODBiNjM5OCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE5MzI0NH0.BeccZ76lW25aa1Ol_5VBCjBUksPvzNeY1c_NQL6DPng' -o assets/step-deck.png
          curl -L --fail --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/45cb1802-bedf-4576-b359-a7fb114a0551/53ee6c85-5cfd-4195-932e-1090108e832f/Photorealistic_vertical_aerial_drone_scene_for_a_premium_U_S.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYjNiMjg0NTE1N2RkYTIyMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTEzNzc0NX0.DQYrWUiFvK-bi8HLUPm2OfdIKcRBC_MAA3hvscKUqBQ' -o assets/hotshot.png
          file assets/*
      - name: Convert, own and commit Hermes assets
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          mkdir -p public/images/logistics-living
          for source in assets/*.png; do
            key="$(basename "$source" .png)"
            cwebp -quiet -q 76 -resize 512 0 "$source" -o "public/images/logistics-living/$key-512.webp"
            cwebp -quiet -q 78 -resize 887 0 "$source" -o "public/images/logistics-living/$key-887.webp"
          done
          rm -f .github/workflows/design-asset-ingest.yml
          git config user.name "Hermes Design Automation"
          git config user.email "officeus@hermeslogisticsus.com"
          git add public/images/logistics-living .github/workflows/design-asset-ingest.yml
          git commit -m "design(v4): own living Logistics scene assets"
          git push origin HEAD:design/logistics-living-weather-equipment-replay-20261003
      - uses: actions/upload-artifact@v4
        with:
          name: runway-logistics-scenes
          path: assets
          retention-days: 1
