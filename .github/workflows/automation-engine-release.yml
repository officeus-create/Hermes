name: Hermes Automation Engine Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Safe HAE operation
        required: true
        default: verify
        type: choice
        options:
          - verify
          - provision_dry_run
          - runtime_readonly_proof
          - schema_snapshot
      target_sha:
        description: Exact current main SHA
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: hermes-automation-engine-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.actor == 'officeus-create' &&
        (
          (
            github.event.issue.number == 1018 &&
            (
              startsWith(github.event.comment.body, 'HAE_VERIFY ') ||
              startsWith(github.event.comment.body, 'HAE_PROVISION_DRY_RUN ') ||
              startsWith(github.event.comment.body, 'HAE_RUNTIME_READONLY_PROOF ')
            )
          ) ||
          (
            github.event.issue.number == 2033 &&
            startsWith(github.event.comment.body, 'HAE_SCHEMA_SNAPSHOT ')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      operation: ${{ steps.request.outputs.operation }}
      target_sha: ${{ steps.request.outputs.target_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_HAE_RELEASE_TOKEN: ${{ secrets.CLOUDFLARE_HAE_RELEASE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_HAE_RELEASE_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
    steps:
      - name: Resolve explicit owner request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_SHA: ${{ inputs.target_sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$DISPATCH_OPERATION" in
              verify) OPERATION="verify" ;;
              provision_dry_run) OPERATION="provision_dry_run" ;;
              runtime_readonly_proof) OPERATION="runtime_readonly_proof" ;;
              schema_snapshot) OPERATION="schema_snapshot" ;;
              *) echo "unsupported_operation"; exit 1 ;;
            esac
            TARGET_SHA="$DISPATCH_SHA"
          else
            COMMAND="$(awk '{print $1}' <<<"$COMMENT_BODY")"
            TARGET_SHA="$(awk '{print $2}' <<<"$COMMENT_BODY")"
            case "$COMMAND" in
              HAE_VERIFY) OPERATION="verify" ;;
              HAE_PROVISION_DRY_RUN) OPERATION="provision_dry_run" ;;
              HAE_RUNTIME_READONLY_PROOF) OPERATION="runtime_readonly_proof" ;;
              HAE_SCHEMA_SNAPSHOT) OPERATION="schema_snapshot" ;;
              *) echo "unsupported_comment_command"; exit 1 ;;
            esac
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid_target_sha"
            exit 1
          fi
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact current main
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi

      - name: Check out exact main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.request.outputs.target_sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate HAE source contract
        run: |
          node scripts/automation-engine-contract.test.mjs
          node scripts/hae-d1-schema-snapshot.test.mjs

      - name: Resolve canonical Cloudflare account context
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("workers/lead-email/wrangler.production.jsonc", "utf8"));
          const accountId = String(config.account_id || "").trim();
          if (!/^[0-9a-f]{32}$/.test(accountId)) {
            console.error("canonical_cloudflare_account_id_missing");
            process.exit(1);
          }
          process.stdout.write(accountId);
          NODE
          )"
          echo "::add-mask::$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Validate Cloudflare release credentials
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail
          ACTIVE_TOKEN="${CLOUDFLARE_API_TOKEN:-}"
          if [[ "$OPERATION" == "schema_snapshot" ]]; then
            ACTIVE_TOKEN="${CLOUDFLARE_HAE_RELEASE_TOKEN:-}"
            if [[ -z "$ACTIVE_TOKEN" ]]; then
              echo "missing_CLOUDFLARE_HAE_RELEASE_TOKEN_for_schema_snapshot"
              exit 1
            fi
          elif [[ -z "$ACTIVE_TOKEN" ]]; then
            echo "missing_CLOUDFLARE_HAE_RELEASE_TOKEN_OR_SUPPORTED_ALIAS"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "canonical_cloudflare_account_id_missing"
            exit 1
          fi
          echo "::add-mask::$ACTIVE_TOKEN"
          echo "HAE_CLOUDFLARE_ACTIVE_TOKEN=$ACTIVE_TOKEN" >> "$GITHUB_ENV"

      - name: Discover canonical Hermes Connect production D1
        id: d1
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/hermes-pages.json"
          http="$(curl -sS -o "$tmp" -w '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/hermes"             -H "Authorization: Bearer ${HAE_CLOUDFLARE_ACTIVE_TOKEN}"             -H 'Content-Type: application/json')"
          if [[ "$http" != "200" ]]; then
            echo "blocked_cloudflare_pages_read http=$http"
            exit 1
          fi
          DB_ID="$(jq -r '.result.deployment_configs.production.d1_databases.DB.id // empty' "$tmp")"
          DB_NAME="$(jq -r '.result.deployment_configs.production.d1_databases.DB.database_name // .result.deployment_configs.production.d1_databases.DB.name // empty' "$tmp")"
          rm -f "$tmp"
          if [[ -z "$DB_ID" || "$DB_ID" == "null" ]]; then
            echo "production_db_binding_missing"
            exit 1
          fi
          echo "::add-mask::$DB_ID"
          DB_BINDING_FINGERPRINT="$(printf '%s' "$DB_ID" | sha256sum | awk '{print "sha256:"$1}')"
          echo "database_binding_fingerprint=$DB_BINDING_FINGERPRINT" >> "$GITHUB_OUTPUT"
          if [[ "$OPERATION" == "schema_snapshot" && -z "$DB_NAME" ]]; then
            detail="${RUNNER_TEMP}/hermes-d1-database.json"
            detail_http="$(curl -sS -o "$detail" -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}" \
              -H "Authorization: Bearer ${HAE_CLOUDFLARE_ACTIVE_TOKEN}" \
              -H 'Content-Type: application/json')"
            if [[ "$detail_http" != "200" ]] || [[ "$(jq -r '.success // false' "$detail")" != "true" ]]; then
              echo "production_db_metadata_read_failed http=$detail_http"
              rm -f "$detail"
              exit 1
            fi
            DB_NAME="$(jq -r '.result.name // empty' "$detail")"
            rm -f "$detail"
            if [[ -z "$DB_NAME" ]]; then
              echo "production_db_name_missing_after_d1_read"
              exit 1
            fi
          fi
          DB_NAME="${DB_NAME:-hermes-connect-prototype}"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "database_name=$DB_NAME" >> "$GITHUB_OUTPUT"

      - name: Capture authenticated read-only D1 schema snapshot
        if: steps.request.outputs.operation == 'schema_snapshot'
        id: schema_snapshot
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
          DB_NAME: ${{ steps.d1.outputs.database_name }}
          DB_BINDING_FINGERPRINT: ${{ steps.d1.outputs.database_binding_fingerprint }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          SCHEMA_SNAPSHOT_TOKEN: ${{ secrets.CLOUDFLARE_HAE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_before_schema_snapshot target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi
          if [[ -z "${SCHEMA_SNAPSHOT_TOKEN:-}" ]]; then
            echo "missing_CLOUDFLARE_HAE_RELEASE_TOKEN_for_schema_snapshot"
            exit 1
          fi
          raw="${RUNNER_TEMP}/hae-d1-schema-response.json"
          artifact_dir="${RUNNER_TEMP}/hae-d1-schema-snapshot"
          artifact="${artifact_dir}/hae-d1-schema-snapshot.json"
          mkdir -p "$artifact_dir"
          cleanup() {
            rm -f "$raw"
          }
          trap cleanup EXIT

          sql="SELECT type,name,tbl_name,sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' AND name <> '_cf_KV' AND type IN ('table','index','trigger','view') ORDER BY type,name,tbl_name"
          body="$(jq -nc --arg sql "$sql" '{sql:$sql,params:[]}')"
          http="$(curl -sS -o "$raw" -w '%{http_code}' \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            -H "Authorization: Bearer ${SCHEMA_SNAPSHOT_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$body")"

          if [[ "$http" != "200" ]]; then
            echo "hae_d1_schema_snapshot_query_failed http=$http"
            exit 1
          fi
          if [[ "$(jq -r '.success // false' "$raw")" != "true" ]]; then
            echo "hae_d1_schema_snapshot_cloudflare_unsuccessful"
            exit 1
          fi
          if [[ "$(jq -r '.result[0].success // false' "$raw")" != "true" ]]; then
            echo "hae_d1_schema_snapshot_statement_unsuccessful"
            exit 1
          fi

          node scripts/hae-d1-schema-snapshot.mjs build \
            --response "$raw" \
            --target-sha "$TARGET_SHA" \
            --database-name "$DB_NAME" \
            --database-binding-fingerprint "$DB_BINDING_FINGERPRINT" \
            --output "$artifact"

          node scripts/hae-d1-schema-snapshot.mjs verify \
            --artifact "$artifact" \
            --target-sha "$TARGET_SHA" \
            --migration-manifest workers/automation-engine/migrations/manifest.json

          object_count="$(jq -r '.object_count' "$artifact")"
          fingerprint="$(jq -r '.fingerprint' "$artifact")"
          echo "object_count=$object_count" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "HAE D1 schema snapshot PASS objects=$object_count fingerprint=$fingerprint"

      - name: Upload sanitized D1 schema snapshot evidence
        if: steps.request.outputs.operation == 'schema_snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: hae-d1-schema-snapshot
          path: ${{ runner.temp }}/hae-d1-schema-snapshot/hae-d1-schema-snapshot.json
          if-no-files-found: error
          retention-days: 14

      - name: Inspect or provision canonical HAE queues
        if: steps.request.outputs.operation != 'schema_snapshot'
        id: queues
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
        run: |
          set -euo pipefail
          has_queue() {
            local name="$1"
            npx --yes wrangler@4 queues info "$name" >/dev/null 2>&1
          }
          ensure_queue() {
            local name="$1"
            if has_queue "$name"; then
              echo "reuse_queue=$name"
              return
            fi
            if [[ "$OPERATION" != "provision_dry_run" ]]; then
              echo "missing_queue=$name"
              exit 1
            fi
            npx --yes wrangler@4 queues create "$name"
            has_queue "$name"
          }
          ensure_queue "hermes-automation"
          ensure_queue "hermes-automation-dlq"

      - name: Render non-versioned production config
        if: steps.request.outputs.operation != 'schema_snapshot'
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
          DB_NAME: ${{ steps.d1.outputs.database_name }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const path = "workers/automation-engine/wrangler.production.generated.jsonc";
          let config = fs.readFileSync("workers/automation-engine/wrangler.jsonc.example", "utf8");
          const targetSha = String(process.env.TARGET_SHA || "").trim();
          if (!/^[0-9a-f]{40}$/.test(targetSha)) {
            throw new Error("invalid_HAE_release_target_sha");
          }
          config = config
            .replace("DISCOVER_FROM_HERMES_PAGES_PRODUCTION_DB_BINDING", process.env.DB_ID)
            .replace('"database_name": "hermes-connect-prototype"', `"database_name": "${process.env.DB_NAME || "hermes-connect-prototype"}"`)
            .replace("INJECT_EXACT_MAIN_SHA_AT_RELEASE", targetSha);
          if (config.includes("INJECT_EXACT_MAIN_SHA_AT_RELEASE")) {
            throw new Error("HAE_release_source_sha_placeholder_not_replaced");
          }
          fs.writeFileSync(path, config);
          NODE

      - name: Validate composed Worker package
        if: steps.request.outputs.operation != 'schema_snapshot'
        run: npx --yes wrangler@4 deploy --dry-run --config workers/automation-engine/wrangler.production.generated.jsonc --outdir "${RUNNER_TEMP}/hae-dry-run"

      - name: Re-verify exact current main before dry-run deploy
        if: steps.request.outputs.operation == 'provision_dry_run'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_before_dry_run_deploy target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi

      - name: Deploy HAE in fail-closed dry-run mode
        if: steps.request.outputs.operation == 'provision_dry_run'
        run: npx --yes wrangler@4 deploy --config workers/automation-engine/wrangler.production.generated.jsonc


      - name: Re-verify exact current main after dry-run deploy
        if: steps.request.outputs.operation == 'provision_dry_run'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_after_dry_run_deploy target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi

      - name: Verify deployed Worker inventory
        if: steps.request.outputs.operation == 'provision_dry_run'
        run: npx --yes wrangler@4 deployments list --config workers/automation-engine/wrangler.production.generated.jsonc


      - name: Run private Queue → Worker → D1 dry-run canary
        if: steps.request.outputs.operation == 'provision_dry_run'
        id: canary
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          CANARY_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CANARY_OFFSET_HOURS="$((10#${GITHUB_RUN_NUMBER} * 10 + 10#${GITHUB_RUN_ATTEMPT}))"
          CANARY_SLOT="$(date -u -d "2030-01-01 UTC + ${CANARY_OFFSET_HOURS} hours" +%Y-%m-%dT%H)"
          echo "synthetic_canary_slot=$CANARY_SLOT run_number=$GITHUB_RUN_NUMBER attempt=$GITHUB_RUN_ATTEMPT"
          QUEUES_JSON="${RUNNER_TEMP}/hae-queues.json"
          curl -fsS             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Content-Type: application/json' > "$QUEUES_JSON"
          QUEUE_ID="$(jq -r '.result[] | select(.queue_name == "hermes-automation") | .queue_id' "$QUEUES_JSON" | head -n1)"
          rm -f "$QUEUES_JSON"
          if [[ -z "$QUEUE_ID" || "$QUEUE_ID" == "null" ]]; then
            echo "hae_queue_id_missing"
            exit 1
          fi
          echo "::add-mask::$QUEUE_ID"

          BODY="$(jq -nc --arg slot "$CANARY_SLOT" '{
            body: {
              type: "content.plan",
              account_key: "hermes_logistics",
              platform: "threads",
              slot_key: $slot,
              trigger_type: "release_dry_run_canary"
            }
          }')"
          HTTP="$(curl -sS -o "${RUNNER_TEMP}/hae-queue-push.json" -w '%{http_code}'             -X POST             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${QUEUE_ID}/messages"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Content-Type: application/json'             --data "$BODY")"
          if [[ "$HTTP" != "200" ]]; then
            echo "hae_queue_push_failed http=$HTTP"
            cat "${RUNNER_TEMP}/hae-queue-push.json"
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/hae-queue-push.json"

          SQL='SELECT r.status AS run_status,r.updated_at,c.state AS content_state,c.template_id,c.variant_key,length(c.body) AS body_chars FROM hermes_automation_runs r LEFT JOIN hermes_automation_content c ON c.account_key=r.account_key AND c.platform=r.platform AND c.slot_key=r.slot_key WHERE r.account_key=? AND r.platform=? AND r.slot_key=? AND r.updated_at>=? LIMIT 1'
          for attempt in $(seq 1 18); do
            QUERY="$(jq -nc               --arg sql "$SQL"               --arg slot "$CANARY_SLOT"               --arg started "$CANARY_STARTED_AT"               '{sql:$sql,params:["hermes_logistics","threads",$slot,$started]}')"
            HTTP="$(curl -sS -o "${RUNNER_TEMP}/hae-d1-readback.json" -w '%{http_code}'               -X POST               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json'               --data "$QUERY")"
            if [[ "$HTTP" != "200" ]]; then
              echo "hae_d1_readback_failed http=$HTTP"
              cat "${RUNNER_TEMP}/hae-d1-readback.json"
              exit 1
            fi
            RUN_STATUS="$(jq -r '.result[0].results[0].run_status // empty' "${RUNNER_TEMP}/hae-d1-readback.json")"
            CONTENT_STATE="$(jq -r '.result[0].results[0].content_state // empty' "${RUNNER_TEMP}/hae-d1-readback.json")"
            if [[ "$RUN_STATUS" == "dry_run_ready" && "$CONTENT_STATE" == "ready" ]]; then
              TEMPLATE_ID="$(jq -r '.result[0].results[0].template_id // empty' "${RUNNER_TEMP}/hae-d1-readback.json")"
              BODY_CHARS="$(jq -r '.result[0].results[0].body_chars // 0' "${RUNNER_TEMP}/hae-d1-readback.json")"
              echo "dry_run_canary=PASS slot=$CANARY_SLOT template=$TEMPLATE_ID chars=$BODY_CHARS"
              echo "slot=$CANARY_SLOT" >> "$GITHUB_OUTPUT"
              echo "status=$RUN_STATUS" >> "$GITHUB_OUTPUT"
              rm -f "${RUNNER_TEMP}/hae-d1-readback.json"
              break
            fi
            if [[ "$attempt" -eq 18 ]]; then
              echo "dry_run_canary_timeout slot=$CANARY_SLOT"
              cat "${RUNNER_TEMP}/hae-d1-readback.json"
              exit 1
            fi
            sleep 5
          done

      - name: Re-verify exact current main after dry-run canary
        if: steps.request.outputs.operation == 'provision_dry_run'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_after_dry_run_canary target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi

      - name: Publish dry-run evidence summary
        if: steps.request.outputs.operation == 'provision_dry_run'
        shell: bash
        env:
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
          CANARY_SLOT: ${{ steps.canary.outputs.slot }}
          CANARY_STATUS: ${{ steps.canary.outputs.status }}
        run: |
          {
            echo "# Hermes Automation Engine dry-run"
            echo
            echo "- Exact main: `$TARGET_SHA`"
            echo "- Provider writes: disabled"
            echo "- Queue canary slot: `$CANARY_SLOT`"
            echo "- D1 readback: `$CANARY_STATUS`"
            echo "- ChatGPT/OpenAI runtime calls: 0 by contract"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Run private read-only runtime proof
        if: steps.request.outputs.operation == 'runtime_readonly_proof'
        id: readonly_proof
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
          DB_BINDING_FINGERPRINT: ${{ steps.d1.outputs.database_binding_fingerprint }}
          TARGET_SHA: ${{ steps.request.outputs.target_sha }}
        run: |
          set -euo pipefail

          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_before_runtime_readonly_proof target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi

          d1_query() {
            local sql="$1"
            local params_json="$2"
            local output="$3"
            local body
            body="$(jq -nc --arg sql "$sql" --argjson params "$params_json" '{sql:$sql,params:$params}')"
            local http
            http="$(curl -sS -o "$output" -w '%{http_code}' \
              -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$body")"
            if [[ "$http" != "200" ]] || [[ "$(jq -r '.success // false' "$output")" != "true" ]]; then
              echo "hae_d1_query_failed http=$http"
              cat "$output"
              exit 1
            fi
            if [[ "$(jq -r '.result[0].success // true' "$output")" != "true" ]]; then
              echo "hae_d1_statement_failed"
              cat "$output"
              exit 1
            fi
          }

          proof_dir="${RUNNER_TEMP}/hae-runtime-proof"
          mkdir -p "$proof_dir"
          idempotency_key="hae:runtime-proof:${TARGET_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"

          queues_json="$proof_dir/queues.json"
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' > "$queues_json"
          queue_id="$(jq -r '.result[] | select(.queue_name == "hermes-automation") | .queue_id' "$queues_json" | head -n1)"
          dlq_id="$(jq -r '.result[] | select(.queue_name == "hermes-automation-dlq") | .queue_id' "$queues_json" | head -n1)"
          if [[ -z "$queue_id" || "$queue_id" == "null" || -z "$dlq_id" || "$dlq_id" == "null" ]]; then
            echo "hae_runtime_proof_queue_ids_missing"
            exit 1
          fi
          echo "::add-mask::$queue_id"
          echo "::add-mask::$dlq_id"

          submit_body="$(jq -nc --arg key "$idempotency_key" '{
            body: {
              type: "job.submit.runtime_proof",
              job_type: "system.health.snapshot",
              idempotency_key: $key
            }
          }')"
          http="$(curl -sS -o "$proof_dir/queue-first.json" -w '%{http_code}' \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${queue_id}/messages" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$submit_body")"
          if [[ "$http" != "200" ]] || [[ "$(jq -r '.success // false' "$proof_dir/queue-first.json")" != "true" ]]; then
            echo "hae_runtime_proof_submit_queue_push_failed http=$http"
            cat "$proof_dir/queue-first.json"
            exit 1
          fi

          lookup_sql="SELECT job_id,job_type,business_lane,state,attempt_count,idempotency_key,result_json,last_error_class,completed_at FROM hermes_automation_jobs WHERE idempotency_key=? LIMIT 1"
          lookup_params="$(jq -nc --arg key "$idempotency_key" '[$key]')"
          job_id=""
          for attempt in $(seq 1 24); do
            d1_query "$lookup_sql" "$lookup_params" "$proof_dir/job.json"
            job_id="$(jq -r '.result[0].results[0].job_id // empty' "$proof_dir/job.json")"
            state="$(jq -r '.result[0].results[0].state // empty' "$proof_dir/job.json")"
            if [[ "$state" == "SUCCEEDED" && -n "$job_id" ]]; then
              break
            fi
            if [[ "$state" == "FAILED" || "$state" == "BLOCKED" ]]; then
              echo "hae_runtime_proof_job_terminal_failure state=$state"
              cat "$proof_dir/job.json"
              exit 1
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "hae_runtime_proof_job_timeout state=$state job=$job_id"
              cat "$proof_dir/job.json"
              exit 1
            fi
            sleep 5
          done
          if [[ -z "$job_id" ]]; then
            echo "hae_runtime_proof_job_id_missing"
            exit 1
          fi

          job_sql="SELECT job_id,job_type,business_lane,state,attempt_count,idempotency_key,result_json,last_error_class,completed_at FROM hermes_automation_jobs WHERE job_id=? LIMIT 1"
          job_params="$(jq -nc --arg job_id "$job_id" '[$job_id]')"
          d1_query "$job_sql" "$job_params" "$proof_dir/job.json"
          queue_body="$(jq -nc --arg job_id "$job_id" '{body:{type:"job.execute",job_id:$job_id}}')"

          result_json="$(jq -r '.result[0].results[0].result_json // empty' "$proof_dir/job.json")"
          if [[ -z "$result_json" ]]; then
            echo "hae_runtime_proof_result_missing"
            exit 1
          fi
          printf '%s' "$result_json" | jq -e '.health.database == "ok"' >/dev/null
          printf '%s' "$result_json" | jq '.' > "$proof_dir/result.json"
          jq '.health' "$proof_dir/result.json" > "$proof_dir/health.json"

          health_sha="$(jq -r '.source_sha // empty' "$proof_dir/health.json")"
          health_mode="$(jq -r '.automation_mode // empty' "$proof_dir/health.json")"
          health_publish="$(jq -r '.publication_enabled' "$proof_dir/health.json")"
          if [[ "$health_sha" != "$TARGET_SHA" || "$health_mode" != "dry_run" || "$health_publish" != "false" ]]; then
            echo "hae_runtime_proof_health_continuity_failed sha=$health_sha mode=$health_mode publication=$health_publish"
            exit 1
          fi

          http="$(curl -sS -o "$proof_dir/queue-replay.json" -w '%{http_code}' \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${queue_id}/messages" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$queue_body")"
          if [[ "$http" != "200" ]] || [[ "$(jq -r '.success // false' "$proof_dir/queue-replay.json")" != "true" ]]; then
            echo "hae_runtime_proof_replay_queue_push_failed http=$http"
            cat "$proof_dir/queue-replay.json"
            exit 1
          fi

          events_sql="SELECT SUM(CASE WHEN event_type='job.started' THEN 1 ELSE 0 END) AS started_count,SUM(CASE WHEN event_type='job.succeeded' THEN 1 ELSE 0 END) AS succeeded_count,SUM(CASE WHEN event_type='job.duplicate_suppressed' THEN 1 ELSE 0 END) AS duplicate_suppressed_count FROM hermes_automation_job_events WHERE job_id=?"
          for attempt in $(seq 1 24); do
            d1_query "$events_sql" "$job_params" "$proof_dir/events.json"
            duplicate_receipts="$(jq -r '.result[0].results[0].duplicate_suppressed_count // 0' "$proof_dir/events.json")"
            if [[ "$duplicate_receipts" -ge 1 ]]; then
              break
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "hae_runtime_proof_replay_receipt_timeout"
              cat "$proof_dir/events.json"
              exit 1
            fi
            sleep 5
          done

          d1_query "$job_sql" "$job_params" "$proof_dir/job-final.json"
          final_state="$(jq -r '.result[0].results[0].state // empty' "$proof_dir/job-final.json")"
          final_attempt_count="$(jq -r '.result[0].results[0].attempt_count // -1' "$proof_dir/job-final.json")"
          started_count="$(jq -r '.result[0].results[0].started_count // 0' "$proof_dir/events.json")"
          succeeded_count="$(jq -r '.result[0].results[0].succeeded_count // 0' "$proof_dir/events.json")"
          duplicate_receipts="$(jq -r '.result[0].results[0].duplicate_suppressed_count // 0' "$proof_dir/events.json")"
          if [[ "$final_state" != "SUCCEEDED" || "$final_attempt_count" -ne 1 || "$started_count" -ne 1 || "$succeeded_count" -ne 1 || "$duplicate_receipts" -lt 1 ]]; then
            echo "hae_runtime_proof_replay_invariant_failed state=$final_state attempts=$final_attempt_count started=$started_count succeeded=$succeeded_count duplicate_receipts=$duplicate_receipts"
            exit 1
          fi

          for pair in "queue:$queue_id" "dlq:$dlq_id"; do
            kind="${pair%%:*}"
            qid="${pair#*:}"
            http="$(curl -sS -o "$proof_dir/${kind}-metrics.json" -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues/${qid}/metrics" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json')"
            if [[ "$http" != "200" ]] || [[ "$(jq -r '.success // false' "$proof_dir/${kind}-metrics.json")" != "true" ]]; then
              echo "hae_runtime_proof_${kind}_metrics_failed http=$http"
              cat "$proof_dir/${kind}-metrics.json"
              exit 1
            fi
            jq -e '.result.backlog_count | numbers' "$proof_dir/${kind}-metrics.json" >/dev/null
          done

          queue_backlog="$(jq -r '.result.backlog_count' "$proof_dir/queue-metrics.json")"
          dlq_backlog="$(jq -r '.result.backlog_count' "$proof_dir/dlq-metrics.json")"
          if [[ "$dlq_backlog" -ne 0 ]]; then
            echo "hae_runtime_proof_dlq_requires_classification backlog=$dlq_backlog"
            exit 1
          fi

          health_evidence="github-actions://${GITHUB_REPOSITORY}/runs/${GITHUB_RUN_ID}/runtime-readonly-proof/health"
          job_evidence="d1://hermes-connect-prototype/hermes_automation_jobs/$job_id"
          replay_evidence="d1://hermes-connect-prototype/hermes_automation_job_events/$job_id"
          queue_evidence="cloudflare://queues/hermes-automation/metrics/run-${GITHUB_RUN_ID}"
          dlq_evidence="cloudflare://queues/hermes-automation-dlq/metrics/run-${GITHUB_RUN_ID}"

          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_during_runtime_readonly_proof target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi

          jq -n \
            --arg target_sha "$TARGET_SHA" \
            --arg database_binding_fingerprint "$DB_BINDING_FINGERPRINT" \
            --arg deployment_ref "github-actions://${GITHUB_REPOSITORY}/runs/${GITHUB_RUN_ID}/deployed-worker" \
            --arg health_ref "$health_evidence" \
            --slurpfile health "$proof_dir/health.json" \
            --arg queue_ref "$queue_evidence" \
            --argjson queue_backlog "$queue_backlog" \
            --arg dlq_ref "$dlq_evidence" \
            --argjson dlq_backlog "$dlq_backlog" \
            --arg job_ref "$job_evidence" \
            --arg job_id "$job_id" \
            --arg key "$idempotency_key" \
            --argjson attempt_count "$final_attempt_count" \
            --arg replay_ref "$replay_evidence" \
            --argjson duplicate_receipts "$duplicate_receipts" \
            '{
              target_sha: $target_sha,
              database_binding_fingerprint: $database_binding_fingerprint,
              deployment: {evidence_ref: $deployment_ref, source_sha: $target_sha},
              runtime: {automation_mode: "dry_run", publication_enabled: false},
              health: ($health[0] + {evidence_ref: $health_ref}),
              transport: {
                queue: {evidence_ref: $queue_ref, exists: true, backlog_count: $queue_backlog},
                dlq: {evidence_ref: $dlq_ref, exists: true, backlog_count: $dlq_backlog}
              },
              read_only_job: {
                evidence_ref: $job_ref,
                job_id: $job_id,
                job_type: "system.health.snapshot",
                idempotency_key: $key,
                permission_class: "READ_ONLY",
                state: "SUCCEEDED",
                attempt_count: $attempt_count,
                external_write: false
              },
              replay: {
                evidence_ref: $replay_ref,
                idempotency_key: $key,
                same_idempotency_key: true,
                reused_existing_job: true,
                duplicate_execution_count: 0,
                duplicate_suppressed_receipt_count: $duplicate_receipts,
                second_external_side_effect: false
              }
            }' > "${RUNNER_TEMP}/hae-runtime-evidence.json"

          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "queue_backlog=$queue_backlog" >> "$GITHUB_OUTPUT"
          echo "dlq_backlog=$dlq_backlog" >> "$GITHUB_OUTPUT"
          echo "duplicate_suppressed_receipts=$duplicate_receipts" >> "$GITHUB_OUTPUT"
          echo "HAE runtime read-only proof PASS job=$job_id attempts=$final_attempt_count duplicate_receipts=$duplicate_receipts queue=$queue_backlog dlq=$dlq_backlog"

      - name: Upload sanitized runtime evidence
        if: steps.request.outputs.operation == 'runtime_readonly_proof'
        uses: actions/upload-artifact@v4
        with:
          name: hae-runtime-evidence
          path: ${{ runner.temp }}/hae-runtime-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove generated config
        if: always()
        run: rm -f workers/automation-engine/wrangler.production.generated.jsonc

  runtime-evidence-qa:
    name: HAE runtime evidence independent QA
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.operation == 'runtime_readonly_proof'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.target_sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download sanitized runtime evidence
        uses: actions/download-artifact@v5
        with:
          name: hae-runtime-evidence
          path: ${{ runner.temp }}/hae-runtime-evidence

      - name: Independently validate executor evidence and attest QA
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/hae-runtime-evidence/hae-runtime-evidence.json
          TARGET_SHA: ${{ needs.release.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_during_runtime_evidence_qa target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import { evaluateHaeRuntimeEvidence } from "./scripts/hae-runtime-evidence-check.mjs";

          const path = process.env.EVIDENCE_PATH;
          const evidence = JSON.parse(fs.readFileSync(path, "utf8"));
          const preliminary = evaluateHaeRuntimeEvidence(evidence);
          const allowedQaBlockers = new Set([
            "INDEPENDENT_QA_EVIDENCE_REF_MISSING",
            "INDEPENDENT_QA_NOT_PASS",
            "QA_INDEPENDENCE_NOT_ATTESTED",
            "QA_REVIEWER_MISSING",
          ]);
          const unexpected = preliminary.blockers.filter((item) => !allowedQaBlockers.has(item.code));
          if (unexpected.length) {
            console.error(JSON.stringify({ status: "BLOCKED", unexpected }, null, 2));
            process.exit(1);
          }

          evidence.independent_qa = {
            evidence_ref: `github-actions://${process.env.GITHUB_REPOSITORY}/runs/${process.env.GITHUB_RUN_ID}/runtime-evidence-qa`,
            status: "PASS",
            independent_from_executor: true,
            reviewer: "github-actions/hae-runtime-evidence-qa",
          };
          fs.writeFileSync(path, JSON.stringify(evidence, null, 2) + "\n");
          NODE

          node scripts/hae-runtime-evidence-check.mjs "$EVIDENCE_PATH"

      - name: Upload accepted evidence package
        uses: actions/upload-artifact@v4
        with:
          name: hae-runtime-evidence-accepted
          path: ${{ runner.temp }}/hae-runtime-evidence/hae-runtime-evidence.json
          if-no-files-found: error
          retention-days: 14

  schema-snapshot-qa:
    name: HAE D1 schema snapshot independent QA
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.operation == 'schema_snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.target_sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download sanitized schema snapshot evidence
        uses: actions/download-artifact@v5
        with:
          name: hae-d1-schema-snapshot
          path: ${{ runner.temp }}/hae-d1-schema-snapshot

      - name: Verify artifact boundary and recompute fingerprint
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/hae-d1-schema-snapshot
          TARGET_SHA: ${{ needs.release.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$TARGET_SHA" ]]; then
            echo "stale_main_during_schema_snapshot_qa target=$TARGET_SHA current=$CURRENT_MAIN"
            exit 1
          fi
          mapfile -t files < <(find "$ARTIFACT_DIR" -type f -print | sort)
          if [[ "${#files[@]}" -ne 1 || "$(basename "${files[0]}")" != "hae-d1-schema-snapshot.json" ]]; then
            echo "schema_snapshot_artifact_boundary_invalid count=${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          node scripts/hae-d1-schema-snapshot.mjs verify \
            --artifact "${files[0]}" \
            --target-sha "$TARGET_SHA" \
            --migration-manifest workers/automation-engine/migrations/manifest.json

          if find "$ARTIFACT_DIR" -type f ! -name 'hae-d1-schema-snapshot.json' -print -quit | grep -q .; then
            echo "schema_snapshot_raw_or_unexpected_file_present"
            exit 1
          fi

      - name: Upload independently accepted schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: hae-d1-schema-snapshot-accepted
          path: ${{ runner.temp }}/hae-d1-schema-snapshot/hae-d1-schema-snapshot.json
          if-no-files-found: error
          retention-days: 14

