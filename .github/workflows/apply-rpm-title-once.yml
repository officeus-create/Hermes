name: Apply RPM title cleanup once

on:
  push:
    branches:
      - seo12/rpm-title-serp-cleanup
    paths:
      - .github/workflows/apply-rpm-title-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: seo12/rpm-title-serp-cleanup
          token: ${{ github.token }}
      - name: Replace exact RPM title and remove applicator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/logistics/resources/rpm-calculator/index.astro')
          old = 'const title = "Free RPM & Load Profitability Calculator for Carriers | Hermes Logistics";'
          new = 'const title = "Free RPM & Load Profit Calculator for Carriers | Hermes";'
          text = p.read_text()
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old title, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/apply-rpm-title-once.yml
          git config user.name "hermes-seo12-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/logistics/resources/rpm-calculator/index.astro
          git commit -m "SEO12: shorten RPM calculator SERP title"
          git push origin HEAD:seo12/rpm-title-serp-cleanup
