name: Home v3 720p quality candidate (preview only)
on:
  push:
    branches: [feat/home-v3-720p-quality-candidate-20261021]
    paths:
      - scripts/media/build-home-v3-720p-candidate.sh
      - .github/workflows/home-v3-720p-candidate.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify FFmpeg is available
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: Download approved high-resolution stock source and render preview
        run: bash scripts/media/build-home-v3-720p-candidate.sh
      - name: Upload visual candidate and source audit as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-home-v3-720p-visual-candidate
          retention-days: 14
          path: |
            public/media/home/*-720.mp4
            public/media/home/*-poster-400.webp
            public/media/home/*-poster-720.webp
            docs/design/HOME_V3_720P_CANDIDATE_METADATA.tsv
      - name: Stage only validated preview media (never publish to production)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/media/home/*-720.mp4 public/media/home/*-poster-400.webp public/media/home/*-poster-720.webp docs/design/HOME_V3_720P_CANDIDATE_METADATA.tsv
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "assets(home): source-encoded 720p QA-only candidate films and posters"
            git push origin "HEAD:feat/home-v3-720p-quality-candidate-20261021"
          fi
