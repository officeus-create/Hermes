name: Home v3 720p quality candidate (preview only)
on:
  push:
    branches: [feat/home-v3-720p-quality-candidate-20261021]
    paths:
      - scripts/media/build-home-v3-720p-candidate.sh
      - .github/workflows/home-v3-720p-candidate.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/media/build-home-v3-720p-candidate.sh
      - .github/workflows/home-v3-720p-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install and verify free FFmpeg codec tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: Download approved high-resolution stock source and render preview
        run: bash scripts/media/build-home-v3-720p-candidate.sh
      - name: Upload visual candidate and source audit as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-home-v3-720p-visual-candidate
          retention-days: 14
          path: |
            public/media/home/*-720.mp4
            public/media/home/*-poster-400.webp
            public/media/home/*-poster-720.webp
            docs/design/HOME_V3_720P_CANDIDATE_METADATA.tsv

  stage-on-preview-branch:
    # Write scope is isolated to this exact trusted same-repository PR head branch; preview assets only.
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/home-v3-720p-quality-candidate-20261021' && github.event.pull_request.head.repo.full_name == 'officeus-create/Hermes'
    needs: render-preview
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-v3-720p-quality-candidate-20261021
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: hermes-home-v3-720p-visual-candidate
          path: .
      - name: Commit preview assets only (no live page changes)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/media/home/*-720.mp4 public/media/home/*-poster-400.webp public/media/home/*-poster-720.webp docs/design/HOME_V3_720P_CANDIDATE_METADATA.tsv
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Preview assets unchanged"
          else
            git commit -m "assets(home): 720p source-master previews for #1983, not referenced on live site"
            git push origin HEAD:refs/heads/feat/home-v3-720p-quality-candidate-20261021
          fi
