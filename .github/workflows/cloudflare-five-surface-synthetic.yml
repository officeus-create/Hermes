name: Cloudflare eight-surface synthetic

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-five-surface-synthetic
  cancel-in-progress: true

jobs:
  verify-public-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out synthetic contract
        uses: actions/checkout@v6

      - name: Verify seven public surfaces
        id: synthetic
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          // Credential-free GET only. Three independent samples expose intermittent 1102.
          const targets = [
            { name: "home", url: "https://hermeslogisticsus.com/", status: 200, markers: ["Hermes Connect"] },
            // This repository-recorded immutable snapshot was one of the two
            // surfaces implicated by #1909. Keep it distinct from current
            // production: a healthy result here is comparative evidence only.
            { name: "immutable-baseline-655e4425", url: "https://655e4425.hermes-eu4.pages.dev/", status: 200 },
            { name: "logistics", url: "https://hermeslogisticsus.com/paths/logistics/", status: 200 },
            { name: "academy", url: "https://hermeslogisticsus.com/paths/academy/", status: 200 },
            { name: "repair-shops", url: "https://hermeslogisticsus.com/services/hermes-connect/repair-shops/", status: 200, markers: ["Founding Shop Plan"] },
            { name: "load-board", url: "https://hermeslogisticsus.com/load-board/", status: 200, markers: ["Car Hauler Load Board"] },
            { name: "connect", url: "https://connect.hermeslogisticsus.com/", status: 308, location: "https://hermeslogisticsus.com/services/hermes-connect/" },
            { name: "app", url: "https://app.hermeslogisticsus.com/", status: 200, markers: ["Hermes Connect"] },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const diagnosticHeaders = (response) => ({
            ray: response.headers.get("cf-ray"),
            cacheStatus: response.headers.get("cf-cache-status"),
            server: response.headers.get("server"),
            contentType: response.headers.get("content-type"),
          });
          let failed = false;

          for (const target of targets) {
            let firstFailure = null;
            let firstResourceFailure = null;
            let samplesPassed = 0;
            let resourceErrors = 0;

            // Never break on a 200: a later 1102 is still a real incident.
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              let observation;
              try {
                const url = new URL(target.url);
                url.searchParams.set("synthetic", String(Date.now()) + "-" + attempt);
                const response = await fetch(url, {
                  method: "GET",
                  redirect: "manual",
                  headers: {
                    "cache-control": "no-cache",
                    pragma: "no-cache",
                    "user-agent": "HermesCloudflareSynthetic/1.1 (+public-read-only)",
                  },
                  signal: AbortSignal.timeout(20_000),
                });

                const responseMetadata = {
                  attempt,
                  status: response.status,
                  location: response.headers.get("location"),
                  ...diagnosticHeaders(response),
                };
                let body = "";
                try {
                  body = (target.markers || response.status >= 500) ? await response.text() : "";
                } catch (error) {
                  observation = {
                    ...responseMetadata,
                    kind: "body_read_failure",
                    error: error instanceof Error ? error.name : "body_read_failure",
                  };
                }

                if (!observation) {
                  const missing = (target.markers || []).filter((marker) => !body.includes(marker));
                  const error1102 = /Error\s*1102|Worker exceeded resource limits/i.test(body);
                  observation = {
                    ...responseMetadata,
                    missing,
                    error1102,
                    kind: error1102 ? "cloudflare_1102" : response.status >= 500 ? "http_5xx" : null,
                  };
                  if (error1102) {
                    resourceErrors += 1;
                    firstResourceFailure ??= observation;
                  }

                  if (
                    response.status === target.status &&
                    missing.length === 0 &&
                    !error1102 &&
                    (!target.location || responseMetadata.location === target.location)
                  ) {
                    samplesPassed += 1;
                  }
                }
              } catch (error) {
                observation = {
                  attempt,
                  kind: "request_failure",
                  error: error instanceof Error ? error.name : "request_failure",
                };
              }

              // Record the first failure, even if a later sample succeeds.
              if (observation.error || observation.error1102 ||
                  observation.status !== target.status || observation.missing?.length ||
                  (target.location && observation.location !== target.location)) {
                firstFailure ??= observation;
              }
              if (attempt < 3) await sleep(1_500);
            }

            if (samplesPassed !== 3 || firstFailure) {
              failed = true;
              console.error("FAIL " + target.name + " stable=" + samplesPassed + "/3 1102=" +
                resourceErrors + " first=" + JSON.stringify(firstFailure) +
                " resource=" + JSON.stringify(firstResourceFailure));
            } else {
              console.log("PASS " + target.name + " stable=3/3");
            }
          }

          if (failed) process.exit(1);
          NODE

      - name: Report failure in Actions summary
        if: steps.synthetic.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## Cloudflare eight-surface synthetic — FAIL"
            echo
            echo "At least one of three samples failed on one or more public surfaces in scheduled run `${GITHUB_RUN_ID}`."
            echo
            echo "Checked eight public GET-only surfaces (home, the repository-recorded immutable Pages baseline, Logistics, Academy, Repair Shops, Load Board, Connect, app), three spaced samples each. The immutable baseline is comparative evidence, not current-deployment proof. A recovered retry never clears an observed 1102. No customer payload, production mutation, Cloudflare credential, or private identifier was used."
            echo
            echo "Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce synthetic result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.synthetic.outcome }}" != "success" ]]; then
            exit 1
          fi
