name: Cloudflare five-surface synthetic

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-five-surface-synthetic
  cancel-in-progress: true

jobs:
  verify-public-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out synthetic contract
        uses: actions/checkout@v6

      - name: Verify five public surfaces
        id: synthetic
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          // Credential-free GET only. Three independent samples expose intermittent 1102.
          const targets = [
            { name: "home", url: "https://hermeslogisticsus.com/", status: 200, markers: ["Hermes Connect"] },
            { name: "logistics", url: "https://hermeslogisticsus.com/paths/logistics/", status: 200 },
            { name: "academy", url: "https://hermeslogisticsus.com/paths/academy/", status: 200 },
            { name: "repair-shops", url: "https://hermeslogisticsus.com/services/hermes-connect/repair-shops/", status: 200, markers: ["Founding Shop Plan"] },
            { name: "load-board", url: "https://hermeslogisticsus.com/load-board/", status: 200, markers: ["Car Hauler Load Board"] },
            { name: "connect", url: "https://connect.hermeslogisticsus.com/", status: 308, location: "https://hermeslogisticsus.com/services/hermes-connect/" },
            { name: "app", url: "https://app.hermeslogisticsus.com/", status: 200, markers: ["Hermes Connect"] },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let failed = false;

          for (const target of targets) {
            let firstFailure = null;
            let samplesPassed = 0;
            let resourceErrors = 0;

            // Never break on a 200: a later 1102 is still a real incident.
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              let observation;
              try {
                const url = new URL(target.url);
                url.searchParams.set("synthetic", String(Date.now()) + "-" + attempt);
                const response = await fetch(url, {
                  method: "GET",
                  redirect: "manual",
                  headers: {
                    "cache-control": "no-cache",
                    pragma: "no-cache",
                    "user-agent": "HermesCloudflareSynthetic/1.1 (+public-read-only)",
                  },
                  signal: AbortSignal.timeout(20_000),
                });

                const body = target.markers || response.status >= 500 ? await response.text() : "";
                const missing = (target.markers || []).filter((marker) => !body.includes(marker));
                const location = response.headers.get("location");
                const error1102 = /Error\s*1102|Worker exceeded resource limits/i.test(body);
                observation = { attempt, status: response.status, missing, location, error1102 };
                if (error1102) resourceErrors += 1;

                if (
                  response.status === target.status &&
                  missing.length === 0 &&
                  !error1102 &&
                  (!target.location || location === target.location)
                ) {
                  samplesPassed += 1;
                }
              } catch (error) {
                observation = { attempt, error: error instanceof Error ? error.name : "request_failure" };
              }

              // Record the first failure, even if a later sample succeeds.
              if (observation.error || observation.error1102 ||
                  observation.status !== target.status || observation.missing?.length ||
                  (target.location && observation.location !== target.location)) {
                firstFailure ??= observation;
              }
              if (attempt < 3) await sleep(1_500);
            }

            if (samplesPassed !== 3 || firstFailure) {
              failed = true;
              console.error("FAIL " + target.name + " stable=" + samplesPassed + "/3 1102=" +
                resourceErrors + " first=" + JSON.stringify(firstFailure));
            } else {
              console.log("PASS " + target.name + " stable=3/3");
            }
          }

          if (failed) process.exit(1);
          NODE

      - name: Report failure in Actions summary
        if: steps.synthetic.outcome != 'success'
        shell: bash
        run: |
          {
            echo "## Cloudflare five-surface synthetic — FAIL"
            echo
            echo "At least one of three samples failed on one or more public surfaces in scheduled run `${GITHUB_RUN_ID}`."
            echo
            echo "Checked seven public GET-only surfaces (home, Logistics, Academy, Repair Shops, Load Board, Connect, app), three spaced samples each. A recovered retry never clears an observed 1102. No customer payload, production mutation, Cloudflare credential, or private identifier was used."
            echo
            echo "Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce synthetic result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.synthetic.outcome }}" != "success" ]]; then
            exit 1
          fi


  hae-cloudflare-auditor-source:
    if: always()
    needs: verify-public-surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out exact workflow main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Capture exact trusted main SHA
        shell: bash
        run: |
          set -euo pipefail
          echo "HAE_CLOUDFLARE_EXPECTED_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate Cloudflare auditor source adapter
        run: node scripts/hae-cloudflare-auditor-source.test.mjs

      - name: Enqueue minimized authenticated Cloudflare audit receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_HAE_RELEASE_TOKEN: ${{ secrets.CLOUDFLARE_HAE_RELEASE_TOKEN }}
          HAE_CLOUDFLARE_RUN_ID: ${{ github.run_id }}
          HAE_CLOUDFLARE_RUN_ATTEMPT: ${{ github.run_attempt }}
          HAE_CLOUDFLARE_SYNTHETIC_RESULT: ${{ needs.verify-public-surfaces.result }}
        run: node scripts/hae-cloudflare-auditor-source.mjs

      - name: Retain sanitized Cloudflare auditor receipt
        uses: actions/upload-artifact@v4
        with:
          name: hae-cloudflare-auditor-receipt
          path: ${{ runner.temp }}/hae-cloudflare-auditor-receipt.json
          if-no-files-found: error
          retention-days: 90
