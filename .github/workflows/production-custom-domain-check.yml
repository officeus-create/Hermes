name: Production custom-domain check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - functions/_middleware.js
      - scripts/connect-host-routing.test.mjs
      - scripts/check-production-custom-domain.mjs
      - scripts/check-production-domain-issue.mjs
      - .github/workflows/production-custom-domain-check.yml
      - .github/workflows/production-domain-verifier-command.yml
  push:
    branches:
      - main
    paths:
      - functions/_middleware.js
      - scripts/connect-host-routing.test.mjs
      - scripts/check-production-custom-domain.mjs
      - scripts/check-production-domain-issue.mjs
      - .github/workflows/production-custom-domain-check.yml
      - .github/workflows/production-domain-verifier-command.yml

permissions:
  contents: read

concurrency:
  group: production-custom-domain-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Read-only public custom-domain reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Observe current production state
        id: production_check
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: node scripts/check-production-domain-issue.mjs

      - name: Explain pre-merge stale state
        if: github.event_name == 'pull_request' && steps.production_check.outcome == 'failure'
        run: |
          echo "The pull request observed the current live release before this fix is merged."
          echo "The sanitized report is preserved below; post-merge main and the issue command enforce the corrected production state."

      - name: Publish check summary
        if: always()
        run: |
          if [ -f artifacts/production-custom-domain-check.md ]; then
            cat artifacts/production-custom-domain-check.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production custom-domain report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-custom-domain-check
          path: |
            artifacts/production-custom-domain-check.json
            artifacts/production-custom-domain-check.md
          if-no-files-found: error
          retention-days: 30
