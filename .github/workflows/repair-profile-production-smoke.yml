name: One-time Repair Shop profile production smoke

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-profile-production-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    name: Verify production Repair Shop profile and public slug
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exercise real production profile persistence
        shell: bash
        run: |
          set -euo pipefail
          TEST_ID="$(date +%s)-${GITHUB_RUN_ID}"
          TEST_EMAIL="repair-profile-test-${TEST_ID}@hermesconnect.app"
          TEST_PASSWORD="HermesProfile-${TEST_ID}-A9!"
          COOKIE="${RUNNER_TEMP}/profile.cookies"
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_EMAIL=$TEST_EMAIL"

          REGISTER_JSON="$(jq -nc --arg email "$TEST_EMAIL" --arg password "$TEST_PASSWORD" '{email:$email,password:$password,name:"Hermes Profile Test",role:"Shop Owner",location:"United States",bio:"Temporary production profile verification account for Hermes Connect Repair Shops."}')"
          RC="$(curl -sS -o "${RUNNER_TEMP}/register.json" -w '%{http_code}' -c "$COOKIE" -X POST https://hermeslogisticsus.com/api/auth/register -H 'Content-Type: application/json' --data-binary "$REGISTER_JSON")"
          echo "REGISTER_HTTP=$RC"; cat "${RUNNER_TEMP}/register.json"; echo
          test "$RC" = 201
          OWNER_ID="$(jq -r '.specialist.id' "${RUNNER_TEMP}/register.json")"
          echo "OWNER_ID=$OWNER_ID"

          GC="000"
          for attempt in $(seq 1 36); do
            GC="$(curl -sS -o "${RUNNER_TEMP}/get0.json" -w '%{http_code}' -b "$COOKIE" https://hermeslogisticsus.com/api/repair-shop/profile || true)"
            echo "INITIAL_PROFILE_ATTEMPT_${attempt}_HTTP=$GC"
            if [ "$GC" = 200 ]; then break; fi
            sleep 10
          done
          echo "INITIAL_PROFILE_HTTP=$GC"; cat "${RUNNER_TEMP}/get0.json"; echo
          test "$GC" = 200
          test "$(jq -r '.shop == null' "${RUNNER_TEMP}/get0.json")" = true

          BAD='{"name":"Bad Timezone Shop","city":"Milwaukee","state":"WI","timezone":"UTC"}'
          BC="$(curl -sS -o "${RUNNER_TEMP}/bad.json" -w '%{http_code}' -b "$COOKIE" -X PUT https://hermeslogisticsus.com/api/repair-shop/profile -H 'Content-Type: application/json' --data-binary "$BAD")"
          echo "INVALID_TIMEZONE_HTTP=$BC"; cat "${RUNNER_TEMP}/bad.json"; echo
          test "$BC" = 400
          test "$(jq -r '.error' "${RUNNER_TEMP}/bad.json")" = invalid_timezone

          SHOP_NAME="Hermes Profile Test ${TEST_ID}"
          PROFILE="$(jq -nc --arg name "$SHOP_NAME" '{name:$name,phone:"+1 414 555 0100",address_line1:"123 Test Street",city:"Milwaukee",state:"WI",postal_code:"53202",timezone:"America/Chicago"}')"
          PC="$(curl -sS -o "${RUNNER_TEMP}/put.json" -w '%{http_code}' -b "$COOKIE" -X PUT https://hermeslogisticsus.com/api/repair-shop/profile -H 'Content-Type: application/json' --data-binary "$PROFILE")"
          echo "CREATE_PROFILE_HTTP=$PC"; cat "${RUNNER_TEMP}/put.json"; echo
          test "$PC" = 200
          SHOP_ID="$(jq -r '.shop.id' "${RUNNER_TEMP}/put.json")"
          SLUG="$(jq -r '.shop.slug' "${RUNNER_TEMP}/put.json")"
          test -n "$SHOP_ID"; test -n "$SLUG"
          echo "SHOP_ID=$SHOP_ID"; echo "SHOP_SLUG=$SLUG"

          G1="$(curl -sS -o "${RUNNER_TEMP}/get1.json" -w '%{http_code}' -b "$COOKIE" https://hermeslogisticsus.com/api/repair-shop/profile)"
          echo "PROFILE_RELOAD_HTTP=$G1"
          test "$G1" = 200
          test "$(jq -r '.shop.slug' "${RUNNER_TEMP}/get1.json")" = "$SLUG"
          test "$(jq -r '.shop.timezone' "${RUNNER_TEMP}/get1.json")" = America/Chicago
          echo "PROFILE_PERSISTED=YES"

          PUBLIC_URL="https://hermeslogisticsus.com/api/public/repair-shop?slug=${SLUG}"
          PUB1="$(curl -sS -o "${RUNNER_TEMP}/pub1.json" -w '%{http_code}' "$PUBLIC_URL")"
          echo "PUBLIC_PROFILE_HTTP=$PUB1"; cat "${RUNNER_TEMP}/pub1.json"; echo
          test "$PUB1" = 200
          test "$(jq -r '.shop.slug' "${RUNNER_TEMP}/pub1.json")" = "$SLUG"
          test "$(jq -r '.shop.city' "${RUNNER_TEMP}/pub1.json")" = Milwaukee
          test "$(jq '.services | length' "${RUNNER_TEMP}/pub1.json")" = 0
          if grep -q 'owner_specialist_id' "${RUNNER_TEMP}/pub1.json"; then echo 'PUBLIC_OWNER_ID_LEAK=YES'; exit 1; fi
          echo "PUBLIC_OWNER_ID_LEAK=NO"

          UPDATED="$(jq -nc --arg name "$SHOP_NAME Updated" '{name:$name,phone:"+1 414 555 0100",address_line1:"456 Updated Street",city:"Madison",state:"WI",postal_code:"53703",timezone:"America/Chicago"}')"
          UC="$(curl -sS -o "${RUNNER_TEMP}/update.json" -w '%{http_code}' -b "$COOKIE" -X PUT https://hermeslogisticsus.com/api/repair-shop/profile -H 'Content-Type: application/json' --data-binary "$UPDATED")"
          echo "UPDATE_PROFILE_HTTP=$UC"; cat "${RUNNER_TEMP}/update.json"; echo
          test "$UC" = 200
          test "$(jq -r '.shop.slug' "${RUNNER_TEMP}/update.json")" = "$SLUG"
          echo "SLUG_STABLE_AFTER_UPDATE=YES"

          PUB2="$(curl -sS -o "${RUNNER_TEMP}/pub2.json" -w '%{http_code}' "$PUBLIC_URL")"
          echo "PUBLIC_AFTER_UPDATE_HTTP=$PUB2"; cat "${RUNNER_TEMP}/pub2.json"; echo
          test "$PUB2" = 200
          test "$(jq -r '.shop.city' "${RUNNER_TEMP}/pub2.json")" = Madison
          test "$(jq -r '.shop.slug' "${RUNNER_TEMP}/pub2.json")" = "$SLUG"

          SERVICE="$(jq -nc '{name:"Profile Smoke Brake Inspection",duration_minutes:45}')"
          SC="$(curl -sS -o "${RUNNER_TEMP}/service.json" -w '%{http_code}' -b "$COOKIE" -X POST https://hermeslogisticsus.com/api/services -H 'Content-Type: application/json' --data-binary "$SERVICE")"
          echo "ADD_SERVICE_HTTP=$SC"; cat "${RUNNER_TEMP}/service.json"; echo
          test "$SC" = 201
          SERVICE_ID="$(jq -r '.service.id' "${RUNNER_TEMP}/service.json")"

          PUB3="$(curl -sS -o "${RUNNER_TEMP}/pub3.json" -w '%{http_code}' "$PUBLIC_URL")"
          test "$PUB3" = 200
          test "$(jq --arg id "$SERVICE_ID" '[.services[] | select(.id == $id)] | length' "${RUNNER_TEMP}/pub3.json")" = 1
          echo "PUBLIC_SERVICE_RELATION=YES"

          DC="$(curl -sS -o "${RUNNER_TEMP}/delete-service.json" -w '%{http_code}' -b "$COOKIE" -X DELETE "https://hermeslogisticsus.com/api/services/${SERVICE_ID}")"
          echo "DELETE_TEST_SERVICE_HTTP=$DC"
          test "$DC" = 200

          echo "FINAL_PROFILE_VERDICT=PASS"
