name: Apply Technology responsive ownership

on:
  push:
    branches:
      - seo12/technology-global-css-route-split

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: seo12/technology-global-css-route-split

      - name: Apply responsive ownership fix
        run: node scripts/apply-technology-responsive-ownership.mjs

      - name: Remove temporary helpers and verify
        run: |
          rm scripts/apply-technology-responsive-ownership.mjs
          rm .github/workflows/technology-responsive-diagnostic.yml
          git diff --check
          git diff -- src/styles/global.css src/styles/features/technology.css

      - name: Commit corrected split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SEO12: keep Technology responsive overrides with their owner bundle'
          git push origin HEAD:seo12/technology-global-css-route-split
