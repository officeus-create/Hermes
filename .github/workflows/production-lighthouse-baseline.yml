name: Production Lighthouse baseline

on:
  push:
    branches: [investigate/load-board-mobile-trace-20261008]
    paths: [.github/workflows/production-lighthouse-baseline.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: load-board-mobile-trace-20261008
  cancel-in-progress: false

jobs:
  lighthouse:
    name: Three sequential Load Board mobile lab traces on bbddded9
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: bbddded92734ba6cd3ec3d522540e6717d6a102e
      GH_TOKEN: ${{ github.token }}
      TARGET_URL: https://hermeslogisticsus.com/load-board/
    steps:
      - name: Check out exact deployed main
        uses: actions/checkout@v4
        with:
          ref: bbddded92734ba6cd3ec3d522540e6717d6a102e
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Three sequential first-visit mobile passes
        run: |
          mkdir -p lighthouse-results
          for pass in 1 2 3; do
            node scripts/verify-lighthouse-release.mjs
            ps -eo pid,pcpu,comm --sort=-pcpu | head -10
            npx --yes lighthouse@13.4.1 "$TARGET_URL" \
              --output=json \
              --output-path="lighthouse-results/load-board-${pass}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --save-assets \
              --quiet
          done
          node scripts/verify-lighthouse-release.mjs
      - name: Upload exact-release reports and raw traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-board-mobile-three-traces-bbddded9
          path: lighthouse-results/
          if-no-files-found: error
          retention-days: 30
