name: Telegram gateway contract
on:
  pull_request:
    paths:
      - 'workers/telegram-gateway/**'
      - '.github/workflows/telegram-gateway-contract.yml'
  push:
    branches: [main]
    paths:
      - 'workers/telegram-gateway/**'
      - '.github/workflows/telegram-gateway-contract.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test workers/telegram-gateway/test/gateway.test.mjs
