name: Owner Codex Control Center

on:
  pull_request:
    paths:
      - "src/pages/services/hermes-connect/owner/**"
      - "functions/api/owner-codex/**"
      - "functions/api/_lib/owner-codex.mjs"
      - "scripts/ai/hermes-owner-codex-runner.py"
      - "scripts/owner-codex-control-center-contract.test.mjs"
      - "tests/owner-hermes-codex-control-center.spec.ts"
      - ".github/workflows/owner-codex-control-center.yml"
  push:
    branches:
      - main
    paths:
      - "src/pages/services/hermes-connect/owner/**"
      - "functions/api/owner-codex/**"
      - "functions/api/_lib/owner-codex.mjs"
      - "scripts/ai/hermes-owner-codex-runner.py"
      - "scripts/owner-codex-control-center-contract.test.mjs"
      - "tests/owner-hermes-codex-control-center.spec.ts"
      - ".github/workflows/owner-codex-control-center.yml"

jobs:
  owner-codex-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/owner-codex-control-center-contract.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/owner-hermes-codex-control-center.spec.ts --project=desktop --project=mobile
