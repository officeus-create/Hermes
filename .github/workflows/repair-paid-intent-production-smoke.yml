name: Repair paid-intent production smoke

on:
  workflow_run:
    workflows: ["Deploy approved main to Cloudflare Pages v2"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: repair-paid-intent-production-smoke
  cancel-in-progress: false

jobs:
  verify-paid-intent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out exact deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}

      - name: Verify current paid-plan production truth
        id: production_truth
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          live=0
          for attempt in $(seq 1 18); do
            url="https://hermeslogisticsus.com/services/hermes-connect/repair-shops/plan/?paid-intent-smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            html="$(curl --request GET --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "$url")"

            if grep -Fq 'Founding Shop Plan' <<<"$html" \
              && grep -Fq '$99/month per repair shop location' <<<"$html" \
              && grep -Fq 'Start free. Pay only after your shop is configured.' <<<"$html" \
              && grep -Fq 'No card is charged during setup.' <<<"$html"; then
              echo "Current paid-plan production truth observed on attempt $attempt."
              live=1
              break
            fi

            echo "Paid-plan production markers are not current yet on attempt $attempt."
            sleep 10
          done

          if [[ "$live" != "1" ]]; then
            echo "Current paid-plan truth was not observed on the production custom domain." >&2
            exit 1
          fi

      - name: Report GET-only paid-plan availability
        if: always()
        shell: bash
        env:
          TRUTH_OUTCOME: ${{ steps.production_truth.outcome }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Repair Shop paid-plan GET-only availability

          - tested repository revision: \`${TESTED_SHA}\`
          - production paid-plan truth: \`${TRUTH_OUTCOME}\`
          - production request submission: NOT_RUN
          - receiver: UNKNOWN (NOT_RUN)
          - delivery / human receipt: UNKNOWN (NOT_RUN)
          - production duplicate submission: NOT_RUN
          - qualification: UNKNOWN (NOT_RUN)
          - revenue: UNKNOWN (NOT_RUN)
          - idempotency: offline/mock CI tests only; production NOT_RUN
          - workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This workflow reads the public page only. Page availability is not receiver, delivery, lead, payment or revenue evidence.
          EOF

      - name: Enforce GET-only paid-plan availability
        if: always()
        shell: bash
        env:
          TRUTH_OUTCOME: ${{ steps.production_truth.outcome }}
        run: |
          if [[ "$TRUTH_OUTCOME" != "success" ]]; then
            exit 1
          fi
