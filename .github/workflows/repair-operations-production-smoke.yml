name: Repair Shop operations production smoke

on:
  push:
    branches: [main]
    paths:
      - functions/api/_lib/repair-shop-followups-schema.mjs
      - functions/api/public/repair-booking.ts
      - functions/api/repair-shop/bookings/**
      - functions/api/repair-shop/followups.ts
      - functions/api/repair-shop/cleanup-booking-smoke.ts
      - public/repair-shop-operations.js
      - scripts/repair-operations-production-smoke.sh
      - .github/workflows/repair-operations-production-smoke.yml

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: repair-shop-operations-production
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify production no-show and follow-up loop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4

      - name: Wait for capacity proof and verify operating loop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/repair-operations-production-smoke.sh
