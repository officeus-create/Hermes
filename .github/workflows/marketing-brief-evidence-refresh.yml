name: Marketing brief evidence refresh

on:
  push:
    branches:
      - qa/marketing-brief-evidence-v1

permissions:
  contents: write

jobs:
  refresh-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v6
        with:
          ref: qa/marketing-brief-evidence-v1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch bounded screenshot capture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/site.spec.ts')
          text = path.read_text()
          old = '''  await page.locator('input[name="primary_goal"]').fill("More qualified leads <script>alert(1)</script>");

  if (testInfo.project.name === "desktop") {
    await page.locator("[data-direction-fields]").screenshot({ path: "docs/screenshots/intake02-marketing-desktop.png" });
  }

  await page.locator('button[type="submit"]').click();'''
          new = '''  const primaryGoal = page.locator('input[name="primary_goal"]');
          await primaryGoal.fill("More qualified leads for a service business");

          await page.addStyleTag({
            content: "[data-header], [data-consent-settings] { visibility: hidden !important; }",
          });
          const evidencePath = testInfo.project.name === "mobile"
            ? "docs/screenshots/intake02-marketing-mobile.png"
            : "docs/screenshots/intake02-marketing-desktop.png";
          await page.locator("[data-direction-fields]").screenshot({ path: evidencePath, animations: "disabled" });

          // Keep the sanitization contract after capturing clean, synthetic visual evidence.
          await primaryGoal.fill("More qualified leads <script>alert(1)</script>");
          await page.locator('button[type="submit"]').click();'''
          if old not in text:
              raise SystemExit('Expected bounded marketing screenshot block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1))

          log = Path('docs/CURSOR_WORK_LOG.md')
          log_text = log.read_text()
          old_log = '''### Screenshots / UI evidence
- `docs/screenshots/intake02-marketing-desktop.png`
'''
          new_log = '''### Screenshots / UI evidence
- `docs/screenshots/intake02-marketing-desktop.png`
- `docs/screenshots/intake02-marketing-mobile.png`
- Evidence refreshed on 2026-08-11 with sticky header and privacy settings hidden only during capture; production UI behavior is unchanged.
'''
          if old_log not in log_text:
              raise SystemExit('Expected Session 02 screenshot log block not found; refusing broad edit')
          log.write_text(log_text.replace(old_log, new_log, 1))
          PY

      - name: Build website
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and verify Marketing Brief evidence
        run: npx playwright test tests/site.spec.ts --project=desktop --project=mobile --grep "marketing field group supports multiple platforms"

      - name: Verify clean patch
        run: git diff --check

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketing-brief-evidence
          path: |
            tests/site.spec.ts
            docs/CURSOR_WORK_LOG.md
            docs/screenshots/intake02-marketing-desktop.png
            docs/screenshots/intake02-marketing-mobile.png
          if-no-files-found: error

      - name: Commit verified evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/site.spec.ts docs/CURSOR_WORK_LOG.md docs/screenshots/intake02-marketing-desktop.png docs/screenshots/intake02-marketing-mobile.png
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
            exit 0
          fi
          git commit -m "QA: refresh marketing brief visual evidence"
          git push origin HEAD:qa/marketing-brief-evidence-v1
