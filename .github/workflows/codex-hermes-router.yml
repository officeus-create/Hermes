name: Codex Hermes router checks

on:
  pull_request:
    paths:
      - "scripts/ai/codex-hermes"
      - "scripts/ai/codex-hermes-doctor"
      - "scripts/ai/codex-hermes-server"
      - "scripts/ai/patch-fcc-ollama-thinking.py"
      - "scripts/ai/hermes-internal-ai-runner.py"
      - "scripts/ai/hermes-internal-ai-sanitize.py"
      - "scripts/ai/setup-codex-hermes.sh"
      - "scripts/ai/bootstrap-hermes-openssl.sh"
      - "scripts/codex-hermes-openssl-bootstrap.test.mjs"
      - "docs/CODEX_HERMES_RUNTIME.md"
      - "docs/HERMES_CONNECT_AI_INTERNAL_RUNNER.md"
      - ".github/workflows/codex-hermes-router.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/ai/codex-hermes"
      - "scripts/ai/codex-hermes-doctor"
      - "scripts/ai/codex-hermes-server"
      - "scripts/ai/patch-fcc-ollama-thinking.py"
      - "scripts/ai/hermes-internal-ai-runner.py"
      - "scripts/ai/hermes-internal-ai-sanitize.py"
      - "scripts/ai/setup-codex-hermes.sh"
      - "scripts/ai/bootstrap-hermes-openssl.sh"
      - "scripts/codex-hermes-openssl-bootstrap.test.mjs"
      - "docs/CODEX_HERMES_RUNTIME.md"
      - "docs/HERMES_CONNECT_AI_INTERNAL_RUNNER.md"
      - ".github/workflows/codex-hermes-router.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shell and Python syntax
        run: |
          bash -n scripts/ai/setup-codex-hermes.sh
          bash -n scripts/ai/bootstrap-hermes-openssl.sh
          bash -n scripts/ai/codex-hermes-server
          bash -n scripts/ai/codex-hermes
          bash -n scripts/ai/codex-hermes-doctor
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in (
              Path("scripts/ai/patch-fcc-ollama-thinking.py"),
              Path("scripts/ai/hermes-internal-ai-runner.py"),
              Path("scripts/ai/hermes-internal-ai-sanitize.py"),
          ):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: Validate executable bits
        run: |
          test -x scripts/ai/setup-codex-hermes.sh
          test -x scripts/ai/codex-hermes-server
          test -x scripts/ai/codex-hermes
          test -x scripts/ai/codex-hermes-doctor

      - name: Validate isolation and pinned upstream contract
        run: |
          grep -Fq 'CODEX_HOME="${HERMES_CODEX_HOME:-$HOME/.codex-hermes}"' scripts/ai/codex-hermes
          grep -Fq 'exec "$FCC_CODEX" "$@"' scripts/ai/codex-hermes
          grep -Fq '8b312c3a18279466732c3942d7e9246a75725d51' scripts/ai/setup-codex-hermes.sh
          grep -Fq 'FCC_VERSION="5.14.5"' scripts/ai/setup-codex-hermes.sh
          grep -Fq 'patch-fcc-ollama-thinking.py' scripts/ai/setup-codex-hermes.sh
          grep -Fq 'patch-fcc-ollama-thinking.py' scripts/ai/codex-hermes-server
          if grep -R -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,})' \
            scripts/ai/codex-hermes scripts/ai/codex-hermes-doctor scripts/ai/codex-hermes-server scripts/ai/patch-fcc-ollama-thinking.py scripts/ai/hermes-internal-ai-runner.py scripts/ai/hermes-internal-ai-sanitize.py scripts/ai/setup-codex-hermes.sh scripts/ai/bootstrap-hermes-openssl.sh; then
            echo "Potential credential material detected in Hermes Codex/Internal AI router scripts" >&2
            exit 1
          fi

      - name: Validate FCC Ollama reasoning capability patch contract
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          site="$tmp/site"
          mkdir -p "$site/free_claude_code/api" "$site/free_claude_code-5.14.5.dist-info"
          cat > "$site/free_claude_code-5.14.5.dist-info/METADATA" <<'EOF'
          Metadata-Version: 2.1
          Name: free-claude-code
          Version: 5.14.5
          EOF
          cat > "$site/free_claude_code/api/model_catalog.py" <<'PY'
          def build(inventory_model, provider_model_ref):
              allows_reasoning = inventory_model.supports_thinking is not False
              return allows_reasoning
          PY

          PYTHONPATH="$site" python3 scripts/ai/patch-fcc-ollama-thinking.py --site-packages "$site"
          PYTHONPATH="$site" python3 scripts/ai/patch-fcc-ollama-thinking.py --site-packages "$site" --check
          grep -Fq 'inventory_model.supports_thinking is True' "$site/free_claude_code/api/model_catalog.py"
          grep -Fq 'provider_model_ref.startswith("ollama/")' "$site/free_claude_code/api/model_catalog.py"
          grep -Fq 'else inventory_model.supports_thinking is not False' "$site/free_claude_code/api/model_catalog.py"

          PYTHONPATH="$site" python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("$site/free_claude_code/api/model_catalog.py")
          spec = importlib.util.spec_from_file_location("patched_catalog", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          class M:
              def __init__(self, value): self.supports_thinking = value
          assert mod.build(M(None), "ollama/qwen2.5-coder:3b") is False
          assert mod.build(M(False), "ollama/qwen2.5-coder:3b") is False
          assert mod.build(M(True), "ollama/qwen3:4b-thinking") is True
          assert mod.build(M(None), "open_router/example") is True
          PY

      - name: Validate read-only Internal AI doctor contract
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/home/.fcc" "$tmp/home/.codex-hermes" "$tmp/fcc/bin" "$tmp/bin" "$tmp/work/scripts/ai"
          : > "$tmp/home/.fcc/.env"

          cat > "$tmp/bin/codex" <<'EOF'
          #!/usr/bin/env bash
          printf 'codex-test 0.0\n'
          EOF
          chmod +x "$tmp/bin/codex"

          cat > "$tmp/fcc/bin/fcc-codex" <<'EOF'
          #!/usr/bin/env bash
          printf 'fcc-codex-test 5.14.5\n'
          EOF
          chmod +x "$tmp/fcc/bin/fcc-codex"

          cat > "$tmp/fcc/bin/python" <<'EOF'
          #!/usr/bin/env bash
          case "$*" in
            *'import importlib.metadata'*) printf '5.14.5\n' ;;
            *'import sysconfig'*) printf '%s\n' "${HERMES_TEST_SITE_PACKAGES:-/tmp/fake-site-packages}" ;;
            *'patch-fcc-ollama-thinking.py'*) exit 0 ;;
            *) printf '5.14.5\n' ;;
          esac
          EOF
          chmod +x "$tmp/fcc/bin/python"

          cp AGENTS.md "$tmp/work/AGENTS.md"
          cp scripts/ai/codex-hermes "$tmp/work/scripts/ai/codex-hermes"
          cp scripts/ai/patch-fcc-ollama-thinking.py "$tmp/work/scripts/ai/patch-fcc-ollama-thinking.py"
          cp scripts/ai/hermes-internal-ai-runner.py "$tmp/work/scripts/ai/hermes-internal-ai-runner.py"
          cp scripts/ai/hermes-internal-ai-sanitize.py "$tmp/work/scripts/ai/hermes-internal-ai-sanitize.py"
          chmod +x "$tmp/work/scripts/ai/codex-hermes"

          git init --bare "$tmp/origin.git" >/dev/null
          git -C "$tmp/work" init -b main >/dev/null
          git -C "$tmp/work" config user.email doctor@example.invalid
          git -C "$tmp/work" config user.name HermesDoctorTest
          git -C "$tmp/work" add AGENTS.md scripts/ai
          git -C "$tmp/work" commit -m baseline >/dev/null
          git -C "$tmp/work" remote add origin "$tmp/origin.git"
          git -C "$tmp/work" push -u origin main >/dev/null
          before="$(git -C "$tmp/work" rev-parse HEAD)"

          unset HERMES_INTERNAL_OWNER_BOOTSTRAP_TOKEN
          HOME="$tmp/home" \
          PATH="$tmp/bin:$PATH" \
          HERMES_REPO_ROOT="$tmp/work" \
          HERMES_FCC_VENV="$tmp/fcc" \
          HERMES_CODEX_HOME="$tmp/home/.codex-hermes" \
          HERMES_INTERNAL_AI_API="https://example.test/api" \
          HERMES_INTERNAL_AI_RUNNER_TOKEN="synthetic-doctor-token-12345678901234567890" \
          ./scripts/ai/codex-hermes-doctor --internal-ai | tee "$tmp/doctor.out"

          grep -Fq 'INTERNAL_AI_PREFLIGHT=PASS' "$tmp/doctor.out"
          grep -Fq "LOCAL_HEAD_SHA=$before" "$tmp/doctor.out"
          grep -Fq "REMOTE_MAIN_SHA=$before" "$tmp/doctor.out"
          grep -Fq 'REMOTE_BROWSER_TO_CODEX=UNVERIFIED' "$tmp/doctor.out"
          ! grep -Fq 'synthetic-doctor-token' "$tmp/doctor.out"
          test "$(git -C "$tmp/work" rev-parse HEAD)" = "$before"
          test -z "$(git -C "$tmp/work" status --porcelain --untracked-files=no)"

      - name: Validate Intel macOS OpenSSL bootstrap contract
        run: node scripts/codex-hermes-openssl-bootstrap.test.mjs
