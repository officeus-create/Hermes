name: Hermes Connect weekly inactivity reminders

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMINDER_URL: https://hermeslogisticsus.com/api/internal/reminders/weekly-inactivity
      OIDC_AUDIENCE: hermes-connect-weekly-inactivity-reminders
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/oidc-response.json"
          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" \
            -o "$response_file"
          token="$(jq -r '.value // empty' "$response_file")"
          if [ -z "$token" ]; then
            echo "GitHub OIDC token request failed."
            cat "$response_file"
            exit 1
          fi
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger due Repair Shop inactivity reminders
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/reminder-response.json"
          http_code="$(curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 45 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Accept: application/json' \
            "$REMINDER_URL")"

          if [ "$http_code" != "200" ]; then
            echo "Reminder endpoint returned HTTP $http_code"
            cat "$response_file"
            exit 1
          fi

          jq '{success, scanned, due, sent, failed}' "$response_file"
