name: Hermes Connect weekly inactivity reminders

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMINDER_TOKEN: ${{ secrets.HERMES_CONNECT_REMINDER_JOB_TOKEN }}
      REMINDER_URL: https://hermeslogisticsus.com/api/internal/reminders/weekly-inactivity
    steps:
      - name: Trigger due Repair Shop inactivity reminders
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REMINDER_TOKEN:-}" ]; then
            echo "HERMES_CONNECT_REMINDER_JOB_TOKEN is not configured; reminder delivery remains safely disabled."
            exit 0
          fi

          response_file="${RUNNER_TEMP}/reminder-response.json"
          http_code="$(curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 45 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${REMINDER_TOKEN}" \
            -H 'Accept: application/json' \
            "$REMINDER_URL")"

          if [ "$http_code" != "200" ]; then
            echo "Reminder endpoint returned HTTP $http_code"
            cat "$response_file"
            exit 1
          fi

          jq '{success, scanned, due, sent, failed}' "$response_file"
