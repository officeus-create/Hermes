name: Hermes AI phone companion (debug preview)
on:
  pull_request:
    paths:
      - 'experiments/android-ai-control/**'
      - '.github/workflows/hermes-ai-android-companion-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Source safety contracts
        run: node experiments/android-ai-control/tests/contract.test.mjs
      - name: Compile debug-signed preview APK
        run: gradle --no-daemon -p experiments/android-ai-control :app:assembleDebug
      - name: Verify APK and checksum
        shell: bash
        run: |
          test -s experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk
          sha256sum experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk > experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk.sha256
          cat experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: APK size hard ceiling and manifest smoke
        shell: bash
        run: |
          apk=experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk
          bytes=$(stat -c%s "$apk")
          echo "Hermes AI launcher size: $bytes bytes (debug)"
          test "$bytes" -le 500000
          # Lightweight companion must not grow into a second browser/runtime.
          if grep -q '<uses-permission' experiments/android-ai-control/app/src/main/AndroidManifest.xml; then exit 1; fi
      # Expensive emulator setup is manual-only; normal PR check builds in minutes.
      # The preceding Android CI run proved adb install and Activity launch; screenshot failed only on /sdcard permissions.
      - name: Install and launch on clean Android emulator
        if: github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            adb install experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n us.hermeslogistics.aicontrol/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep us.hermeslogistics.aicontrol
            adb exec-out screencap -p > experiments/android-ai-control/app/build/outputs/apk/debug/phone-emulator.png
            test -s experiments/android-ai-control/app/build/outputs/apk/debug/phone-emulator.png
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-AI-Control-Android-preview
          path: |
            experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk
            experiments/android-ai-control/app/build/outputs/apk/debug/app-debug.apk.sha256
            experiments/android-ai-control/app/build/outputs/apk/debug/phone-emulator.png
          retention-days: 7
          if-no-files-found: error
# Debug-signed APK for owner testing, never app store or public production.
