name: TEMP Hermes lead email production canary

on:
  push:
    branches:
      - chatgpt/lead-email-production-canary
    paths:
      - .github/workflows/lead-email-production-canary-temp.yml

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run bounded synthetic carrier/dealer proof
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const endpoint = "https://hermeslogisticsus.com/api/logistics-lead";
          const runId = process.env.GITHUB_RUN_ID || ("manual-" + Date.now());
          const submitted = new Date().toISOString();
          const carrierId = "carrier_prod_" + runId;
          const dealerId = "dealer_prod_" + runId;

          const carrier = {
            request_id: carrierId,
            lead_type: "load_board_access",
            sales_tag: "LOAD BOARD ACCESS / CARRIER",
            email_body: [
              "Hermes Load Board — Carrier Sales Lead Preview",
              "Sales tag: LOAD BOARD ACCESS / CARRIER",
              "Contact: Synthetic Carrier QA",
              "Company: Hermes Synthetic Carrier QA",
              "Email: carrier-production-smoke@hermesconnect.app",
              "Phone: +1 (312) 555-0182",
              "Equipment: Car Hauler / Auto Transport",
              "Capacity / unit count: 3",
              "Available from: 2026-11-02",
              "Origin: Milwaukee, WI",
              "Destination: Chicago, IL",
              "SYNTHETIC QA — NOT A CUSTOMER / NOT A PAYMENT / DO NOT PROCESS",
              "Delivery: preview only — no automatic email was sent."
            ].join("\n"),
            page_path: "/logistics/start-car-hauling-dispatch/",
            submitted_at: submitted
          };

          const dealer = {
            request_id: dealerId,
            lead_type: "posted_load",
            sales_tag: "POSTED LOAD / DEALER",
            email_subject: "Ignored visitor-provided subject",
            email_body: [
              "Hermes Load Board — Posted Load Sales Lead Preview",
              "Sales tag: POSTED LOAD / DEALER",
              "Contact: Synthetic Dealer QA",
              "Company: Hermes Synthetic Dealer QA",
              "Email: dealer-production-smoke@hermesconnect.app",
              "Phone: +1 (312) 555-0183",
              "Route: Madison, WI -> Chicago, IL",
              "Vehicle: 2022 Toyota Camry",
              "SYNTHETIC QA — NOT A CUSTOMER / NOT A PAYMENT / DO NOT PROCESS",
              "Delivery: preview only — no automatic email was sent."
            ].join("\n"),
            page_path: "/load-board/",
            submitted_at: submitted
          };

          async function send(label, payload, expectDuplicate) {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: {
                "Origin": "https://hermeslogisticsus.com",
                "Content-Type": "application/json",
                "Idempotency-Key": payload.request_id,
                "User-Agent": "HermesLeadEmailProductionCanary/2026-10-29"
              },
              body: JSON.stringify(payload)
            });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text }; }
            console.log(JSON.stringify({
              label, request_id: payload.request_id, http_status: response.status,
              success: body?.success === true, duplicate: body?.duplicate === true,
              error: body?.error || null
            }));
            if (response.status !== 200 || body?.success !== true) throw new Error(label + ": API acceptance failed");
            if (expectDuplicate && body?.duplicate !== true) throw new Error(label + ": duplicate suppression not proven");
            if (!expectDuplicate && body?.duplicate === true) throw new Error(label + ": first request was unexpectedly duplicate");
          }

          await send("carrier-first", carrier, false);
          await send("carrier-duplicate", carrier, true);
          await send("dealer-first", dealer, false);
          await send("dealer-duplicate", dealer, true);
          console.log("CANARY_REQUEST_IDS carrier=" + carrierId + " dealer=" + dealerId);
          NODE