name: Generate Astro 7.4.1 security lockfile

on:
  push:
    branches:
      - codex/security-astro-7-4-1

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/security-astro-7-4-1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate npm-owned dependency files
        run: npm install astro@7.4.1 --save-exact
      - name: Verify generated dependency state
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies?.astro!=='7.4.1' && p.devDependencies?.astro!=='7.4.1') process.exit(1)"
          npm run build
          node scripts/dependency-audit-report.mjs
      - name: Commit only generated package state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "security(deps): upgrade Astro to 7.4.1"
          git push origin HEAD:codex/security-astro-7-4-1
