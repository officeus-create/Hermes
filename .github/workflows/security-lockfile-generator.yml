name: Security lockfile generator

on:
  pull_request:
    paths:
      - '.github/workflows/security-lockfile-generator.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched lockfile
        run: npm install astro@7.2.8 --save-exact --package-lock-only --ignore-scripts
      - name: Verify install and security audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: Upload exact dependency files
        uses: actions/upload-artifact@v4
        with:
          name: astro-7.2.8-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
