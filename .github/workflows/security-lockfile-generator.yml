name: Security lockfile generator

on:
  pull_request:
    paths:
      - '.github/workflows/security-lockfile-generator.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched lockfile
        run: |
          npm install astro@7.2.8 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Verify install and security audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: Commit exact dependency files and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm .github/workflows/security-lockfile-generator.yml
          git diff --cached --check
          git commit -m "fix(security): upgrade Astro dependency graph"
          git push origin HEAD:${{ github.head_ref }}
