# Approved-main production parity — 2026-09-06
name: Deploy approved main to Cloudflare Pages v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "ai-collaboration/**"
      - "tests/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: read
  checks: read
  deployments: write
  issues: write

concurrency:
  group: cloudflare-pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy, and verify approved main
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out exact approved revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build approved release
        run: npm run build

      - name: Validate static release contracts
        run: npm test

      - name: Verify exact-SHA Cloudflare Git deployment
        id: native_pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          import fs from "node:fs";

          const repo = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const api = process.env.GITHUB_API_URL || "https://api.github.com";
          const token = process.env.GITHUB_TOKEN;
          const output = process.env.GITHUB_OUTPUT;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          if (!repo || !sha || !token || !output) {
            console.error("GitHub runtime context is incomplete; cannot verify native Cloudflare deployment.");
            process.exit(1);
          }

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const response = await fetch(`${api}/repos/${repo}/commits/${sha}/check-runs?per_page=100`, {
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "x-github-api-version": "2022-11-28",
                "user-agent": "HermesPagesReleaseVerifier/4.0",
              },
              signal: AbortSignal.timeout(20_000),
            });

            if (!response.ok) {
              console.error(`Cloudflare check lookup failed with HTTP ${response.status}.`);
              process.exit(1);
            }

            const payload = await response.json();
            const candidates = (payload.check_runs || [])
              .filter((run) => run.name === "Cloudflare Pages" && run.app?.slug === "cloudflare-workers-and-pages")
              .sort((a, b) => Date.parse(a.started_at || 0) - Date.parse(b.started_at || 0));
            const run = candidates.at(-1);

            console.log(`Native Cloudflare attempt ${attempt}: ${run?.status || "missing"} / ${run?.conclusion || "pending"}`);

            if (run?.status === "completed") {
              if (run.conclusion !== "success") {
                console.error(`Native Cloudflare Pages deployment failed for ${sha}: ${run.conclusion || "unknown"}.`);
                process.exit(1);
              }

              fs.appendFileSync(output, "available=true\n");
              fs.appendFileSync(output, `details_url=${run.details_url || run.html_url || ""}\n`);
              console.log(`Verified native Cloudflare Pages deployment for exact SHA ${sha}.`);
              process.exit(0);
            }

            if (attempt < 60) await sleep(10_000);
          }

          console.error(`Timed out waiting for native Cloudflare Pages deployment for exact SHA ${sha}.`);
          process.exit(1);
          NODE

      - name: Verify current main-domain product truth
        run: |
          node <<'NODE'
          const targets = [
            {
              url: "https://hermeslogisticsus.com/paths/academy/",
              markers: [
                "Build practical skills across five Hermes Academy tracks.",
                "U.S. Logistics Operations",
                "Marketing",
                "IT & AI",
                "Sales",
                "COO / Operations",
              ],
              forbiddenMarkers: [
                "2 public programs",
                "Two public programs",
                "currently presents two public program paths",
              ],
            },
            {
              url: "https://hermeslogisticsus.com/services/hermes-connect/",
              markers: ["Run your business with AI.", "Repair Shops"],
            },
            {
              url: "https://hermeslogisticsus.com/services/hermes-connect/repair-shops/",
              markers: ["Founding Shop Plan", "data-launch-state=\"ended\"", "Free repair shop registration ended September 15."],
            },
            {
              url: "https://hermeslogisticsus.com/services/hermes-connect/repair-shops/auth/",
              markers: ["Repair Shop Owner Access", "data-launch-state=\"ended\"", "Free repair shop registration ended September 15."],
              forbiddenMarkers: ["14-day launch offer", "registration stays free until it is"],
            },
            {
              url: "https://hermeslogisticsus.com/",
              markers: ["Hermes Connect", "Open Hermes Connect Product Hub"],
            },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (const target of targets) {
            let ok = false;
            let last = {};
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              try {
                const response = await fetch(`${target.url}?release=${Date.now()}`, {
                  redirect: "follow",
                  headers: {
                    "cache-control": "no-cache",
                    pragma: "no-cache",
                    "user-agent": "HermesPagesReleaseVerifier/4.0",
                  },
                  signal: AbortSignal.timeout(20_000),
                });
                const body = await response.text();
                const missing = target.markers.filter((marker) => !body.includes(marker));
                const forbidden = (target.forbiddenMarkers || []).filter((marker) => body.includes(marker));
                last = { status: response.status, missing, forbidden };
                if (response.status === 200 && missing.length === 0 && forbidden.length === 0) {
                  ok = true;
                  break;
                }
              } catch (error) {
                last = { error: error instanceof Error ? error.message : String(error) };
              }
              if (attempt < 18) await sleep(10_000);
            }

            if (!ok) {
              console.error(`Main-domain verification failed for ${target.url}: ${JSON.stringify(last)}`);
              process.exitCode = 1;
            } else {
              console.log(`Verified approved release at ${target.url}`);
            }
          }
          NODE

      - name: Verify Connect custom subdomain
        env:
          CONNECT_EXPECTATION: approved_web_app
          CONNECT_CHECK_ATTEMPTS: "18"
          CONNECT_CHECK_DELAY_MS: "10000"
        run: node scripts/check-connect-subdomain.mjs

      - name: Report successful production release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_DEPLOYMENT_DETAILS: ${{ steps.native_pages.outputs.details_url }}
        run: |
          deployment_path="Cloudflare Git integration exact-SHA deploy"
          deployment_evidence="${NATIVE_DEPLOYMENT_DETAILS:-check verified}"
          gh issue comment 961 --repo "$GITHUB_REPOSITORY" --body "## Approved main is live and read back\n\nApproved \`main\` was built and tested. Production was released through the ${deployment_path}, then the five-track Academy contract, Hermes Connect, Repair Shop commercial markers, main-domain product truth, and the Connect custom domain were read back successfully.\n\nDeployment evidence: ${deployment_evidence}."

      - name: Report deployment or verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 961 --repo "$GITHUB_REPOSITORY" --body "## Approved-main production parity did not complete\n\nThe release workflow could not prove the native Cloudflare exact-SHA Pages deployment or one of the build, static-contract, production read-back, Academy WEB10, or Connect-subdomain checks failed. Review the sanitized Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."

      - name: Publish sanitized summary
        if: always()
        env:
          NATIVE_DEPLOYMENT_DETAILS: ${{ steps.native_pages.outputs.details_url }}
        run: |
          {
            echo "# Cloudflare Pages approved-main production parity"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Environment: \`production\`"
            echo "- Project: \`hermes\`"
            echo "- Branch: \`main\`"
            echo "- Build output: \`dist\`"
            echo "- Release owner: Cloudflare Git integration exact-SHA deploy"
            echo "- Deployment evidence: ${NATIVE_DEPLOYMENT_DETAILS:-not returned}"
            echo "- WEB10 Academy production contract: five public learning tracks required; retired two-program copy forbidden"
            echo
            echo "> No token, account ID, binding ID, recipient, or secret value is written to this summary."
          } >> "$GITHUB_STEP_SUMMARY"
