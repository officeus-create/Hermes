# Approved-main production parity — 2026-09-01
name: Deploy approved main to Cloudflare Pages v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write
  issues: write

concurrency:
  group: cloudflare-pages-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, deploy, and verify approved main
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}

    steps:
      - name: Check out current approved main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate and mask Cloudflare deployment credentials
        id: credentials
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          fi

          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing="scoped Cloudflare API token"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -n "$missing" ]; then missing="$missing, "; fi
            missing="${missing}Cloudflare account identifier"
          fi
          if [ -n "$missing" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "Missing required deployment credentials: $missing" >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Report credential blocker
        if: failure() && steps.credentials.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.credentials.outputs.missing }}
        run: |
          gh issue comment 961 --repo "$GITHUB_REPOSITORY" --body "## Pages production deploy blocked\n\nThe controlled release checked repository secrets, GitHub Environment \`production\` secrets, and the approved aliases, but required Cloudflare deployment credentials are unavailable: \`${MISSING:-Cloudflare credentials}\`.\n\nNo credential value was printed. Preferred names are \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\`. The token needs Cloudflare Pages edit access for project \`hermes\`. Production parity remains unverified until the workflow completes."

      - name: Install dependencies
        run: npm ci

      - name: Build approved release
        run: npm run build

      - name: Validate static release contracts
        run: npm test

      - name: Deploy dist to Cloudflare Pages project hermes
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=hermes --branch=main --commit-hash=${{ github.sha }} --commit-message="Approved main ${{ github.sha }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify current main-domain product truth
        run: |
          node <<'NODE'
          const targets = [
            {
              url: "https://hermeslogisticsus.com/services/hermes-connect/",
              markers: ["Run your business with AI.", "Repair Shops"],
            },
            {
              url: "https://hermeslogisticsus.com/services/hermes-connect/repair-shops/",
              markers: ["Founding Shop Plan", "Free repair shop registration through September 15."],
            },
            {
              url: "https://hermeslogisticsus.com/services/hermes-connect/repair-shops/auth/",
              markers: ["Repair Shop Owner Access", "Free repair shop registration through September 15."],
              forbiddenMarkers: ["14-day launch offer", "registration stays free until it is"],
            },
            {
              url: "https://hermeslogisticsus.com/",
              markers: ["Hermes Connect", "Open Hermes Connect Product Hub"],
            },
          ];
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          for (const target of targets) {
            let ok = false;
            let last = {};
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              try {
                const response = await fetch(`${target.url}?release=${Date.now()}`, {
                  redirect: "follow",
                  headers: {
                    "cache-control": "no-cache",
                    pragma: "no-cache",
                    "user-agent": "HermesPagesReleaseVerifier/3.0",
                  },
                  signal: AbortSignal.timeout(20_000),
                });
                const body = await response.text();
                const missing = target.markers.filter((marker) => !body.includes(marker));
                const forbidden = (target.forbiddenMarkers || []).filter((marker) => body.includes(marker));
                last = {
                  status: response.status,
                  title: body.match(/<title>([^<]*)<\/title>/i)?.[1]?.trim() ?? null,
                  missing,
                  forbidden,
                };
                if (response.status === 200 && missing.length === 0 && forbidden.length === 0) {
                  ok = true;
                  break;
                }
              } catch (error) {
                last = { error: error instanceof Error ? error.message : String(error) };
              }
              if (attempt < 18) await sleep(10_000);
            }
            if (!ok) {
              console.error(`Main-domain verification failed for ${target.url}: ${JSON.stringify(last)}`);
              process.exitCode = 1;
            } else {
              console.log(`Verified approved release at ${target.url}`);
            }
          }
          NODE

      - name: Verify Connect custom subdomain
        env:
          CONNECT_EXPECTATION: approved_web_app
          CONNECT_CHECK_ATTEMPTS: "18"
          CONNECT_CHECK_DELAY_MS: "10000"
        run: node scripts/check-connect-subdomain.mjs

      - name: Report successful production release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          gh issue comment 961 --repo "$GITHUB_REPOSITORY" --body "## Approved main is live and read back\n\nApproved \`main\` was built, tested, deployed to Cloudflare Pages project \`hermes\`, and current Hermes Connect + Repair Shop commercial markers were read back from production. The auth surface no longer exposes the superseded 14-day launch policy. \`connect.hermeslogisticsus.com\` also passed the existing custom-domain verifier.\n\nDeployment URL returned by Wrangler: ${DEPLOYMENT_URL:-not returned}."

      - name: Report deployment or verification failure
        if: failure() && steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 961 --repo "$GITHUB_REPOSITORY" --body "## Approved-main production parity did not complete\n\nCloudflare credentials were available, but build, tests, upload, current-product read-back, or Connect-subdomain verification failed. Review the sanitized Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No secret value is included here."

      - name: Publish sanitized summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "# Cloudflare Pages approved-main production parity"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Environment: \`production\`"
            echo "- Project: \`hermes\`"
            echo "- Branch: \`main\`"
            echo "- Build output: \`dist\`"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not returned}"
            echo "- Alias URL: ${DEPLOYMENT_ALIAS:-not returned}"
            echo
            echo "> No token, account ID, binding ID, recipient, or secret value is written to this summary."
          } >> "$GITHUB_STEP_SUMMARY"
