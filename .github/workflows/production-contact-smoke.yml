name: Production contact smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-contact-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-contact-smoke
  cancel-in-progress: false

jobs:
  verify-production-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for current production HTML
        id: production_html
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          expected_footer='Website inquiries are delivered securely by email'
          expected_contact='Send your request securely to the Hermes team.'
          live=0

          for attempt in $(seq 1 18); do
            url="https://hermeslogisticsus.com/?production-smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            html="$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "$url")"

            if grep -Fq "$expected_footer" <<<"$html" && grep -Fq "$expected_contact" <<<"$html"; then
              echo "Current production HTML is live on attempt $attempt."
              live=1
              break
            fi

            echo "Production still serves the previous snapshot on attempt $attempt."
            sleep 10
          done

          if [[ "$live" != "1" ]]; then
            echo "Current main was not observed on the custom domain within the release window." >&2
            exit 1
          fi

      - name: Send one synthetic production inquiry
        id: first_send
        if: steps.production_html.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: prod_smoke_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          payload="$(node -e '
            const payload = {
              request_id: process.env.REQUEST_ID,
              submitted_at: new Date().toISOString(),
              source_path: "/contacts/",
              name: "Hermes Production Smoke Test",
              email: "officeus@hermeslogisticsus.com",
              interest: "I am not sure yet",
              message: "Automated synthetic production verification. No customer or operational data is included.",
              consent: true
            };
            process.stdout.write(JSON.stringify(payload));
          ')"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST 'https://hermeslogisticsus.com/api/logistics-lead' \
            --header 'Origin: https://hermeslogisticsus.com' \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: ${REQUEST_ID}" \
            --data "$payload")"

          RESPONSE="$response" node -e '
            const body = JSON.parse(process.env.RESPONSE);
            if (body.success !== true || body.request_id !== process.env.REQUEST_ID || body.duplicate === true) {
              throw new Error(`Unexpected first-send response: ${JSON.stringify(body)}`);
            }
            console.log("Synthetic production inquiry accepted.");
          '

      - name: Confirm duplicate suppression
        id: duplicate
        if: steps.first_send.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          REQUEST_ID: prod_smoke_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          payload="$(node -e '
            const payload = {
              request_id: process.env.REQUEST_ID,
              submitted_at: new Date().toISOString(),
              source_path: "/contacts/",
              name: "Hermes Production Smoke Test",
              email: "officeus@hermeslogisticsus.com",
              interest: "I am not sure yet",
              message: "Automated synthetic production verification. No customer or operational data is included.",
              consent: true
            };
            process.stdout.write(JSON.stringify(payload));
          ')"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST 'https://hermeslogisticsus.com/api/logistics-lead' \
            --header 'Origin: https://hermeslogisticsus.com' \
            --header 'Content-Type: application/json' \
            --header "Idempotency-Key: ${REQUEST_ID}" \
            --data "$payload")"

          RESPONSE="$response" node -e '
            const body = JSON.parse(process.env.RESPONSE);
            if (body.success !== true || body.request_id !== process.env.REQUEST_ID || body.duplicate !== true) {
              throw new Error(`Unexpected duplicate response: ${JSON.stringify(body)}`);
            }
            console.log("Duplicate suppression confirmed without a second delivery.");
          '

      - name: Report production result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HTML_OUTCOME: ${{ steps.production_html.outcome }}
          SEND_OUTCOME: ${{ steps.first_send.outcome }}
          DUPLICATE_OUTCOME: ${{ steps.duplicate.outcome }}
        run: |
          set -euo pipefail
          if [[ "$HTML_OUTCOME" == "success" && "$SEND_OUTCOME" == "success" && "$DUPLICATE_OUTCOME" == "success" ]]; then
            overall="PASS"
            summary="Current production HTML, one synthetic inquiry, and duplicate suppression were verified externally."
          else
            overall="FAIL"
            summary="Production reconciliation is incomplete. Inspect the per-step outcomes below before calling the frontend live."
          fi

          cat > /tmp/production-smoke.md <<EOF
          ## Production contact smoke — ${overall}

          ${summary}

          - merge commit: \`${GITHUB_SHA}\`
          - production HTML: \`${HTML_OUTCOME}\`
          - first synthetic inquiry: \`${SEND_OUTCOME}\`
          - duplicate suppression: \`${DUPLICATE_OUTCOME}\`
          - workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          No customer data, Cloudflare secret, account ID, KV ID, or provider diagnostic is included in this report.
          EOF

          gh issue comment 167 --repo "$GITHUB_REPOSITORY" --body-file /tmp/production-smoke.md

      - name: Enforce production verification
        if: always()
        shell: bash
        env:
          HTML_OUTCOME: ${{ steps.production_html.outcome }}
          SEND_OUTCOME: ${{ steps.first_send.outcome }}
          DUPLICATE_OUTCOME: ${{ steps.duplicate.outcome }}
        run: |
          if [[ "$HTML_OUTCOME" != "success" || "$SEND_OUTCOME" != "success" || "$DUPLICATE_OUTCOME" != "success" ]]; then
            exit 1
          fi
