name: Hermes Automation Engine Contract

on:
  pull_request:
    paths:
      - "workers/automation-engine/**"
      - "scripts/automation-engine-contract.test.mjs"
      - "scripts/automation-engine-historical-learning.test.mjs"
      - "scripts/automation-engine-role-contracts.test.mjs"
      - "scripts/automation-engine-free-ai-runtime.test.mjs"
      - "scripts/automation-engine-work-portfolio.test.mjs"
      - "workers/automation-engine/src/work-portfolio.mjs"
      - "scripts/automation-engine-zero-token-plugin-tasks.test.mjs"
      - "scripts/automation-engine-self-improvement.test.mjs"
      - "scripts/automation-engine-self-release-gate.test.mjs"
      - "workers/automation-engine/src/zero-token-plugin-tasks.mjs"
      - "workers/automation-engine/src/hae-self-release-gate.mjs"
      - "workers/automation-engine/src/hae-self-improvement.mjs"
      - "workers/automation-engine/src/plugin-runtime-registry.mjs"
      - "workers/automation-engine/src/schedule-migrations.mjs"
      - "scripts/automation-engine-dlq-runtime.test.mjs"
      - "scripts/automation-engine-ai-usage-ledger.test.mjs"
      - "scripts/automation-engine-capability-graph.test.mjs"
      - "scripts/hae-d1-schema-snapshot*.mjs"
      - "scripts/hae-migration-baseline-candidate*.mjs"
      - "scripts/hae-t4-*.mjs"
      - "scripts/hae-issue-comment-command-router.test.mjs"
      - "docs/HERMES_AUTOMATION_ENGINE_*.md"
      - ".github/workflows/automation-engine-contract.yml"
      - ".github/workflows/automation-engine-release.yml"
      - ".github/workflows/hae-migration-baseline-candidate.yml"
      - ".github/workflows/issue-comment-command-router.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run automation engine contract
        run: |
          node scripts/automation-engine-contract.test.mjs
          node scripts/automation-engine-historical-learning.test.mjs
          node scripts/automation-engine-role-contracts.test.mjs
          node scripts/automation-engine-free-ai-runtime.test.mjs
          node scripts/automation-engine-work-portfolio.test.mjs
          node scripts/automation-engine-zero-token-plugin-tasks.test.mjs
          node scripts/automation-engine-self-improvement.test.mjs
          node scripts/automation-engine-self-release-gate.test.mjs
          node scripts/automation-engine-capability-policy.test.mjs
          node scripts/automation-engine-state-freshness.test.mjs
          node scripts/automation-engine-dlq-policy.test.mjs
          node scripts/automation-engine-dlq-runtime.test.mjs
          node scripts/automation-engine-ai-usage-ledger.test.mjs
          node scripts/automation-engine-capability-graph.test.mjs
          node scripts/automation-engine-incident-policy.test.mjs
          node scripts/automation-engine-reconciliation-policy.test.mjs
          node scripts/automation-engine-migration-gate.test.mjs
          node scripts/automation-engine-data-policy.test.mjs
          node scripts/hae-d1-schema-snapshot.test.mjs
          node scripts/hae-migration-baseline-candidate.test.mjs
          node scripts/hae-t4-dlq-canary.test.mjs
          node scripts/hae-t4-readonly-d1-diagnostic.test.mjs
          node scripts/hae-issue-comment-command-router.test.mjs
