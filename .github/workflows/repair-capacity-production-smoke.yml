name: Repair Shop capacity production smoke

on:
  push:
    branches: [main]
    paths:
      - functions/api/_lib/repair-shop-bookings-schema.mjs
      - functions/api/_lib/repair-shop-capabilities-schema.mjs
      - functions/api/_lib/repair-shop-capacity.mjs
      - functions/api/public/repair-booking.ts
      - functions/api/_lib/github-actions-oidc.mjs
      - functions/api/_lib/turnstile.mjs
      - scripts/lib/github-actions-oidc.sh
      - scripts/lib/repair-capacity-prerequisite.sh
      - functions/api/repair-shop/capabilities.ts
      - functions/api/repair-shop/capacity.ts
      - functions/api/repair-shop/cleanup-booking-smoke.ts
      - public/repair-shop-capabilities.js
      - public/repair-shop-capacity.js
      - scripts/repair-capacity-production-smoke.sh
      - .github/workflows/repair-capacity-production-smoke.yml
  # Manual dispatch is a recovery path only and must still target approved main.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  checks: read

concurrency:
  group: repair-shop-capacity-production
  cancel-in-progress: false

jobs:
  approved_main_guard:
    name: Reject non-main production refs
    runs-on: ubuntu-latest
    steps:
      - name: Require the approved main ref
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Capacity smoke rejected: ${RELEASE_EVENT} may run only from refs/heads/main, not ${RELEASE_REF}." >&2
            exit 1
          fi
          echo "Approved main ref accepted for ${RELEASE_EVENT}."

  smoke:
    name: Verify production parallel booking capacity
    needs: approved_main_guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v4

      - name: Wait for baseline booking smoke and verify capacity concurrency
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/repair-capacity-production-smoke.sh
