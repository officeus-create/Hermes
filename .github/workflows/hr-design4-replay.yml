name: HR Design 4 replay

on:
  pull_request:
    paths:
      - 'functions/api/_lib/hr.mjs'
      - 'functions/api/hr/**'
      - 'functions/api/hermes-connect/account.ts'
      - 'public/demos/hermes-connect/hr*'
      - 'scripts/hermes-connect-hr*.test.mjs'
      - 'tests/hermes-connect-hr-design4.spec.ts'
      - '.github/workflows/hr-design4-replay.yml'

permissions:
  contents: read

jobs:
  candidate-replay:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify HR Design and SEO boundary
        run: node scripts/hermes-connect-hr-design4-replay.test.mjs

      - name: Verify HR backend behavior
        run: node scripts/hermes-connect-hr-api-integration.test.mjs

      - name: Build website
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify RU/UK five-width candidate shell
        run: npx playwright test tests/hermes-connect-hr-design4.spec.ts --project=desktop
