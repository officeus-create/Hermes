name: Repair Company localization one-shot

on:
  push:
    branches:
      - fix/repair-company-localization-parity-20260908
    paths:
      - .github/workflows/repair-company-localization-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/repair-company-localization-parity-20260908
      - name: Apply Company localization patch
        run: node scripts/repair-company-localization-one-shot.mjs
      - name: Remove one-shot patch files
        run: git rm .github/workflows/repair-company-localization-one-shot.yml scripts/repair-company-localization-one-shot.mjs
      - name: Commit localization patch
        run: |
          git config user.name "officeus-create"
          git config user.email "officeus@hermeslogisticsus.com"
          git add src/pages/services/hermes-connect/repair-shops/settings.astro tests/repair-shop-settings.spec.ts
          git commit -m "fix(repair): complete Company localization parity"
          git push origin HEAD:fix/repair-company-localization-parity-20260908
