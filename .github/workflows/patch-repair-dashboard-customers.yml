name: One-time Repair Shop Customers navigation patch

on:
  push:
    branches: [feature/repair-shop-customer-crm]
    paths:
      - .github/workflows/patch-repair-dashboard-customers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/repair-shop-customer-crm
      - name: Add Customers navigation to owner workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/services/hermes-connect/repair-shops/dashboard.astro')
          text = path.read_text()
          old_import = 'import { ArrowLeft, CalendarClock, Copy, ExternalLink, LogOut, Plus } from "@lucide/astro";'
          new_import = 'import { ArrowLeft, CalendarClock, Copy, ExternalLink, LogOut, Plus, Users } from "@lucide/astro";'
          old_header = '        <button id="logout-btn" class="secondary-btn" type="button"><LogOut size={16} /> Logout</button>'
          new_header = '        <div class="workspace-actions"><a class="secondary-btn" href="/services/hermes-connect/repair-shops/customers/"><Users size={16} /> Customers</a><button id="logout-btn" class="secondary-btn" type="button"><LogOut size={16} /> Logout</button></div>'
          old_css = '.workspace-header{margin-bottom:28px}'
          new_css = '.workspace-header{margin-bottom:28px}.workspace-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}'
          old_mobile = '.workspace-header .secondary-btn,.availability-panel .primary-btn{margin-top:14px}'
          new_mobile = '.workspace-actions{margin-top:14px}.workspace-actions .secondary-btn{margin-top:0}.availability-panel .primary-btn{margin-top:14px}'
          for old, new, label in [(old_import,new_import,'import'),(old_header,new_header,'header'),(old_css,new_css,'css'),(old_mobile,new_mobile,'mobile')]:
              if old not in text:
                  raise SystemExit(f'expected {label} anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/pages/services/hermes-connect/repair-shops/dashboard.astro
      - name: Commit owner navigation
        shell: bash
        run: |
          git config user.name "Hermes Release Bot"
          git config user.email "officeus@hermeslogisticsus.com"
          git add src/pages/services/hermes-connect/repair-shops/dashboard.astro
          git commit -m "feat(connect): link Customers from Repair Shop workspace"
          git push origin HEAD:feature/repair-shop-customer-crm
