name: Apply technology CSS route split

on:
  push:
    branches:
      - seo12/technology-global-css-route-split

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: seo12/technology-global-css-route-split

      - name: Apply bounded CSS move
        run: node scripts/apply-technology-css-route-split.mjs

      - name: Verify and remove temporary helpers
        run: |
          rm scripts/apply-technology-css-route-split.mjs
          rm .github/workflows/technology-css-route-split-apply.yml
          git diff --check
          git diff -- src/styles/global.css src/styles/features/technology.css

      - name: Commit bounded CSS move
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SEO12: move Technology-only CSS out of global bundle'
          git push origin HEAD:seo12/technology-global-css-route-split
