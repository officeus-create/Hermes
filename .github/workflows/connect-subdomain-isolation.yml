name: Hermes Connect deployment verification

on:
  workflow_dispatch:
    inputs:
      expectation:
        description: Verification mode
        required: true
        default: release
        type: choice
        options:
          - release
          - isolation
  pull_request:
    paths:
      - public/demos/hermes-connect/**
      - functions/api/connect-lead.ts
      - scripts/connect-deployment-state.mjs
      - scripts/check-connect-subdomain.mjs
      - .github/workflows/connect-subdomain-isolation.yml
      - src/pages/services/hermes-connect/**
      - src/components/HomeTechnologyPreview.astro
      - src/components/TechnologyInteractivePrototypes.astro
      - public/sitemap-digital-services.xml
  push:
    branches:
      - main
    paths:
      - public/demos/hermes-connect/**
      - functions/api/connect-lead.ts
      - scripts/connect-deployment-state.mjs
      - scripts/check-connect-subdomain.mjs
      - .github/workflows/connect-subdomain-isolation.yml
      - src/pages/services/hermes-connect/**
      - src/components/HomeTechnologyPreview.astro
      - src/components/TechnologyInteractivePrototypes.astro
      - public/sitemap-digital-services.xml

permissions:
  contents: read

concurrency:
  group: connect-deployment-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Read-only Connect deployment verification
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Select verification expectation
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CONNECT_EXPECTATION=isolation" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.expectation }}" = "isolation" ]; then
            echo "CONNECT_EXPECTATION=isolation" >> "$GITHUB_ENV"
          else
            echo "CONNECT_EXPECTATION=release" >> "$GITHUB_ENV"
          fi

      - name: Observe Connect and the indexed Hermes overview
        run: node scripts/check-connect-subdomain.mjs

      - name: Publish sanitized summary
        if: always()
        run: |
          if [ -f artifacts/connect-subdomain-isolation.md ]; then
            cat artifacts/connect-subdomain-isolation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Connect deployment report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-deployment-verification
          path: |
            artifacts/connect-subdomain-isolation.json
            artifacts/connect-subdomain-isolation.md
          if-no-files-found: error
          retention-days: 30
