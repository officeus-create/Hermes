name: Hermes Connect subdomain isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - public/demos/hermes-connect/**
      - functions/api/connect-lead.ts
      - scripts/check-connect-subdomain.mjs
      - .github/workflows/connect-subdomain-isolation.yml

permissions:
  contents: read

concurrency:
  group: connect-subdomain-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Read-only Connect custom-domain isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Observe public Connect subdomain
        run: node scripts/check-connect-subdomain.mjs

      - name: Publish sanitized summary
        if: always()
        run: |
          if [ -f artifacts/connect-subdomain-isolation.md ]; then
            cat artifacts/connect-subdomain-isolation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Connect subdomain isolation report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-subdomain-isolation
          path: |
            artifacts/connect-subdomain-isolation.json
            artifacts/connect-subdomain-isolation.md
          if-no-files-found: error
          retention-days: 30
