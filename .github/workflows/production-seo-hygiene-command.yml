name: Verify production SEO hygiene on command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: production-seo-hygiene-command
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.issue.number == 346 &&
      github.event.comment.body == '/verify-production-seo' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out approved main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Run production SEO hygiene verifier
        id: verify
        shell: bash
        run: |
          set +e
          node scripts/check-production-seo-hygiene.mjs
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish sanitized result to SEO 11 master issue
        shell: bash
        run: |
          {
            echo "## Production SEO hygiene verification"
            echo
            if [ -f artifacts/production-seo-hygiene-check.md ]; then
              cat artifacts/production-seo-hygiene-check.md
            else
              echo "The verifier did not produce its sanitized report."
            fi
            echo
            echo "Verifier exit code: \`${{ steps.verify.outputs.status }}\`."
            echo "Checked approved \`main\` commit: \`${{ github.sha }}\`."
          } > /tmp/production-seo-hygiene-comment.md
          gh issue comment 346 --repo "${{ github.repository }}" --body-file /tmp/production-seo-hygiene-comment.md

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-seo-hygiene-verification
          path: |
            artifacts/production-custom-domain-check.json
            artifacts/production-custom-domain-check.md
            artifacts/production-seo-hygiene-check.json
            artifacts/production-seo-hygiene-check.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce production SEO hygiene
        shell: bash
        run: test "${{ steps.verify.outputs.status }}" = "0"
