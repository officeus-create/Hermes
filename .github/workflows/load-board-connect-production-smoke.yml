name: Verify Load Board to Connect handoff production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/load-board-connect-production-smoke.yml

permissions:
  contents: read

concurrency:
  group: load-board-connect-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Load Board canonical and Connect handoff
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify production after Cloudflare propagation
        run: |
          node <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const pageUrl = "https://hermeslogisticsus.com/load-board/";
          const analyzerUrl = "https://connect.hermeslogisticsus.com/load-analyzer/";
          let last = {};

          for (let attempt = 1; attempt <= 18; attempt += 1) {
            try {
              const response = await fetch(`${pageUrl}?release=${Date.now()}`, {
                redirect: "follow",
                headers: {
                  "cache-control": "no-cache",
                  pragma: "no-cache",
                  "user-agent": "HermesLoadBoardReleaseVerifier/1.0",
                },
                signal: AbortSignal.timeout(20_000),
              });
              const html = await response.text();
              const canonical = /<link[^>]+rel=["']canonical["'][^>]+href=["']https:\/\/hermeslogisticsus\.com\/load-board\/["']/i.test(html)
                || /<link[^>]+href=["']https:\/\/hermeslogisticsus\.com\/load-board\/["'][^>]+rel=["']canonical["']/i.test(html);
              const handoff = html.includes(`href="${analyzerUrl}"`) || html.includes(`href='${analyzerUrl}'`);
              const cleanHandoff = handoff && !html.includes(`${analyzerUrl}?`);
              const demoBoundary = /fictional demo/i.test(html) && !/live freight available now/i.test(html);
              last = { attempt, status: response.status, canonical, handoff, cleanHandoff, demoBoundary };

              if (response.status === 200 && canonical && handoff && cleanHandoff && demoBoundary) {
                console.log(JSON.stringify({ ok: true, ...last }, null, 2));
                process.exit(0);
              }
            } catch (error) {
              last = { attempt, error: error instanceof Error ? error.message : String(error) };
            }
            if (attempt < 18) await sleep(10_000);
          }

          console.error(JSON.stringify({ ok: false, ...last }, null, 2));
          process.exit(1);
          NODE
