name: Repair Company localization replay one-shot

on:
  push:
    branches:
      - fix/repair-company-localization-replay-current-main-20260909
    paths:
      - .github/workflows/repair-company-localization-replay-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/repair-company-localization-replay-current-main-20260909
      - name: Prepare modern settings for bounded historical replay
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/pages/services/hermes-connect/repair-shops/settings.astro';
          let source = fs.readFileSync(path, 'utf8');
          const modern = '${member.active?t.activeStatus:t.inactiveStatus}';
          const historical = '${member.active?"Active":"Inactive"}';
          if (source.includes(modern)) source = source.replace(modern, historical);
          fs.writeFileSync(path, source);
          NODE
      - name: Apply full Company localization dictionaries
        run: node scripts/repair-company-localization-one-shot.mjs
      - name: Remove one-shot patch files
        run: git rm .github/workflows/repair-company-localization-replay-one-shot.yml scripts/repair-company-localization-one-shot.mjs
      - name: Commit bounded localization replay
        run: |
          git config user.name "officeus-create"
          git config user.email "officeus@hermeslogisticsus.com"
          git add src/pages/services/hermes-connect/repair-shops/settings.astro tests/repair-shop-settings.spec.ts
          git commit -m "fix(repair): replay full Company localization on current main"
          git push origin HEAD:fix/repair-company-localization-replay-current-main-20260909
