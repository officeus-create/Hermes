name: Carrier Contract Email Worker Release

on:
  push:
    branches: [carrier-contract-email-delivery-fix-2026-08-14]
    paths:
      - "workers/lead-email/**"
      - "scripts/lead-email-contract-delivery.test.mjs"
      - ".github/workflows/carrier-contract-email-worker-release.yml"

permissions:
  contents: read

environment: production

jobs:
  release-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify contract delivery semantics locally
        run: node scripts/lead-email-contract-delivery.test.mjs
      - name: Validate Cloudflare credentials without printing them
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID" >&2; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy private hermes-lead-email worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: workers/lead-email
          command: deploy --config wrangler.production.jsonc --keep-vars
      - name: Verify production signing reaches the main Hermes mailbox binding
        run: |
          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const base = 'https://hermeslogisticsus.com';
          (async () => {
            await sleep(5000);
            const requestId = `contract_prod_mail_${Date.now()}`;
            const signature = Buffer.alloc(900, 29).toString('base64');
            const payload = {
              request_id: requestId,
              selected_plan: 'pro',
              service_percentage: '8',
              custom_scope: '',
              legal_company_name: 'TEST HERMES MAIL DELIVERY NOT A REAL CARRIER',
              dba_name: 'TEST ONLY',
              mc_number: '0000001',
              usdot_number: '',
              company_website: 'https://hermeslogisticsus.com',
              signer_name: 'Hermes Mail Verification',
              signer_title: 'Internal Synthetic Test',
              signer_email: 'officeus@hermeslogisticsus.com',
              signer_phone: '+1 262 302 3626',
              sales_contact: 'INTERNAL-MAIL-SMOKE',
              offer_code: 'TEST-ONLY',
              typed_signature: 'Hermes Mail Verification',
              signature_jpeg: `data:image/jpeg;base64,${signature}`,
              signature_width: 600,
              signature_height: 180,
              consent_electronic_records: true,
              consent_authority: true,
              consent_document_review: true,
              consent_selected_scope: true,
              submitted_at: new Date().toISOString(),
            };
            const response = await fetch(base + '/api/carrier-contract', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Origin': base,
                'Idempotency-Key': requestId,
                'User-Agent': 'Hermes contract mail production verification',
              },
              body: JSON.stringify(payload),
            });
            const mode = response.headers.get('x-hermes-document-mode');
            const delivery = response.headers.get('x-hermes-delivery');
            console.log('status', response.status, 'mode', mode, 'delivery', delivery, 'request', requestId);
            if (response.status !== 200 || mode !== 'live' || delivery !== 'delivered') {
              const text = await response.text();
              throw new Error(`Production mail verification failed: status=${response.status} mode=${mode} delivery=${delivery} ${text.slice(0,200)}`);
            }
            console.log('PRODUCTION_CONTRACT_MAIN_MAILBOX=DELIVERED');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
