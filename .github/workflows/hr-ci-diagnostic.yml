name: HR CI diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-npm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Find first failing npm test command
        id: diagnostic
        continue-on-error: true
        run: node scripts/ci-test-diagnostic.mjs

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hr-ci-diagnostic
          path: hr-ci-diagnostic.json
          if-no-files-found: error
          retention-days: 1
