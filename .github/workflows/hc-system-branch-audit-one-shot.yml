name: Hermes Connect full branch inventory one-shot

on:
  push:
    branches:
      - audit/hc-system-20260908
    paths:
      - .github/workflows/hc-system-branch-audit-one-shot.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/hc-system-20260908
          fetch-depth: 0
      - name: Fetch every remote branch
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
      - name: Generate forensic Hermes Connect branch inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/hc-system-branch-audit.mjs
      - name: Remove one-shot audit helpers
        run: rm .github/workflows/hc-system-branch-audit-one-shot.yml scripts/hc-system-branch-audit.mjs
      - name: Commit inventory report only
        run: |
          git config user.name "officeus-create"
          git config user.email "officeus@hermeslogisticsus.com"
          git add docs/hermes-connect-system-branch-inventory-2026-09-08.md .github/workflows/hc-system-branch-audit-one-shot.yml scripts/hc-system-branch-audit.mjs
          git diff --cached --exit-code && { echo "Audit produced no report"; exit 1; } || true
          git commit -m "docs(hc): inventory all Hermes Connect branch lineages"
          git push origin HEAD:audit/hc-system-20260908
