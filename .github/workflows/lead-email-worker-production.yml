name: Deploy Hermes lead email Worker

on:
  push:
    branches:
      - main
    paths:
      - workers/lead-email/**
      - .github/workflows/lead-email-worker-production.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-lead-email-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hermes-lead-email
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}

    steps:
      - name: Check out approved main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate account email contract
        run: node scripts/repair-shop-password-recovery-contract.test.mjs

      - name: Validate Load Board inbound email bridge
        run: node scripts/load-board-intake-api-contract.test.mjs

      - name: Dry-run hermes-lead-email package
        run: npx --yes wrangler@4 deploy --dry-run --config workers/lead-email/wrangler.production.jsonc --outdir /tmp/hermes-lead-email-dry-run

      - name: Validate Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare API token required for hermes-lead-email deployment." >&2
            exit 1
          fi
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Deploy only hermes-lead-email
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config workers/lead-email/wrangler.production.jsonc --keep-vars
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release summary
        if: success()
        run: |
          {
            echo "# Hermes lead email Worker"
            echo
            echo "- Worker: \`hermes-lead-email\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Config: \`workers/lead-email/wrangler.production.jsonc\`"
            echo "- Outbound account route: \`/v1/send-account\`"
            echo "- Inbound Load Board target: \`loads@hermeslogisticsus.com\`"
            echo "- Inbound activation still requires the approved Cloudflare Email Routing rule and runtime source/token configuration."
          } >> "$GITHUB_STEP_SUMMARY"
