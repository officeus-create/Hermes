name: Hermes Catalog monthly SEO GEO reports

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  send-due-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REPORT_URL: https://hermeslogisticsus.com/api/internal/catalog/monthly-seo-reports
      OIDC_AUDIENCE: hermes-catalog-monthly-seo-reports
    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/oidc-response.json"
          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" \
            -o "$response_file"
          token="$(jq -r '.value // empty' "$response_file")"
          if [ -z "$token" ]; then
            echo "GitHub OIDC token request failed."
            cat "$response_file"
            exit 1
          fi
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger due Catalog reports
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/catalog-report-response.json"
          http_code="$(curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Accept: application/json' \
            "$REPORT_URL")"
          if [ "$http_code" != "200" ]; then
            echo "Catalog report endpoint returned HTTP $http_code"
            cat "$response_file"
            exit 1
          fi

          jq '{success, due, sent, failed, next_check}' "$response_file"
          failed="$(jq -r '.failed // 0' "$response_file")"
          if [ "$failed" != "0" ]; then
            echo "One or more Catalog reports failed to send."
            exit 1
          fi
