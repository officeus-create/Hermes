name: CSS ownership diagnostic

on:
  push:
    branches:
      - seo12/technology-global-css-ownership-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Report route CSS ownership
        run: node scripts/route-css-coverage.test.mjs
