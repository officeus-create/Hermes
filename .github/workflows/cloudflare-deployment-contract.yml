name: Cloudflare deployment ownership contract

on:
  pull_request:
    paths:
      - wrangler.jsonc
      - wrangler.toml
      - wrangler.jsonc.example
      - wrangler.toml.example
      - workers/lead-email/**
      - scripts/cloudflare-deployment-contract.test.mjs
      - .github/workflows/**
      - docs/CLOUDFLARE_DEPLOYMENT_OWNERSHIP.md
  push:
    branches:
      - main
    paths:
      - wrangler.jsonc
      - wrangler.toml
      - wrangler.jsonc.example
      - wrangler.toml.example
      - workers/lead-email/**
      - scripts/cloudflare-deployment-contract.test.mjs
      - .github/workflows/**
      - docs/CLOUDFLARE_DEPLOYMENT_OWNERSHIP.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Prevent duplicate repository-controlled Worker deployments
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Verify deployment ownership boundary
        run: node scripts/cloudflare-deployment-contract.test.mjs
