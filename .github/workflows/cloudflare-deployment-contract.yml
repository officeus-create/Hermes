name: Cloudflare deployment ownership contract

on:
  pull_request:
    paths:
      - wrangler.jsonc
      - wrangler.toml
      - wrangler.jsonc.example
      - wrangler.toml.example
      - workers/lead-email/**
      - scripts/cloudflare-deployment-contract.test.mjs
      - .github/workflows/**
      - docs/CLOUDFLARE_DEPLOYMENT_OWNERSHIP.md
  push:
    branches:
      - main
    paths:
      - wrangler.jsonc
      - wrangler.toml
      - wrangler.jsonc.example
      - wrangler.toml.example
      - workers/lead-email/**
      - scripts/cloudflare-deployment-contract.test.mjs
      - .github/workflows/**
      - docs/CLOUDFLARE_DEPLOYMENT_OWNERSHIP.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Prevent duplicate repository-controlled Worker deployments
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment ownership boundary
        run: node scripts/cloudflare-deployment-contract.test.mjs

      - name: Dry-run composed hermes-lead-email Worker
        run: npx --yes wrangler@4 deploy --dry-run --config workers/lead-email/wrangler.production.jsonc --outdir /tmp/hermes-lead-email-pr-dry-run
