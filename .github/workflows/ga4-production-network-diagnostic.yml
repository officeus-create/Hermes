name: GA4 production network diagnostic

on:
  push:
    branches:
      - diagnostic/ga4-production-network-2026-08-29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-carrier-event-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify privacy-safe carrier event reaches GA4 network exactly once
        run: node scripts/ga4-production-network-diagnostic.mjs

      - name: Verify shared analytics helper reaches GA4 network exactly once
        run: node scripts/ga4-shared-event-production-diagnostic.mjs

      - name: Verify vehicle branch preview reaches GA4 network exactly once without submission
        env:
          VEHICLE_TARGET_URL: https://fix-vehicle-ga4-transport-20.hermes-eu4.pages.dev/logistics/request-vehicle-transport/?role=dealer&request=auction_pickup#transport-intake
        run: node scripts/ga4-vehicle-event-production-diagnostic.mjs

      - name: Verify vehicle production reaches GA4 network exactly once without submission
        run: node scripts/ga4-vehicle-event-production-diagnostic.mjs

      - name: Verify Logistics SEO branch preview reaches GA4 network exactly once without submission
        env:
          SEO_SUPPORTING_TARGET_ORIGIN: https://fix-logistics-seo-ga4-transp.hermes-eu4.pages.dev
        run: node scripts/ga4-supporting-seo-production-diagnostic.mjs

      - name: Verify Logistics SEO production baseline without submission
        run: node scripts/ga4-supporting-seo-production-diagnostic.mjs
