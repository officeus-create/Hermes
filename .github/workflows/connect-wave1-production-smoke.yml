name: Verify canonical Hermes Connect production routes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/connect-wave1-production-smoke.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/connect-wave1-production-smoke.yml
      - functions/_middleware.js
      - public/demos/hermes-connect/**

permissions:
  contents: read

concurrency:
  group: connect-canonical-production-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical routing, tools, PWA, redirects, and consent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify current canonical route ownership, indexability, tools, and aliases
        run: |
          node <<'NODE'
          const connectOrigin = "https://connect.hermeslogisticsus.com";
          const mainOrigin = "https://hermeslogisticsus.com";
          const connectTools = [
            `${connectOrigin}/load-analyzer/`,
            `${connectOrigin}/search-opportunity-radar/`,
            `${connectOrigin}/revenue-dashboard/`,
            `${connectOrigin}/multi-car-planner/`,
            `${connectOrigin}/logistics-seo-analyzer/`,
          ];

          const targets = [
            {
              name: "Connect compatibility root → public product hub",
              url: `${connectOrigin}/`,
              markers: ["Run your business", "with AI."],
              expectNoindex: false,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/services/hermes-connect/"],
            },
            {
              name: "Legacy workspace alias → public product hub",
              url: `${connectOrigin}/workspace`,
              markers: ["Run your business", "with AI."],
              expectNoindex: false,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/services/hermes-connect/"],
            },
            {
              name: "Legacy mobile alias → public product hub",
              url: `${connectOrigin}/mobile.html`,
              markers: ["Run your business", "with AI."],
              expectNoindex: false,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/services/hermes-connect/"],
            },
            {
              name: "Request access → private Repair Shop registration",
              url: `${connectOrigin}/request-access/`,
              markers: ["Repair Shop Owner Access"],
              expectNoindex: true,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/services/hermes-connect/repair-shops/auth/"],
              expectedParams: { mode: "register" },
            },
            {
              name: "Explicit Sales Coach demo stays private",
              url: `${connectOrigin}/sales-roleplay.html`,
              markers: ["Hermes Sales Coach", "Web Prototype"],
              expectNoindex: true,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/demos/hermes-connect/sales-roleplay", "/demos/hermes-connect/sales-roleplay.html"],
            },
            {
              name: "Load Analyzer compatibility route → public reference owner",
              url: connectTools[0],
              markers: ["Load Analyzer Reference Capability"],
              expectNoindex: false,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/services/hermes-connect/load-analyzer/"],
            },
            {
              name: "Search Opportunity Radar direct private tool",
              url: connectTools[1],
              markers: ["Search Opportunity Radar"],
              expectNoindex: true,
              expectedOrigin: connectOrigin,
              expectedPaths: ["/search-opportunity-radar/"],
            },
            {
              name: "Revenue Dashboard direct private tool",
              url: connectTools[2],
              markers: ["Revenue Dashboard"],
              expectNoindex: true,
              expectedOrigin: connectOrigin,
              expectedPaths: ["/revenue-dashboard/"],
            },
            {
              name: "Multi-Car Planner direct private tool",
              url: connectTools[3],
              markers: ["Multi-Car Transport Planner"],
              expectNoindex: true,
              expectedOrigin: connectOrigin,
              expectedPaths: ["/multi-car-planner/"],
            },
            {
              name: "Logistics SEO Analyzer direct private tool",
              url: connectTools[4],
              markers: ["Logistics SEO Analyzer"],
              expectNoindex: true,
              expectedOrigin: connectOrigin,
              expectedPaths: ["/logistics-seo-analyzer/"],
            },
            {
              name: "Public multi-car commercial owner remains indexable",
              url: `${mainOrigin}/logistics/multi-car-transport/`,
              markers: [connectTools[3], "Open Multi-Car Transport Planner"],
              expectNoindex: false,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/logistics/multi-car-transport/"],
            },
            {
              name: "Public Logistics SEO owner remains indexable",
              url: `${mainOrigin}/services/seo-for-logistics-companies/`,
              markers: [connectTools[4], "Open Logistics SEO Analyzer"],
              expectNoindex: false,
              expectedOrigin: mainOrigin,
              expectedPaths: ["/services/seo-for-logistics-companies/"],
            },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const hasNoindex = (body) => /<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(body)
            || /<meta[^>]+content=["'][^"']*noindex[^"']*["'][^>]+name=["']robots["']/i.test(body);

          function finalRouteMatches(responseUrl, target) {
            const final = new URL(responseUrl);
            const pathMatch = target.expectedPaths.includes(final.pathname);
            const originMatch = final.origin === target.expectedOrigin;
            const paramsMatch = Object.entries(target.expectedParams || {}).every(([key, value]) => final.searchParams.get(key) === value);
            return { passed: originMatch && pathMatch && paramsMatch, finalOrigin: final.origin, finalPath: final.pathname, finalSearch: final.search };
          }

          const latest = new Map();
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            for (const target of targets) {
              if (latest.get(target.name)?.passed) continue;
              try {
                const separator = target.url.includes("?") ? "&" : "?";
                const response = await fetch(`${target.url}${separator}release=${Date.now()}`, {
                  redirect: "follow",
                  headers: { "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectReleaseVerifier/3.0" },
                  signal: AbortSignal.timeout(20_000),
                });
                const body = await response.text();
                const noindex = hasNoindex(body);
                const markers = target.markers.every((marker) => body.includes(marker));
                const indexBoundary = target.expectNoindex ? noindex : !noindex;
                const route = finalRouteMatches(response.url, target);
                latest.set(target.name, {
                  name: target.name,
                  sourceUrl: target.url,
                  attempt,
                  status: response.status,
                  markers,
                  noindex,
                  routeOwned: route.passed,
                  finalOrigin: route.finalOrigin,
                  finalPath: route.finalPath,
                  finalSearch: route.finalSearch,
                  passed: response.status === 200 && markers && indexBoundary && route.passed,
                });
              } catch (error) {
                latest.set(target.name, {
                  name: target.name,
                  sourceUrl: target.url,
                  attempt,
                  error: error instanceof Error ? error.message : String(error),
                  passed: false,
                });
              }
            }

            if (targets.every((target) => latest.get(target.name)?.passed)) break;
            if (attempt < 18) await sleep(10_000);
          }

          const results = targets.map((target) => latest.get(target.name));

          let markdownPassed = false;
          let markdownLast = {};
          for (let attempt = 1; attempt <= 18; attempt += 1) {
            try {
              const response = await fetch(`${connectOrigin}/?agent=${Date.now()}`, {
                redirect: "follow",
                headers: { accept: "text/markdown", "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectReleaseVerifier/3.0" },
                signal: AbortSignal.timeout(20_000),
              });
              const body = await response.text();
              const markers = ["Load Analyzer", "Search Opportunity Radar", "Revenue Dashboard", "Multi-Car Transport Planner", "Logistics SEO Analyzer"].every((marker) => body.includes(marker));
              const contentType = response.headers.get("content-type") || "";
              const robots = response.headers.get("x-robots-tag") || "";
              const final = new URL(response.url);
              const routeOwned = final.origin === connectOrigin && final.pathname === "/";
              markdownLast = { status: response.status, markers, contentType, robots, routeOwned, finalUrl: response.url };
              if (response.status === 200 && markers && contentType.includes("text/markdown") && robots.includes("noindex") && routeOwned) {
                markdownPassed = true;
                break;
              }
            } catch (error) {
              markdownLast = { error: error instanceof Error ? error.message : String(error) };
            }
            if (attempt < 18) await sleep(10_000);
          }
          results.push({ name: "Connect root Markdown negotiation", sourceUrl: `${connectOrigin}/ [text/markdown]`, passed: markdownPassed, ...markdownLast });

          console.log(JSON.stringify(results, null, 2));
          if (results.some((item) => !item?.passed)) process.exit(1);
          NODE

      - name: Verify canonical PWA assets have no retired Brand V1 dependencies
        run: |
          node <<'NODE'
          const stamp = Date.now();
          const manifestResponse = await fetch(`https://connect.hermeslogisticsus.com/manifest.webmanifest?release=${stamp}`, {
            headers: { "cache-control": "no-cache", pragma: "no-cache" },
            signal: AbortSignal.timeout(20_000),
          });
          if (manifestResponse.status !== 200) throw new Error(`manifest returned ${manifestResponse.status}`);
          const manifest = await manifestResponse.json();
          if (manifest.id !== "hermes-connect") throw new Error(`unexpected manifest id: ${manifest.id}`);
          if (manifest.start_url !== "./workspace.html") throw new Error(`unexpected start_url: ${manifest.start_url}`);

          const swResponse = await fetch(`https://connect.hermeslogisticsus.com/sw.js?release=${stamp}`, {
            headers: { "cache-control": "no-cache", pragma: "no-cache" },
            signal: AbortSignal.timeout(20_000),
          });
          const sw = await swResponse.text();
          if (swResponse.status !== 200) throw new Error(`service worker returned ${swResponse.status}`);
          for (const marker of ["workspace-enhancements.css", "workspace-enhancements.js", "workspace.html"]) {
            if (!sw.includes(marker)) throw new Error(`service worker missing ${marker}`);
          }
          for (const retired of ["hermes-connect-brand-v1", "workspace-v2.html", "mobile.html", "workspace-launch-v2.js"]) {
            if (sw.includes(retired)) throw new Error(`service worker still depends on retired asset ${retired}`);
          }
          console.log(JSON.stringify({ manifest: manifestResponse.status, serviceWorker: swResponse.status, canonicalPreviewPwa: true }));
          NODE

      - name: Verify retired Brand V1 public URLs redirect to canonical Connect
        run: |
          node <<'NODE'
          const redirects = [
            ["https://hermeslogisticsus.com/demos/hermes-connect-brand-v1/workspace.html?tool=load-analyzer", "https://connect.hermeslogisticsus.com/?tool=load-analyzer"],
            ["https://hermeslogisticsus.com/demos/hermes-connect-brand-v1/mobile.html", "https://connect.hermeslogisticsus.com/"],
            ["https://hermeslogisticsus.com/demos/hermes-connect-brand-v1/sales-roleplay.html", "https://connect.hermeslogisticsus.com/sales-roleplay.html"],
          ];
          const results = [];
          for (const [source, expected] of redirects) {
            const response = await fetch(source, { redirect: "manual", headers: { "cache-control": "no-cache", pragma: "no-cache" }, signal: AbortSignal.timeout(20_000) });
            const location = response.headers.get("location");
            const passed = response.status === 308 && location === expected;
            results.push({ source, status: response.status, location, expected, passed });
          }
          console.log(JSON.stringify(results, null, 2));
          if (results.some((item) => !item.passed)) process.exit(1);
          NODE

      - name: Verify consent analytics on a direct Connect surface without pre-consent vendor load
        run: |
          node <<'NODE'
          const surfaceUrl = `https://connect.hermeslogisticsus.com/search-opportunity-radar/?analytics=${Date.now()}`;
          const surface = await fetch(surfaceUrl, {
            redirect: "follow",
            headers: { "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectAnalyticsVerifier/3.0" },
            signal: AbortSignal.timeout(20_000),
          });
          const html = await surface.text();
          const final = new URL(surface.url);
          if (surface.status !== 200) throw new Error(`Connect direct surface returned ${surface.status}`);
          if (final.origin !== "https://connect.hermeslogisticsus.com" || final.pathname !== "/search-opportunity-radar/") {
            throw new Error(`Unexpected consent verification owner: ${surface.url}`);
          }
          if (!html.includes("data-hermes-connect-analytics-consent")) throw new Error("Consent bootstrap marker missing from direct Connect HTML");
          if (!html.includes('/connect-analytics-consent.mjs')) throw new Error("Consent bootstrap asset reference missing from direct Connect HTML");
          if (html.includes("googletagmanager.com/gtag/js")) throw new Error("Google tag vendor URL must not be embedded directly in pre-consent HTML");

          const assetUrl = `https://connect.hermeslogisticsus.com/connect-analytics-consent.mjs?analytics=${Date.now()}`;
          const asset = await fetch(assetUrl, {
            headers: { "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectAnalyticsVerifier/3.0" },
            signal: AbortSignal.timeout(20_000),
          });
          const source = await asset.text();
          const markers = ["G-RY26321PVW", "hermes-analytics-consent", "ALLOWED_EVENT_KEYS", "analytics_storage", "ad_personalization"];
          if (asset.status !== 200 || !markers.every((marker) => source.includes(marker))) {
            throw new Error(`Consent analytics asset verification failed: status=${asset.status}`);
          }
          console.log(JSON.stringify({ surface: surface.status, owner: `${final.origin}${final.pathname}`, bootstrap: true, preConsentVendorUrl: false, asset: asset.status, markers: true }));
          NODE
