name: Verify canonical Hermes Connect production routes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/connect-wave1-production-smoke.yml
      - functions/_middleware.js
      - public/demos/hermes-connect/**

permissions:
  contents: read

concurrency:
  group: connect-canonical-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    name: Verify canonical workspace, tools, PWA, redirects, and consent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify canonical production workspace, request access, tools, and aliases
        run: |
          node <<'NODE'
          const connectTools = [
            "https://connect.hermeslogisticsus.com/load-analyzer/",
            "https://connect.hermeslogisticsus.com/search-opportunity-radar/",
            "https://connect.hermeslogisticsus.com/revenue-dashboard/",
            "https://connect.hermeslogisticsus.com/multi-car-planner/",
            "https://connect.hermeslogisticsus.com/logistics-seo-analyzer/",
          ];
          const targets = [
            { url: "https://connect.hermeslogisticsus.com/", markers: ["Hermes Connect", "AI Operating System", "Visual prototype"], expectNoindex: true },
            { url: "https://connect.hermeslogisticsus.com/workspace", markers: ["Hermes Connect", "AI Operating System", "Visual prototype"], expectNoindex: true },
            { url: "https://connect.hermeslogisticsus.com/mobile.html", markers: ["Hermes Connect", "AI Operating System", "Visual prototype"], expectNoindex: true },
            { url: "https://connect.hermeslogisticsus.com/request-access/", markers: ["Live Hermes Connect tools", "data-application-form"], expectNoindex: true },
            { url: "https://connect.hermeslogisticsus.com/sales-roleplay.html", markers: ["Hermes Sales Coach", "Web Prototype"], expectNoindex: true },
            { url: connectTools[0], markers: ["Hermes Connect Load Analyzer"], expectNoindex: true },
            { url: connectTools[1], markers: ["Search Opportunity Radar"], expectNoindex: true },
            { url: connectTools[2], markers: ["Revenue Dashboard"], expectNoindex: true },
            { url: connectTools[3], markers: ["Multi-Car Transport Planner"], expectNoindex: true },
            { url: connectTools[4], markers: ["Logistics SEO Analyzer"], expectNoindex: true },
            { url: "https://hermeslogisticsus.com/logistics/multi-car-transport/", markers: [connectTools[3], "Open Multi-Car Transport Planner"], expectNoindex: false },
            { url: "https://hermeslogisticsus.com/services/seo-for-logistics-companies/", markers: [connectTools[4], "Open Logistics SEO Analyzer"], expectNoindex: false },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const results = [];
          for (const target of targets) {
            let passed = false;
            let last = {};
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              try {
                const separator = target.url.includes("?") ? "&" : "?";
                const response = await fetch(`${target.url}${separator}release=${Date.now()}`, {
                  redirect: "follow",
                  headers: { "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectReleaseVerifier/2.0" },
                  signal: AbortSignal.timeout(20_000),
                });
                const body = await response.text();
                const noindex = /<meta[^>]+name=["']robots["'][^>]+content=["'][^"']*noindex/i.test(body)
                  || /<meta[^>]+content=["'][^"']*noindex[^"']*["'][^>]+name=["']robots["']/i.test(body);
                const markers = target.markers.every((marker) => body.includes(marker));
                const indexBoundary = target.expectNoindex ? noindex : !noindex;
                last = { status: response.status, markers, noindex, finalUrl: response.url };
                if (response.status === 200 && markers && indexBoundary) { passed = true; break; }
              } catch (error) { last = { error: error instanceof Error ? error.message : String(error) }; }
              if (attempt < 12) await sleep(10_000);
            }
            results.push({ url: target.url, passed, ...last });
          }

          let markdownPassed = false;
          let markdownLast = {};
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(`https://connect.hermeslogisticsus.com/?agent=${Date.now()}`, {
                redirect: "follow",
                headers: { accept: "text/markdown", "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectReleaseVerifier/2.0" },
                signal: AbortSignal.timeout(20_000),
              });
              const body = await response.text();
              const markers = ["Load Analyzer", "Search Opportunity Radar", "Revenue Dashboard", "Multi-Car Transport Planner", "Logistics SEO Analyzer"].every((marker) => body.includes(marker));
              const contentType = response.headers.get("content-type") || "";
              const robots = response.headers.get("x-robots-tag") || "";
              markdownLast = { status: response.status, markers, contentType, robots };
              if (response.status === 200 && markers && contentType.includes("text/markdown") && robots.includes("noindex")) { markdownPassed = true; break; }
            } catch (error) { markdownLast = { error: error instanceof Error ? error.message : String(error) }; }
            if (attempt < 12) await sleep(10_000);
          }
          results.push({ url: "https://connect.hermeslogisticsus.com/ [text/markdown]", passed: markdownPassed, ...markdownLast });

          console.log(JSON.stringify(results, null, 2));
          if (results.some((item) => !item.passed)) process.exit(1);
          NODE

      - name: Verify canonical PWA assets have no retired Brand V1 dependencies
        run: |
          node <<'NODE'
          const stamp = Date.now();
          const manifestResponse = await fetch(`https://connect.hermeslogisticsus.com/manifest.webmanifest?release=${stamp}`, {
            headers: { "cache-control": "no-cache", pragma: "no-cache" },
            signal: AbortSignal.timeout(20_000),
          });
          if (manifestResponse.status !== 200) throw new Error(`manifest returned ${manifestResponse.status}`);
          const manifest = await manifestResponse.json();
          if (manifest.id !== "hermes-connect") throw new Error(`unexpected manifest id: ${manifest.id}`);
          if (manifest.start_url !== "./workspace.html") throw new Error(`unexpected start_url: ${manifest.start_url}`);

          const swResponse = await fetch(`https://connect.hermeslogisticsus.com/sw.js?release=${stamp}`, {
            headers: { "cache-control": "no-cache", pragma: "no-cache" },
            signal: AbortSignal.timeout(20_000),
          });
          const sw = await swResponse.text();
          if (swResponse.status !== 200) throw new Error(`service worker returned ${swResponse.status}`);
          for (const marker of ["workspace-enhancements.css", "workspace-enhancements.js", "workspace.html"]) {
            if (!sw.includes(marker)) throw new Error(`service worker missing ${marker}`);
          }
          for (const retired of ["hermes-connect-brand-v1", "workspace-v2.html", "mobile.html", "workspace-launch-v2.js"]) {
            if (sw.includes(retired)) throw new Error(`service worker still depends on retired asset ${retired}`);
          }
          console.log(JSON.stringify({ manifest: manifestResponse.status, serviceWorker: swResponse.status, canonical: true }));
          NODE

      - name: Verify retired Brand V1 public URLs redirect to canonical Connect
        run: |
          node <<'NODE'
          const redirects = [
            ["https://hermeslogisticsus.com/demos/hermes-connect-brand-v1/workspace.html?tool=load-analyzer", "https://connect.hermeslogisticsus.com/?tool=load-analyzer"],
            ["https://hermeslogisticsus.com/demos/hermes-connect-brand-v1/mobile.html", "https://connect.hermeslogisticsus.com/"],
            ["https://hermeslogisticsus.com/demos/hermes-connect-brand-v1/sales-roleplay.html", "https://connect.hermeslogisticsus.com/sales-roleplay.html"],
          ];
          const results = [];
          for (const [source, expected] of redirects) {
            const response = await fetch(source, { redirect: "manual", headers: { "cache-control": "no-cache", pragma: "no-cache" }, signal: AbortSignal.timeout(20_000) });
            const location = response.headers.get("location");
            const passed = response.status === 308 && location === expected;
            results.push({ source, status: response.status, location, expected, passed });
          }
          console.log(JSON.stringify(results, null, 2));
          if (results.some((item) => !item.passed)) process.exit(1);
          NODE

      - name: Verify consent analytics bootstrap without pre-consent vendor load
        run: |
          node <<'NODE'
          const rootUrl = `https://connect.hermeslogisticsus.com/?analytics=${Date.now()}`;
          const root = await fetch(rootUrl, {
            headers: { "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectAnalyticsVerifier/2.0" },
            signal: AbortSignal.timeout(20_000),
          });
          const html = await root.text();
          if (root.status !== 200) throw new Error(`Connect root returned ${root.status}`);
          if (!html.includes("data-hermes-connect-analytics-consent")) throw new Error("Consent bootstrap marker missing from Connect HTML");
          if (!html.includes('/connect-analytics-consent.mjs')) throw new Error("Consent bootstrap asset reference missing from Connect HTML");
          if (html.includes("googletagmanager.com/gtag/js")) throw new Error("Google tag vendor URL must not be embedded directly in pre-consent HTML");

          const assetUrl = `https://connect.hermeslogisticsus.com/connect-analytics-consent.mjs?analytics=${Date.now()}`;
          const asset = await fetch(assetUrl, {
            headers: { "cache-control": "no-cache", pragma: "no-cache", "user-agent": "HermesConnectAnalyticsVerifier/2.0" },
            signal: AbortSignal.timeout(20_000),
          });
          const source = await asset.text();
          const markers = ["G-RY26321PVW", "hermes-analytics-consent", "ALLOWED_EVENT_KEYS", "analytics_storage", "ad_personalization"];
          if (asset.status !== 200 || !markers.every((marker) => source.includes(marker))) {
            throw new Error(`Consent analytics asset verification failed: status=${asset.status}`);
          }
          console.log(JSON.stringify({ root: root.status, bootstrap: true, preConsentVendorUrl: false, asset: asset.status, markers: true }));
          NODE
