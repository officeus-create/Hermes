name: Repair Shop P0 production closure proof

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  issues: write

concurrency:
  group: repair-p0-production-closure-proof
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.issue.number == 510 &&
      github.event.comment.body == '/verify-repair-p0-production' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    name: Verify production Repair Shop P0 closure gaps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install production proof dependencies
        run: npm ci

      - name: Install Chromium for production browser proof
        run: npx playwright install --with-deps chromium

      - name: Verify production customer CRM aggregation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/repair-customer-crm-production-smoke.sh

      - name: Verify canonical owner desktop/mobile journey and private feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/repair-p0-production-proof-v2.mjs

      - name: Publish sanitized proof result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Repair Shop P0 production closure proof"
            echo
            echo "- Checked main commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Job status: **${JOB_STATUS}**"
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "- ✅ Repeat-customer CRM aggregation, completed/next-appointment history, and vehicle/service context passed against production."
              echo "- ✅ Real Chromium owner journey passed on desktop and 390px: landing → registration/login → authenticated dashboard."
              echo "- ✅ Profile, three persisted services, availability, public booking, owner status/history, repeat customer/vehicle CRM, and default access readback passed."
              echo "- ✅ Private feedback submit/readback passed from the authenticated 390px dashboard."
              echo "- ✅ Temporary synthetic owner/customer/feedback rows were cleaned by the bounded cleanup paths."
            else
              echo "- ❌ One or more remaining production P0 proofs failed; do not mark the Repair Shop customer loop complete from this run."
            fi
            echo
            echo "> Synthetic verification only. No real customer/shop data, credential values, or private identifiers are published."
          } > "${RUNNER_TEMP}/repair-p0-production-proof.md"
          gh issue comment 510 --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/repair-p0-production-proof.md"
