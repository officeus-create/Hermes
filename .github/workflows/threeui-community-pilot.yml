name: ThreeUI Community isolated pilot
on:
  pull_request:
    paths:
      - 'experiments/threeui-community/**'
      - '.github/workflows/threeui-community-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/threeui-community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: test -f dist/index.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threeui-synthetic-browser-evidence
          path: experiments/threeui-community/test-results/
          retention-days: 7
          if-no-files-found: ignore
# No deploy, no Hermes customer data, no production UI.
