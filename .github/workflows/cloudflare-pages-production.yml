# Reviewed merge trigger for the controlled Hermes Pages production release.
name: Deploy approved main to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-pages-production.yml

permissions:
  contents: read
  deployments: write
  issues: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify approved main
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out approved main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate Cloudflare deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing="CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ -n "$missing" ]; then missing="$missing, "; fi
            missing="${missing}CLOUDFLARE_ACCOUNT_ID"
          fi
          if [ -n "$missing" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "Missing required GitHub Actions deployment credentials: $missing" >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Report credential blocker
        if: failure() && steps.credentials.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.credentials.outputs.missing }}
        run: |
          gh issue comment 232 --repo "$GITHUB_REPOSITORY" --body "## Controlled production deploy blocked

The reviewed main commit \`$GITHUB_SHA\` could not start the official Wrangler Pages deployment because the required GitHub Actions deployment credentials are not available to this workflow: \`${MISSING:-Cloudflare credentials}\`.

No token or account value was printed or accessed. Add the repository secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\`, then rerun **Deploy approved main to Cloudflare Pages**. The API token should have Account → Cloudflare Pages → Edit permission for the account that owns Pages project \`hermes\`.

Release classification remains: \`REPOSITORY_RELEASE_COMPLETE / CUSTOM_DOMAIN_DEPLOYMENT_STALE\`."

      - name: Install dependencies
        run: npm ci

      - name: Build approved release
        run: npm run build

      - name: Validate static release contracts
        run: npm test

      - name: Deploy dist to the authoritative Pages project
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=hermes --branch=main --commit-hash=${{ github.sha }} --commit-message="Approved main ${{ github.sha }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the main-domain Hermes Connect bridge
        run: |
          node <<'NODE'
          const targets = [
            {
              url: "https://hermeslogisticsus.com/services/hermes-connect/",
              markers: ["Hermes Connect Web App", "Request Web App access"],
            },
            {
              url: "https://hermeslogisticsus.com/",
              markers: ["Hermes Connect", "Web App"],
            },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const attempts = 12;

          for (const target of targets) {
            let verified = false;
            let lastStatus = null;
            let lastTitle = null;
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(`${target.url}?release=${Date.now()}`, {
                  redirect: "follow",
                  headers: {
                    "cache-control": "no-cache",
                    pragma: "no-cache",
                    "user-agent": "HermesProductionVerifier/1.0",
                  },
                  signal: AbortSignal.timeout(20_000),
                });
                const body = await response.text();
                lastStatus = response.status;
                lastTitle = body.match(/<title>([^<]*)<\/title>/i)?.[1]?.trim() ?? null;
                if (response.status === 200 && target.markers.every((marker) => body.includes(marker))) {
                  verified = true;
                  break;
                }
              } catch (error) {
                console.error(`Attempt ${attempt} failed for ${target.url}:`, error instanceof Error ? error.message : error);
              }
              if (attempt < attempts) await sleep(10_000);
            }

            if (!verified) {
              console.error(`Production verification failed for ${target.url}. Last status: ${lastStatus}; title: ${lastTitle}`);
              process.exitCode = 1;
            } else {
              console.log(`Verified approved release at ${target.url}`);
            }
          }
          NODE

      - name: Report successful Pages release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          gh issue comment 232 --repo "$GITHUB_REPOSITORY" --body "## Controlled Pages production deploy succeeded

Approved main commit \`$GITHUB_SHA\` was built, validated, and uploaded to Cloudflare Pages project \`hermes\` from \`dist\`. The new indexed Hermes Connect overview and the homepage Web App bridge were confirmed on the main custom domain.

Deployment URL returned by Wrangler: ${DEPLOYMENT_URL:-not returned}.

The separate custom-subdomain verifier must still confirm \`https://connect.hermeslogisticsus.com/\` before this issue is closed."

      - name: Report deployment or verification failure
        if: failure() && steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 232 --repo "$GITHUB_REPOSITORY" --body "## Controlled production deploy did not complete

Cloudflare credentials were available, but build, Wrangler deployment, or public production verification failed for main commit \`$GITHUB_SHA\`.

Review the sanitized GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No secret value is included in this comment.

Keep the Web App \`noindex,nofollow\` and do not submit a real access request until the main-domain bridge and Connect custom subdomain are both verified."

      - name: Publish deployment summary
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "# Cloudflare Pages production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Project: \`hermes\`"
            echo "- Branch: \`main\`"
            echo "- Build output: \`dist\`"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not returned}"
            echo "- Alias URL: ${DEPLOYMENT_ALIAS:-not returned}"
            echo
            echo "> No token, account ID, binding ID, recipient, or secret value is written to this summary."
          } >> "$GITHUB_STEP_SUMMARY"
