name: Website checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate safe audit remediation lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Reinstall remediated dependencies
        run: npm ci

      - name: Report dependency advisories
        run: node scripts/dependency-audit-report.mjs

      - name: Emit remediated lockfile payload
        run: |
          echo "LOCKFILE_GZIP_BASE64_BEGIN"
          gzip -9c package-lock.json | base64 -w0
          echo
          echo "LOCKFILE_GZIP_BASE64_END"

      - name: Build website
        run: npm run build

      - name: Validate static output
        run: npm test

      - name: Install browser for workflow tests
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e
