name: Website checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  patch-academy-ru:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Academy RU branch
        uses: actions/checkout@v6
        with:
          ref: feat/academy-ru-lesson-content-2026-09-01

      - name: Align Russian equipment rubric to canonical schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/api/_lib/academy-content-ru.mjs')
          text = path.read_text()
          old = 'rubric: [criterion("facts", "Подтверждённые факты", "Facts отделены от assumptions."), criterion("questions", "Необходимые вопросы", "Uncertainty превращена в concrete questions."), criterion("equipment_fit", "Проверка equipment fit", "Capacity/restrictions не предполагаются."), criterion("route_timing", "Проверка route и timing", "Deadhead/windows/access рассмотрены."), criterion("carrier_control", "Контроль carrier", "Safety/operating/final approval остаются у carrier."), criterion("claim_safety", "Безопасность формулировки", "Нет claim profit/safety/booking outcome." )],'
          new = 'rubric: [criterion("equipment_facts", "Проверка equipment facts", "Capacity/restrictions основаны на approved profile, а не на предположении."), criterion("route_timing", "Проверка route и timing", "Deadhead/windows/access рассмотрены как отдельные review inputs."), criterion("fact_assumption", "Факты и предположения", "Unknowns не представлены как факты."), criterion("useful_questions", "Необходимые вопросы", "Uncertainty превращена в конкретные вопросы, нужные для fit review."), criterion("carrier_decision", "Решение carrier", "Safety/operating judgment/final approval остаются у carrier."), criterion("claim_safety", "Безопасность формулировки", "Нет claim profit/rate/utilization/safety/booking outcome." )],'
          if old not in text:
              raise SystemExit('Expected legacy equipment rubric not found; refusing broad rewrite')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/_lib/academy-content-ru.mjs
          git commit -m "fix(academy): align Russian equipment rubric with canonical keys"
          git push origin HEAD:feat/academy-ru-lesson-content-2026-09-01
