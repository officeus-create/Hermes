name: Website checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Update scoped Load Board status locator
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/route-estimate-boundary'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "tests/site.spec.ts";
          const source = readFileSync(path, "utf8");
          const before = `test("Load Board demo search reveals a fictional load for a presented city", async ({ page }) => {
            await page.goto("/load-board/");
            await page.getByRole("button", { name: "Rockford, IL" }).click();
            await expect(page.getByRole("status")).toContainText("1 fictional demonstration load found");
            await expect(page.locator("[data-demo-load-card]:visible")).toHaveCount(1);
            await expect(page.locator("[data-demo-load-card]:visible")).toContainText("Nashville, TN");
            await expect(page.getByRole("status")).toContainText("not available to book or dispatch");
          });`;
          const after = `test("Load Board demo search reveals a fictional load for a presented city", async ({ page }) => {
            await page.goto("/load-board/");
            await page.getByRole("button", { name: "Rockford, IL" }).click();
            const demoStatus = page.locator("[data-demo-search-status]");
            await expect(demoStatus).toContainText("1 fictional demonstration load found");
            await expect(page.locator("[data-demo-load-card]:visible")).toHaveCount(1);
            await expect(page.locator("[data-demo-load-card]:visible")).toContainText("Nashville, TN");
            await expect(demoStatus).toContainText("not available to book or dispatch");
          });`;

          const matches = source.split(before).length - 1;
          if (matches === 0 && source.includes(after)) process.exit(0);
          if (matches !== 1) throw new Error(`Expected one Load Board test block, found ${matches}`);
          writeFileSync(path, source.replace(before, after));
          NODE

      - name: Commit scoped test update
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/route-estimate-boundary'
        run: |
          if git diff --quiet -- tests/site.spec.ts; then
            echo "Load Board status locator is already scoped."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/site.spec.ts
            git commit -m "Scope Load Board demo status locator [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency security
        run: node scripts/dependency-audit-report.mjs

      - name: Build website
        run: npm run build

      - name: Validate static output
        run: npm test

      - name: Install browser for workflow tests
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e
