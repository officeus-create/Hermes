name: Website checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate safe audit remediation lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit remediated lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'security/dependency-audit-remediation'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already contains the remediation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update dependency lockfile after security audit [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Reinstall remediated dependencies
        run: npm ci

      - name: Report dependency advisories
        run: node scripts/dependency-audit-report.mjs

      - name: Build website
        run: npm run build

      - name: Validate static output
        run: npm test

      - name: Install browser for workflow tests
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e
