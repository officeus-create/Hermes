name: Website checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency security
        run: node scripts/dependency-audit-report.mjs

      - name: Build website
        run: npm run build

      - name: Validate static output
        run: npm test

      - name: Validate carrier contract engine
        run: node --experimental-strip-types scripts/carrier-contract-engine.test.mjs

      - name: Install browser for workflow tests
        run: npx playwright install --with-deps chromium

      - name: Run browser workflow tests
        run: npm run test:e2e
