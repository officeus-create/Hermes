name: Website checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency security
        run: node scripts/dependency-audit-report.mjs

      - name: Build website
        run: npm run build

      - name: Validate static output
        run: npm test

      - name: Validate London launch contract
        run: node scripts/london-launch-contract.test.mjs

      - name: Enforce 100-task SEO production invariants
        run: node scripts/seo-100-task-batch.test.mjs

      - name: Enforce JobPosting lifecycle
        run: node --experimental-strip-types scripts/job-posting-lifecycle.test.mjs

      - name: Enforce Hermes SEO Framework P0 gate
        run: node scripts/hermes-seo-framework-p0-gate.test.mjs

      - name: Enforce four-direction SEO market registry
        run: node scripts/seo-four-direction-market-registry.test.mjs

      - name: Enforce Hermes GEO evidence contract
        run: node scripts/llms-full-evidence-contract.test.mjs

      - name: Enforce commercial owner internal-link paths
        run: node scripts/commercial-owner-link-gate.test.mjs

      - name: Enforce short Hermes GEO evidence contract
        run: node scripts/llms-short-evidence-contract.test.mjs

      - name: Validate repair shop access state
        run: node scripts/repair-shop-access-contract.test.mjs

      - name: Validate repair shop web v1
        run: node scripts/repair-shop-web-v1-contract.test.mjs

      - name: Validate repair shop capabilities
        run: node scripts/repair-shop-capabilities-contract.test.mjs

      - name: Validate repair shop capacity-aware booking
        run: node scripts/repair-shop-capacity-contract.test.mjs

      - name: Validate repair shop operating statuses
        run: node scripts/repair-shop-operations-contract.test.mjs

      - name: Validate carrier contract engine
        run: node --experimental-strip-types scripts/carrier-contract-engine.test.mjs

      - name: Install browser for workflow tests
        run: npx playwright install --with-deps chromium

      - name: Validate SEO analytics privacy browser flow
        run: npx playwright test tests/seo-analytics-privacy.spec.ts --project=desktop

      - name: Validate repair shop Web V1 browser flow
        run: npx playwright test tests/repair-shop-web-v1.spec.ts --project=desktop

      - name: Validate repair shop capabilities browser flow
        run: npx playwright test tests/repair-shop-capabilities.spec.ts --project=desktop

      - name: Validate repair shop capacity browser flow
        run: npx playwright test tests/repair-shop-capacity.spec.ts --project=desktop

      - name: Validate repair shop operating-status browser flow
        run: npx playwright test tests/repair-shop-operations.spec.ts --project=desktop

      - name: Validate carrier onboarding browser flow
        run: npx playwright test tests/carrier-contract-engine.spec.ts --project=desktop --grep "carrier can complete"

      - name: Run browser workflow tests
        run: npm run test:e2e
