name: Hermes Connect Multi-AI Adapter

on:
  pull_request:
    paths:
      - "src/integrations/hermes-connect-ai-adapter.mjs"
      - "scripts/hermes-connect-ai-adapter.test.mjs"
      - "docs/HERMES_CONNECT_MULTI_AI_ADAPTER.md"
      - ".github/workflows/hermes-connect-ai-adapter.yml"
  push:
    branches:
      - main
    paths:
      - "src/integrations/hermes-connect-ai-adapter.mjs"
      - "scripts/hermes-connect-ai-adapter.test.mjs"
      - "docs/HERMES_CONNECT_MULTI_AI_ADAPTER.md"
      - ".github/workflows/hermes-connect-ai-adapter.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/hermes-connect-ai-adapter.test.mjs
