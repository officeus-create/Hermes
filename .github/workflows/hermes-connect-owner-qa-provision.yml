name: Provision Hermes Connect CEO owner QA

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: hermes-connect-owner-qa-provision
  cancel-in-progress: false

jobs:
  provision:
    if: >-
      github.event.issue.number == 671 &&
      github.event.comment.body == '/provision-hc-owner-qa' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out canonical main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Provision persistent QA owner through canonical production APIs
        shell: bash
        run: bash scripts/hermes-connect-owner-qa-provision.sh

      - name: Upload private owner credentials and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-connect-ceo-owner-qa
          path: artifacts/hc-owner-qa/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish sanitized result to issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 671 --repo "${{ github.repository }}" --body-file artifacts/hc-owner-qa/issue-comment.md
