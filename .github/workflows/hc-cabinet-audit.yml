name: Audit Hermes Connect cabinets

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: hc-cabinet-audit-production
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event.issue.number == 671 &&
      github.event.comment.body == '/audit-hc-cabinets' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}

    steps:
      - name: Read sanitized production cabinet identity matches from D1
        shell: bash
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP}/hc-cabinet-audit"
          RESULT="${TMP}/result.md"
          mkdir -p "$TMP"
          chmod 700 "$TMP"

          fail() {
            printf '%s\n' \
              '## Hermes Connect cabinet audit — FAILED' \
              '' \
              "- ${1}" \
              '- Read-only audit only: no profile, account, access, registration, booking, customer, password, or session data was mutated.' \
              '- No Cloudflare token, D1 database ID, raw account ID, unmasked email, password, or session value is published.' \
              > "$RESULT"
            exit 1
          }

          [ -n "${CLOUDFLARE_PAGES_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_D1_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] \
            || fail 'Approved production Cloudflare read path is unavailable.'
          echo "::add-mask::$CLOUDFLARE_PAGES_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_D1_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"

          PAGES_HTTP="$(curl -sS -o "$TMP/pages.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/hermes" \
            -H "Authorization: Bearer ${CLOUDFLARE_PAGES_API_TOKEN}" \
            -H 'Content-Type: application/json')"
          [ "$PAGES_HTTP" = 200 ] && [ "$(jq -r '.success // false' "$TMP/pages.json")" = true ] \
            || fail 'Cloudflare Pages project read did not succeed.'

          DB_ID="$(jq -r '.result.deployment_configs.production.d1_databases.DB.id // empty' "$TMP/pages.json")"
          rm -f "$TMP/pages.json"
          [ -n "$DB_ID" ] && [ "$DB_ID" != null ] || fail 'Production D1 DB binding is missing.'
          echo "::add-mask::$DB_ID"

          SQL=$(cat <<'SQL'
          SELECT
            s.name, s.email, s.role, s.location, s.created_at,
            rs.name AS shop_name, rs.slug AS shop_slug, rs.city, rs.state, rs.updated_at AS shop_updated_at,
            rsa.access_state, rsa.plan_id,
            a.salesperson_code, a.source,
            COALESCE(f.synthetic,0) AS synthetic,
            (SELECT MAX(se.created_at) FROM sessions se WHERE se.specialist_id=s.id) AS last_session_at,
            CASE
              WHEN s.role='Shop Owner' THEN CASE
                WHEN rs.id IS NOT NULL
                  AND LENGTH(TRIM(COALESCE(rs.name,'')))>=2
                  AND LENGTH(TRIM(COALESCE(rs.phone,'')))>=7
                  AND LENGTH(TRIM(COALESCE(rs.city,'')))>=2
                  AND LENGTH(TRIM(COALESCE(rs.state,'')))=2
                THEN 1 ELSE 0 END
              ELSE NULL
            END AS profile_complete
          FROM specialists s
          LEFT JOIN repair_shops rs ON rs.owner_specialist_id=s.id
          LEFT JOIN repair_shop_access rsa ON rsa.shop_id=rs.id
          LEFT JOIN repair_shop_sales_attribution a ON a.owner_specialist_id=s.id
          LEFT JOIN hermes_registration_flags f ON f.specialist_id=s.id
          ORDER BY s.created_at DESC
          LIMIT 500;
          SQL
          )
          BODY="$(jq -nc --arg sql "$SQL" '{sql:$sql,params:[]}')"
          D1_HTTP="$(curl -sS -o "$TMP/d1.json" -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" \
            -H 'Content-Type: application/json' --data-binary "$BODY")"
          if [ "$D1_HTTP" = 401 ] || [ "$D1_HTTP" = 403 ]; then
            fail 'Production D1 token does not currently permit the bounded read-only audit.'
          fi
          [ "$D1_HTTP" = 200 ] && [ "$(jq -r '.success // false' "$TMP/d1.json")" = true ] \
            && [ "$(jq -r '.result[0].success // false' "$TMP/d1.json")" = true ] \
            || fail 'Production D1 read query did not succeed.'
          jq '.result[0].results // []' "$TMP/d1.json" > "$TMP/rows.json"
          rm -f "$TMP/d1.json"

          cat > "$TMP/vadym-shops.txt" <<'EOF'
          Joe's Auto Repair
          Arkansas Automotive
          Arkansas Auto Repair
          HCS Auto Repair
          The KAR Shop
          First Call mobile Mechanic Automotive Service
          George Barton's Auto Shop
          Bear mountain Automotive LLC
          Weber Automotive Repairs
          Garage Thirty
          Titan Auto Shop
          Bill's Automotive Repair Shop
          Advanced Automotive Shop
          Conway Collision Center
          KK Performance Colony West Conoco Automotive
          Pinnacle Automotive
          Freyaldenhoven Automotive
          Skyline Automotive
          Parkway Automotive
          Cantrell Service Center
          Joes Garage
          Coleman & Son Automotive
          Fosters Garage
          Halter's Body Shop
          Reverse Collision
          EOF
          sed -i 's/^          //' "$TMP/vadym-shops.txt"
          jq -Rn '[inputs|select(length>0)|ascii_downcase|gsub("[^a-z0-9]+";" ")|gsub("^ +| +$";"")]' < "$TMP/vadym-shops.txt" > "$TMP/vadym-names.json"

          jq '[.[] | select((.email//""|ascii_downcase|test("^(office|officeus)(\\+[^@]+)?@")) or (.name//""|ascii_downcase|test("volkogon")))]' "$TMP/rows.json" > "$TMP/office.json"
          jq --slurpfile names "$TMP/vadym-names.json" '
            def norm: ascii_downcase|gsub("[^a-z0-9]+";" ")|gsub("^ +| +$";"");
            [.[] | . as $r
              | ((.shop_name//"")|norm) as $shop
              | (([.name,.email,.salesperson_code,.source]|map(.//"")|join(" "))|ascii_downcase) as $attrib
              | select(($shop!="" and ($names[0]|index($shop))!=null) or ($attrib|test("vadim|vadym")))]
          ' "$TMP/rows.json" > "$TMP/vadym.json"

          mask_email() {
            local email="$1"
            if [[ "$email" == *@* ]]; then
              local localpart="${email%@*}" domain="${email#*@}"
              printf '%s***@%s' "${localpart:0:1}" "$domain"
            else
              printf '—'
            fi
          }

          render_rows() {
            local file="$1" count
            count="$(jq 'length' "$file")"
            if [ "$count" = 0 ]; then
              echo '- No matching production account/shop record found.'
              return
            fi
            while IFS=$'\t' read -r name shop email role city state profile access plan source salesperson synthetic created updated last_session; do
              [ -n "$shop" ] || shop='(no shop profile)'
              email="$(mask_email "$email")"
              printf -- '- **%s** · owner `%s` · %s · role `%s` · %s, %s · profile `%s` · access `%s` · plan `%s` · source `%s` · salesperson `%s` · synthetic `%s` · created `%s` · shop updated `%s` · last session `%s`\n' \
                "$shop" "${name:-—}" "$email" "${role:-—}" "${city:-—}" "${state:-—}" "${profile:-0}" "${access:-—}" "${plan:-—}" "${source:-—}" "${salesperson:-—}" "${synthetic:-0}" "${created:-—}" "${updated:-—}" "${last_session:-—}"
            done < <(jq -r '.[] | [(.name//""),(.shop_name//""),(.email//""),(.role//""),(.city//""),(.state//""),((.profile_complete//0)|tostring),(.access_state//""),(.plan_id//""),(.source//""),(.salesperson_code//""),((.synthetic//0)|tostring),(.created_at//""),(.shop_updated_at//""),(.last_session_at//"")] | @tsv' "$file")
          }

          {
            echo '## Hermes Connect cabinet audit — PASS'
            echo
            echo '- Source: canonical production D1 binding discovered from the Hermes Cloudflare Pages project.'
            echo '- Operation: SELECT-only; **0 mutations**.'
            echo "- Runtime account rows inspected privately: **$(jq 'length' "$TMP/rows.json")**."
            echo
            echo '### Office / Volkogon identity candidates'
            render_rows "$TMP/office.json"
            echo
            echo '### Vadym-sheet / Vadim-attribution candidates'
            render_rows "$TMP/vadym.json"
            echo
            echo '> Sanitized owner audit only. Raw D1 response is kept only in the ephemeral runner and is not uploaded as an artifact.'
          } > "$RESULT"

          rm -f "$TMP/rows.json" "$TMP/office.json" "$TMP/vadym.json" "$TMP/vadym-names.json" "$TMP/vadym-shops.txt"

      - name: Publish sanitized audit result
        if: always()
        shell: bash
        run: |
          RESULT="${RUNNER_TEMP}/hc-cabinet-audit/result.md"
          if [ -f "$RESULT" ]; then
            gh issue comment 671 --repo "$GITHUB_REPOSITORY" --body-file "$RESULT"
          else
            gh issue comment 671 --repo "$GITHUB_REPOSITORY" --body $'## Hermes Connect cabinet audit — FAILED\n\nThe read-only audit stopped before a sanitized result was produced. No runtime records were changed.'
          fi
