name: Audit Hermes Connect cabinets

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.number == 671 &&
      github.event.comment.body == '/audit-hc-cabinets' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_URL: https://hermeslogisticsus.com
      OIDC_AUDIENCE: hermes-connect-cabinet-audit

    steps:
      - name: Request short-lived GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response_file="${RUNNER_TEMP}/oidc-response.json"
          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          curl -sS --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${OIDC_AUDIENCE}" \
            -o "$response_file"
          token="$(jq -r '.value // empty' "$response_file")"
          if [ -z "$token" ]; then
            echo "GitHub OIDC token request failed."
            cat "$response_file"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Read exact production cabinet state through read-only API
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          TMP="${RUNNER_TEMP}/hc-cabinet-audit"
          RESULT="${TMP}/result.md"
          mkdir -p "$TMP"
          chmod 700 "$TMP"

          fail() {
            printf '%s\n' \
              '## Hermes Connect cabinet audit — FAILED' \
              '' \
              "- ${1}" \
              '- No profile, account, access, registration, booking, or customer data was mutated.' \
              '- No password, token, session cookie, or private customer identifier is published.' \
              > "$RESULT"
            exit 1
          }

          LEDGER_HTTP="$(curl -sS --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 30 \
            -o "$TMP/ledger.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Accept: application/json' \
            "$BASE_URL/api/internal/registrations" || printf 000)"
          if [ "$LEDGER_HTTP" = 401 ] || [ "$LEDGER_HTTP" = 403 ]; then
            fail 'Workflow-bound read-only OIDC identity was rejected by production.'
          fi
          [ "$LEDGER_HTTP" = 200 ] && [ "$(jq -r '.success // false' "$TMP/ledger.json" 2>/dev/null)" = true ] \
            || fail "Read-only registration ledger returned HTTP ${LEDGER_HTTP}."

          cat > "$TMP/vadym-shops.txt" <<'EOF'
          Joe's Auto Repair
          Arkansas Automotive
          Arkansas Auto Repair
          HCS Auto Repair
          The KAR Shop
          First Call mobile Mechanic Automotive Service
          George Barton's Auto Shop
          Bear mountain Automotive LLC
          Weber Automotive Repairs
          Garage Thirty
          Titan Auto Shop
          Bill's Automotive Repair Shop
          Advanced Automotive Shop
          Conway Collision Center
          KK Performance Colony West Conoco Automotive
          Pinnacle Automotive
          Freyaldenhoven Automotive
          Skyline Automotive
          Parkway Automotive
          Cantrell Service Center
          Joes Garage
          Coleman & Son Automotive
          Fosters Garage
          Halter's Body Shop
          Reverse Collision
          EOF
          sed -i 's/^          //' "$TMP/vadym-shops.txt"

          jq '
            [.registrations[]
              | select(
                  ((.email // "") | ascii_downcase) == "officeus@hermeslogisticsus.com"
                  or (((.email // "") | ascii_downcase) | startswith("office@"))
                )
            ]
          ' "$TMP/ledger.json" > "$TMP/office.json"

          jq -Rn '[inputs | select(length>0) | ascii_downcase | gsub("[^a-z0-9]+"; " ") | gsub("^ +| +$"; "")]' < "$TMP/vadym-shops.txt" > "$TMP/vadym-names.json"
          jq --slurpfile names "$TMP/vadym-names.json" '
            def norm:
              ascii_downcase
              | gsub("[^a-z0-9]+"; " ")
              | gsub("^ +| +$"; "");
            [.registrations[]
              | ((.shop_name // "") | norm) as $shop
              | (([.salesperson_code, .source, .email] | map(. // "") | join(" ")) | ascii_downcase) as $attrib
              | select(
                  ($shop != "" and ($names[0] | index($shop)) != null)
                  or ($attrib | test("vadim|vadym"))
                )
            ]
          ' "$TMP/ledger.json" > "$TMP/vadym.json"

          mask_email() {
            local email="$1"
            if [[ "$email" == *@* ]]; then
              local localpart="${email%@*}" domain="${email#*@}"
              printf '%s***@%s' "${localpart:0:1}" "$domain"
            else
              printf '—'
            fi
          }

          render_rows() {
            local file="$1"
            local count
            count="$(jq 'length' "$file")"
            if [ "$count" = 0 ]; then
              echo '- No matching runtime registration found.'
              return
            fi
            while IFS=$'\t' read -r shop email role profile access source salesperson synthetic last_session; do
              [ -n "$shop" ] || shop='(no shop profile)'
              email="$(mask_email "$email")"
              printf -- '- **%s** · %s · role `%s` · profile `%s` · access `%s` · source `%s` · salesperson `%s` · synthetic `%s` · last session `%s`\n' \
                "$shop" "$email" "${role:-—}" "${profile:-0}" "${access:-—}" "${source:-—}" "${salesperson:-—}" "${synthetic:-0}" "${last_session:-—}"
            done < <(jq -r '.[] | [(.shop_name//""),(.email//""),(.role//""),((.profile_complete//0)|tostring),(.access_state//""),(.source//""),(.salesperson_code//""),((.synthetic//0)|tostring),(.last_session_at//"")] | @tsv' "$file")
          }

          {
            echo '## Hermes Connect cabinet audit — PASS'
            echo
            echo '- Production workflow OIDC: PASS.'
            echo '- Read-only registration ledger: PASS.'
            echo "- Registration ledger rows loaded: **$(jq '.registrations | length' "$TMP/ledger.json")**."
            echo
            echo '### Office identity match'
            render_rows "$TMP/office.json"
            echo
            echo '### Vadym-sheet / Vadim-attribution matches'
            render_rows "$TMP/vadym.json"
            echo
            echo '> Read-only audit only. No runtime records were changed and no unmasked private email or credential was published.'
          } > "$RESULT"

      - name: Publish sanitized audit result
        if: always()
        shell: bash
        run: |
          RESULT="${RUNNER_TEMP}/hc-cabinet-audit/result.md"
          if [ -f "$RESULT" ]; then
            gh issue comment 671 --repo "$GITHUB_REPOSITORY" --body-file "$RESULT"
          else
            gh issue comment 671 --repo "$GITHUB_REPOSITORY" --body $'## Hermes Connect cabinet audit — FAILED\n\nThe audit stopped before a sanitized result was produced. No runtime records were changed.'
          fi
